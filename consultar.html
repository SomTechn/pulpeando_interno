<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F1729">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" href="icono-192.png" type="image/png">
<link rel="apple-touch-icon" href="icono-192.png">
<title>Consultar · Pulpeando</title>
<script src="config.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="ui.css">
<style>
.zona{flex:1;display:flex;flex-direction:column;min-height:0;padding:14px 16px 0}

/* La busqueda queda arriba SIEMPRE, incluso con un producto abierto: el
   siguiente articulo esta a un escaneo de distancia y asi no hay que volver. */
.busca{display:flex;gap:10px;flex:0 0 auto;margin-bottom:12px}
.busca .campo{height:56px}
.busca .campo input{font-size:16px}
.btn-camara{width:56px;height:56px;flex:0 0 auto}

.cuerpo{flex:1;overflow-y:auto;min-height:0;padding-bottom:28px}

/* ---- resultados de la busqueda ---- */
.res{display:flex;align-items:center;gap:13px;width:100%;text-align:left;
  background:var(--panel);border:1px solid var(--linea);border-radius:var(--r-md);
  padding:13px 15px;margin-bottom:9px}
.res:hover{border-color:#C9D6E8}
.res:active{transform:scale(.995)}
.res-txt{flex:1;min-width:0}
.res-nom{display:block;font-weight:700;font-size:14.5px;line-height:1.3}
.res-sub{display:block;font-size:12px;color:var(--tenue);margin-top:3px;
  font-family:var(--num);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.res-fin{flex:0 0 auto;text-align:right}
.res-fin b{display:block;font-family:var(--num);font-size:15px;font-weight:700}
.res-fin small{display:block;font-size:11.5px;color:var(--tenue);margin-top:2px}

.vacio{text-align:center;padding:44px 20px;color:var(--tenue)}
.vacio b{display:block;font-size:16px;color:var(--tinta);margin-bottom:6px}
.vacio p{font-size:13.5px;line-height:1.5;max-width:340px;margin:0 auto}

/* ---- el perfil ---- */
.ficha{background:var(--panel);border:1px solid var(--linea);border-radius:var(--r-md);
  padding:16px 18px;margin-bottom:12px}
.ficha-enc{display:flex;gap:14px;align-items:flex-start}
.ficha-id{flex:1;min-width:0}
.ficha-id h1{font-size:20px;font-weight:800;line-height:1.25;letter-spacing:-.01em;
  overflow-wrap:anywhere}
.ficha-cod{display:block;font-family:var(--num);font-size:12.5px;color:var(--tenue);
  margin-top:5px;overflow-wrap:anywhere}
.ficha-precio{flex:0 0 auto;text-align:right}
.ficha-precio b{display:block;font-family:var(--num);font-size:24px;font-weight:700;
  line-height:1.1;letter-spacing:-.02em;white-space:nowrap}
.ficha-precio small{display:block;font-size:11.5px;color:var(--tenue);margin-top:3px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.chip{padding:4px 10px;border-radius:999px;background:var(--fondo);font-size:11.5px;
  font-weight:700;color:var(--tenue)}
.chip.alerta{background:#FFF4E0;color:#8A5A00}
.chip.malo{background:#FFEDF1;color:#9F1239}

.titulin{font-size:11.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;
  color:#9AA8BC;margin-bottom:9px}

/* existencia: el total grande y el desglose al lado */
/* La tarjeta de inventario, como en el equipo de mano de un supermercado:
   la existencia total en grande y al lado cuanto hay en cada lugar. Editar
   va DENTRO de la tarjeta, pegado a los numeros que corrige. */
.tarjeta-enc{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.tarjeta-enc .titulin{flex:1;min-width:0;margin:0}
.enlace{display:inline-flex;align-items:center;justify-content:center;gap:6px;
  flex:0 0 auto;min-height:40px;padding:0 15px;border-radius:999px;
  background:var(--azul-suave);color:var(--azul);font-size:13.5px;font-weight:800}
.enlace:active{transform:scale(.97)}

/* Tres lugares caben de frente. Con cuatro, 3+1 deja un hueco feo: mejor
   dos y dos. De tablet para arriba caben todos en una fila. */
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}
.tiles.n1{grid-template-columns:1fr}
.tiles.n2{grid-template-columns:repeat(2,minmax(0,1fr))}
.tiles.n4{grid-template-columns:repeat(2,minmax(0,1fr))}
.tile{background:var(--fondo);border-radius:var(--r-sm);padding:12px 10px;
  text-align:center;min-width:0}
/* Los lugares se tocan para ver y pasar mercaderia, asi que son botones.
   Un boton trae borde, fuente y color propios del navegador: se le quitan. */
button.tile{border:0;width:100%;font:inherit;color:inherit;cursor:pointer;
  position:relative;transition:transform .08s}
button.tile:active{transform:scale(.97)}
button.tile::after{content:'';position:absolute;right:7px;top:9px;width:6px;
  height:6px;border-right:2px solid var(--claro);border-bottom:2px solid var(--claro);
  transform:rotate(-45deg);opacity:.75}
button.tile.fuerte::after{border-color:#9AA8BC}
.tile b{display:block;font-family:var(--num);font-size:26px;font-weight:700;
  line-height:1.05;letter-spacing:-.03em;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis}
.tile small{display:block;font-size:11px;font-weight:700;color:var(--tenue);
  margin-top:5px;line-height:1.3;overflow-wrap:anywhere}
.tile.fuerte{background:var(--tinta);color:#fff}
.tile.fuerte small{color:#9AA8BC}
.tile.fuerte.bajo{background:#7F1D32}
.tile.vacio b{color:var(--claro)}
.tile-pie{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:12px;
  font-size:12px;color:var(--tenue);line-height:1.5}
.tile-pie b{font-family:var(--num);font-weight:700;color:var(--tinta)}
.lugar-pie{font-size:11.5px;color:var(--claro);line-height:1.45;margin-top:10px}
.lugar{display:flex;align-items:center;gap:10px;padding:3px 0}
.lugar-nom{flex:1;min-width:0;font-size:13.5px;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis}
.lugar-n{flex:0 0 auto;font-family:var(--num);font-size:14px;font-weight:700;
  min-width:46px;text-align:right}

/* la hoja de lugares: cada lugar con lo que tiene y a donde se puede pasar */
/* Dos lineas por fila. En una sola, el nombre del lugar peleaba el ancho con
   la cifra y con el texto de la accion, y en celular se partia en tres
   renglones. Arriba el nombre y la cifra; abajo el codigo y a donde va. */
.filas{display:flex;flex-direction:column;gap:7px;margin-top:4px}
.fila-l{display:block;width:100%;text-align:left;background:var(--fondo);
  border:1px solid transparent;border-radius:var(--r-sm);padding:11px 13px;
  font:inherit;color:inherit}
button.fila-l{cursor:pointer;transition:border-color .12s,transform .08s}
button.fila-l:hover{border-color:#C9D6E8}
button.fila-l:active{transform:scale(.995)}
.fila-l.aqui{background:#EEF4FF;border-color:#BFD4F5}
.fila-alto{display:flex;align-items:baseline;gap:10px}
.fila-alto b{flex:1;min-width:0;font-size:14.5px;font-weight:700;line-height:1.3;
  overflow-wrap:anywhere}
.fila-n{flex:0 0 auto;font-family:var(--num);font-size:19px;font-weight:700;
  line-height:1.1;white-space:nowrap}
.fila-n i{font-style:normal;font-size:11px;font-weight:700;color:var(--tenue);
  margin-left:3px}
.fila-bajo{display:flex;align-items:center;gap:10px;margin-top:3px}
.fila-bajo small{flex:1;min-width:0;font-size:11.5px;color:var(--tenue);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fila-ir{flex:0 0 auto;font-size:12px;font-weight:700;color:var(--azul);
  white-space:nowrap}
.fila-l.aqui .fila-n{color:var(--azul)}
.de-a{display:flex;align-items:center;gap:9px;margin:14px 0 2px;font-size:13px}
.de-a .caja{flex:1;min-width:0;background:var(--fondo);border-radius:var(--r-sm);
  padding:9px 11px}
.de-a .caja small{display:block;font-size:10.5px;font-weight:700;color:var(--tenue);
  text-transform:uppercase;letter-spacing:.03em}
.de-a .caja b{display:block;font-size:13.5px;font-weight:700;margin-top:2px;
  overflow-wrap:anywhere}
.de-a .flecha{flex:0 0 auto;color:var(--claro);font-size:17px}
/* min-height 40: un enlace de 27px es muy chico para un dedo. */
.todo{display:block;background:none;border:0;font:inherit;font-size:12.5px;
  font-weight:700;color:var(--azul);cursor:pointer;padding:10px 2px;
  min-height:40px;text-align:left}

/* los ultimos conteos */
.cnt{display:flex;align-items:center;gap:12px;padding:10px 0;
  border-bottom:1px solid var(--linea)}
.cnt:last-child{border-bottom:none;padding-bottom:0}
.cnt-txt{flex:1;min-width:0}
.cnt-txt b{display:block;font-size:13.5px;font-weight:600;line-height:1.35;
  overflow-wrap:anywhere}
.cnt-txt small{display:block;font-size:11.5px;color:var(--tenue);margin-top:3px;
  line-height:1.4}
/* El numero del documento no se parte a la mitad: "AJ-S01-" en un renglon y
   "000003" en el otro no es un numero, es ruido. */
.nowrap{white-space:nowrap}
.cnt-fin{flex:0 0 auto;text-align:right}
.cnt-fin b{display:block;font-family:var(--num);font-size:15px;font-weight:700}
.cnt-fin b.menos{color:var(--rojo)}
.cnt-fin b.mas{color:var(--verde-oscuro)}
.cnt-fin small{display:block;font-size:10.5px;font-weight:800;text-transform:uppercase;
  letter-spacing:.03em;margin-top:3px;color:var(--tenue)}
.cnt-fin small.espera{color:#8A5A00}
.cnt-fin small.no{color:var(--rojo)}

/* la grafica: cinco barras dibujadas con CSS. Sin libreria: la app tiene que
   abrir sin internet y una grafica de cinco barras no justifica un paquete. */
.graf{display:flex;align-items:flex-end;gap:8px;height:132px;margin-top:4px}
.gcol{flex:1;display:flex;flex-direction:column;justify-content:flex-end;
  align-items:center;gap:6px;height:100%;min-width:0}
.gnum{font-family:var(--num);font-size:12px;font-weight:700;line-height:1;
  white-space:nowrap}
.gbarra{width:100%;max-width:58px;border-radius:7px 7px 3px 3px;background:var(--azul);
  min-height:3px;transition:height .25s}
.gcol.vacia .gbarra{background:var(--linea)}
.gcol.vacia .gnum{color:var(--claro)}
.gcol.ahora .gbarra{background:var(--verde)}
.gpie{display:flex;gap:8px;margin-top:9px}
.gpie div{flex:1;text-align:center;font-size:11px;color:var(--tenue);line-height:1.35;
  min-width:0}
.gpie b{display:block;font-weight:700;color:var(--tinta);font-size:11.5px}
.graf-tot{display:flex;justify-content:space-between;gap:12px;margin-top:12px;
  padding-top:11px;border-top:1px solid var(--linea);font-size:13px}
.graf-tot b{font-family:var(--num);font-weight:700}

/* vencimientos */
.lote{display:flex;align-items:center;gap:12px;padding:10px 0;
  border-bottom:1px solid var(--linea)}
.lote:last-child{border-bottom:none;padding-bottom:0}
.lote-txt{flex:1;min-width:0}
.lote-txt b{display:block;font-family:var(--num);font-size:13.5px;font-weight:600}
.lote-txt small{display:block;font-size:12px;color:var(--tenue);margin-top:2px}
.lote-n{flex:0 0 auto;font-family:var(--num);font-size:15px;font-weight:700}
.semaforo{width:9px;height:9px;border-radius:50%;flex:0 0 auto;background:var(--verde)}
.semaforo.cerca{background:var(--ambar)}
.semaforo.vencido{background:var(--rojo)}
.lote.vencido .lote-txt small{color:var(--rojo);font-weight:700}

/* datos sueltos */
.datos{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 18px}
.dato small{display:block;font-size:11.5px;color:var(--tenue);margin-bottom:3px}
.dato b{font-family:var(--num);font-size:14.5px;font-weight:700;overflow-wrap:anywhere}

.acciones-ficha{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
/* Estos dos botones van sobre el fondo de la pagina, no sobre un panel
   blanco: con el gris de .secundario se perderian y parecerian texto. */
.acciones-ficha .btn{flex:1;min-width:150px;background:var(--panel);
  border:1px solid var(--linea);color:var(--tinta);box-shadow:var(--sombra)}
.acciones-ficha .btn:hover{border-color:#C9D6E8}
.acciones-ficha .btn:active{transform:scale(.99)}

/* ajustes esperando aprobacion */
.pend{background:#FFF9EC;border:1px solid #F3E2BC;border-radius:var(--r-md);
  padding:14px 16px;margin-bottom:12px}
.pend .titulin{color:#8A5A00}
.pend-fila{display:flex;align-items:center;gap:12px;padding:9px 0;
  border-bottom:1px solid #F3E2BC}
.pend-fila:last-of-type{border-bottom:none}
.pend-txt{flex:1;min-width:0}
.pend-txt b{display:block;font-size:13.5px;line-height:1.35;overflow-wrap:anywhere}
.pend-txt small{display:block;font-size:12px;color:#8A5A00;margin-top:2px;
  line-height:1.4}
.pend-dif{flex:0 0 auto;font-family:var(--num);font-size:16px;font-weight:700;
  color:var(--rojo);white-space:nowrap}
.pend-dif.mas{color:var(--verde-oscuro)}
.pend-acc{display:flex;gap:9px;margin-top:11px}
.pend-acc .btn{flex:1;height:44px;font-size:14px}
.pend-acc .btn.si{background:var(--verde);color:#fff}
.pend-acc .btn.no{background:var(--panel);border:1px solid #F3E2BC;color:#8A5A00}
.pend-espera{font-size:12.5px;color:#8A5A00;margin-top:10px;line-height:1.45}

/* editar inventario: una fila por ubicacion */
.edit-fila{display:flex;align-items:center;gap:11px;padding:9px 0;
  border-bottom:1px solid var(--linea)}
.edit-fila:last-child{border-bottom:none}
.edit-nom{flex:1;min-width:0}
/* El nombre del lugar se parte en dos renglones antes que recortarse:
   "Refrigerador de la entrada" cortado no sirve para elegir donde contar. */
.edit-nom b{display:block;font-size:14px;font-weight:600;line-height:1.3;
  overflow-wrap:anywhere}
.edit-nom small{display:block;font-size:11.5px;color:var(--tenue);margin-top:2px}
/* min-width:auto de los controles de formulario le gana al flex-basis: sin
   width y min-width el campo se queda con 230 de los 320 de la hoja y el
   nombre del lugar desaparece. */
.edit-fila input{flex:0 0 auto;width:92px;min-width:0;height:46px;
  border:1.5px solid var(--linea);border-radius:var(--r-sm);padding:0 10px;
  outline:none;text-align:right;font-family:var(--num);font-size:16px;
  font-weight:600;background:var(--panel)}
.edit-fila input:focus{border-color:var(--azul)}
.edit-fila.cambiada input{border-color:var(--ambar);background:#FFF9EC}
.edit-dif{flex:0 0 46px;text-align:right;font-family:var(--num);font-size:13px;
  font-weight:700;color:var(--tenue)}
.edit-dif.menos{color:var(--rojo)}
.edit-dif.mas{color:var(--verde-oscuro)}

/* el campo del conteo: grande, porque se escribe de pie y con una mano */
.cant-g{display:flex;gap:10px;align-items:stretch}
.cant-g input{flex:1;min-width:0;height:62px;border:1.5px solid var(--linea);
  border-radius:var(--r-md);padding:0 16px;outline:none;text-align:right;
  font-family:var(--num);font-size:28px;font-weight:700;background:var(--panel)}
.cant-g input:focus{border-color:var(--azul)}
/* lo que se lleva sumado de los distintos puntos del piso */
.suma{display:flex;align-items:center;gap:11px;margin-top:11px;padding:11px 13px;
  border-radius:var(--r-sm);background:var(--azul-suave);color:var(--azul);
  font-size:13px;line-height:1.4}
.suma span{flex:1;min-width:0;font-family:var(--num);overflow-wrap:anywhere}
.suma b{flex:0 0 auto;font-family:var(--num);font-size:16px;font-weight:700}
.suma .borrar{flex:0 0 auto;width:30px;height:30px;border-radius:50%;
  background:var(--panel);color:var(--azul);font-size:14px;font-weight:700}

/* el aviso de la bodega, en la tarjeta de inventario */
.bodega-av{display:flex;align-items:center;gap:9px;margin-top:12px;padding:10px 12px;
  border-radius:var(--r-sm);font-size:12.5px;line-height:1.45}
.bodega-av.ok{background:#E7F7EE;color:var(--verde-oscuro)}
.bodega-av.no{background:#FFF4E0;color:#8A5A00}
.bodega-av a{font-weight:800;text-decoration:underline;white-space:nowrap}

.entrada{height:50px;border:1.5px solid var(--linea);border-radius:var(--r-md);
  padding:0 14px;outline:none;font-size:15px;background:var(--panel);width:100%}
.entrada:focus{border-color:var(--azul)}
select.entrada{appearance:none;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='20' height='20' viewBox='0 0 24 24' fill='none' stroke='%236B7A90' stroke-width='2.2' stroke-linecap='round'><path d='m6 9 6 6 6-6'/></svg>");
  background-repeat:no-repeat;background-position:right 12px center;padding-right:38px}
.aviso{border-radius:var(--r-sm);padding:11px 13px;font-size:13px;line-height:1.45;
  margin-bottom:12px}
.aviso.malo{background:#FFEDF1;color:#9F1239}
.aviso.bien{background:#E7F7EE;color:var(--verde-oscuro)}
.aviso.ojo{background:#FFF4E0;color:#8A5A00}
.acciones{display:flex;gap:10px;margin-top:18px}
.acciones .btn{flex:1}

@media (min-width:821px){
  .tiles,.tiles.n4{grid-template-columns:repeat(auto-fit,minmax(118px,1fr))}
}
@media (max-width:820px){
  .zona{padding:12px 14px 0}
  .ficha{padding:14px 15px}
  .ficha-enc{flex-direction:column;gap:10px}
  .ficha-precio{text-align:left}
  .tile b{font-size:22px}
  .tile{padding:11px 8px}
  .graf{height:112px;gap:5px}
  .gpie{gap:5px}
  .acciones-ficha .btn{min-width:0}
}
@media (max-width:420px){
  .datos{grid-template-columns:1fr}
  .tiles{gap:7px}
  .tile b{font-size:20px}
  .tile small{font-size:10px}
  .edit-fila{gap:8px}
  .edit-fila input{width:80px}
  .edit-dif{flex:0 0 38px;font-size:12px}
  .gnum{font-size:11px}
  .gpie div{font-size:10px}
}
</style>
</head>
<body>

<div class="oscura oculto" id="p-config">
  <div class="tarjeta-oscura">
    <div class="marca"><span>◧</span> Configuración</div>
    <div class="titulo-o">Falta conectar el proyecto</div>
    <p class="sub-o">Ponga la URL y la llave publishable en <b>config.js</b>.</p>
  </div>
</div>

<div class="oscura oculto" id="p-sesion">
  <div class="tarjeta-oscura">
    <div class="marca"><span>◧</span> Consultar</div>
    <div class="titulo-o">Iniciar sesión</div>
    <p class="sub-o">Use el correo con el que su gerente lo dio de alta</p>
    <input class="campo-o" id="s-email" type="email" placeholder="correo@negocio.hn" autocomplete="username">
    <input class="campo-o" id="s-clave" type="password" placeholder="Contraseña" autocomplete="current-password">
    <div class="error-o" id="s-error"></div>
    <button class="btn-o" id="s-entrar">Entrar</button>
  </div>
</div>

<div class="oscura oculto" id="p-bloqueado">
  <div class="tarjeta-oscura">
    <div class="marca"><span>◧</span> Consultar</div>
    <div class="titulo-o" id="bl-titulo">Sin permiso</div>
    <p class="sub-o" id="bl-texto"></p>
    <a class="btn-o" href="index.html" style="display:block;line-height:52px">Ir a la caja</a>
    <button class="btn-o fantasma" id="bl-salir">Cerrar sesión</button>
  </div>
</div>

<div class="armazon oculto" id="app">
  <aside id="menu"></aside>

  <div class="principal">
    <header class="barra">
      <button class="hamburguesa" id="abrir-menu" aria-label="Menú">
        <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <div class="barra-titulo">
        <b>Consultar</b>
        <small id="h-sucursal">—</small>
      </div>
      <div class="barra-fin">
        <span class="pill" id="h-usuario">—</span>
      </div>
    </header>

    <div class="zona">
      <div class="busca">
        <label class="campo">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input id="buscar" placeholder="Código o nombre"
                 autocomplete="off" enterkeyhint="search">
        </label>
        <button class="btn-camara oculto" id="btn-camara" aria-label="Escanear">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2"/>
            <path d="M7 12h10"/></svg>
        </button>
      </div>

      <div class="cuerpo" id="cuerpo"></div>
    </div>
  </div>
</div>

<div class="velo oculto" id="velo"><div class="hoja" id="hoja"></div></div>

<script type="module">
const CFG = window.SUPABASE_CONFIG || {};
const SUPABASE_URL = CFG.url || 'PEGUE_AQUI_LA_URL';
const SUPABASE_KEY = CFG.key || 'PEGUE_AQUI_LA_LLAVE';

const $  = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const ver = (id, si = true) => $(id).classList.toggle('oculto', !si);

if (SUPABASE_URL.startsWith('PEGUE')){ ver('#p-config'); throw new Error('sin configurar'); }

import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
import { montarMenu, escapar } from './menu.js';
import { escanear, hayCamara } from './escaner.js';

const sb = createClient(SUPABASE_URL, SUPABASE_KEY, {
  auth:{ persistSession:true, autoRefreshToken:true }
});

const S = {
  ctx:null, sucursal:null, moneda:'L', menu:null, nivel:0,
  vista:'inicio',        // inicio · resultados · ficha
  busqueda:'', resultados:[],
  prod:null, semanas:[], conteos:[], cargando:false,
  pendientes:[], puedeAprobar:false, causas:[],
  bodega:null, sumados:[]
};

const money = n => S.moneda + ' ' + (Number(n)||0).toLocaleString('es-HN',
  { minimumFractionDigits:2, maximumFractionDigits:2 });

/* Las cantidades vienen con tres decimales de la base. En pantalla "14.000"
   se lee peor que "14", y "0.500" peor que "0.5". */
function cant(n){
  const x = Number(n) || 0;
  return x.toLocaleString('es-HN', { maximumFractionDigits:3 });
}

function limpiarError(e){
  // Antes se cortaba hasta el primer ":", lo que se comia la mitad de los
  // mensajes propios: "Falta: Bodega de arriba" quedaba en "Bodega de
  // arriba". Ahora solo se quita el prefijo tecnico de Postgres.
  const m = (e?.message || String(e))
    .replace(/^(?:[0-9A-Z]{5}|error|Error|ERROR):\s*/, '');
  if (/JWT|token/i.test(m)) return 'La sesión venció. Vuelva a entrar.';
  if (/Failed to fetch|NetworkError/i.test(m)) return 'Sin conexión con el servidor';
  return m;
}

function aviso(titulo, texto){
  $('#hoja').innerHTML = `<h2>${escapar(titulo)}</h2>
    <p class="sub">${escapar(texto)}</p>
    <button class="btn principal-b" style="width:100%" id="ok">Entendido</button>`;
  ver('#velo');
  $('#ok').onclick = () => ver('#velo', false);
}

const cerrarHoja = () => ver('#velo', false);
$('#velo').addEventListener('click', e => { if (e.target === $('#velo')) cerrarHoja(); });

/* ================= sesión ================= */
$('#s-entrar').addEventListener('click', async () => {
  const b = $('#s-entrar');
  $('#s-error').textContent = '';
  b.disabled = true; b.innerHTML = '<span class="girando"></span>';
  const { error } = await sb.auth.signInWithPassword({
    email:$('#s-email').value.trim(), password:$('#s-clave').value });
  b.disabled = false; b.textContent = 'Entrar';
  if (error){ $('#s-error').textContent = 'Correo o contraseña incorrectos'; return; }
  arrancar();
});
$('#s-clave').addEventListener('keydown', e => { if (e.key === 'Enter') $('#s-entrar').click(); });
$('#bl-salir').addEventListener('click', async () => { await sb.auth.signOut(); location.reload(); });

/* ================= arranque ================= */
async function arrancar(){
  const { data:{ session } } = await sb.auth.getSession();
  if (!session){ ver('#p-sesion'); return; }
  ver('#p-sesion', false);

  const { data, error } = await sb.rpc('fn_pos_contexto');
  if (error){
    ver('#p-sesion');
    $('#s-error').textContent = 'Su usuario no tiene perfil en ningún negocio';
    await sb.auth.signOut();
    return;
  }
  S.ctx = data;
  S.nivel = data.usuario.nivel;
  S.moneda = data.organizacion.moneda === 'HNL' ? 'L' : data.organizacion.moneda;

  if (S.nivel < 1){
    ver('#p-bloqueado');
    $('#bl-titulo').textContent = 'Esta pantalla no es para su rol';
    $('#bl-texto').textContent = 'La consulta de productos es para el personal de la tienda.';
    return;
  }

  S.sucursal = data.sucursales[0]?.id || null;
  S.puedeAprobar = S.nivel >= 3;      // gerente para arriba
  $('#h-usuario').textContent = data.usuario.nombre;
  $('#h-sucursal').textContent = data.sucursales[0]?.nombre || '';
  $('#app').classList.remove('oculto');

  S.menu = montarMenu({
    contenedor:'#menu', modulo:'consultar', ctx:S.ctx,
    alSalir: async () => { await sb.auth.signOut(); location.reload(); }
  });
  $('#abrir-menu').addEventListener('click', () => S.menu.alternar());

  if (await hayCamara()) ver('#btn-camara');
  $('#btn-camara').addEventListener('click', escanearCodigo);

  await Promise.all([cargarPendientes(), cargarCausas(), cargarBodega()]);
  pintar();
  $('#buscar').focus();
}

/* Como esta la bodega. El conteo del piso depende de esto, asi que se lee al
   abrir la pantalla y se refresca cada vez que se abre un producto. */
async function cargarBodega(){
  const { data, error } = await sb.rpc('fn_estado_bodega',
    { p_sucursal_id:S.sucursal, p_horas:24 });
  S.bodega = error ? null : data;
}

/* El catalogo de causas de merma. Se lee una vez al abrir la pantalla: es
   corto y no cambia en medio de un turno. */
async function cargarCausas(){
  const { data, error } = await sb.rpc('fn_causas_merma', { p_solo_activas:true });
  S.causas = error ? [] : (data || []);
}

/* Los ajustes que estan esperando aprobacion. En la portada de esta pantalla
   porque es la que mas se abre: un ajuste pendiente que nadie ve es
   inventario que nadie corrige. */
async function cargarPendientes(){
  const { data, error } = await sb.rpc('fn_ajustes',
    { p_estado:'pendiente', p_sucursal_id:S.sucursal, p_limite:30 });
  S.pendientes = error ? [] : (data || []);
}

/* ================= buscar ================= */
const caja = $('#buscar');

caja.addEventListener('input', e => {
  S.busqueda = e.target.value;
  clearTimeout(caja._t);
  if (!S.busqueda.trim()){ S.vista = 'inicio'; S.resultados = []; pintar(); return; }
  caja._t = setTimeout(buscar, 260);
});

/* Enter con un solo resultado entra directo. Es el gesto de la caja: el lector
   de codigos manda un Enter al final de cada lectura. */
caja.addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  e.preventDefault();
  clearTimeout(caja._t);
  buscar({ entrarSiEsUno:true });
});

async function buscar({ entrarSiEsUno = false } = {}){
  const q = S.busqueda.trim();
  if (!q) return;

  S.vista = 'resultados'; S.cargando = true; pintar();

  const { data, error } = await sb.rpc('fn_buscar_para_consulta', {
    p_busqueda:q, p_sucursal_id:S.sucursal, p_limite:25 });

  S.cargando = false;
  if (error){ aviso('No se pudo buscar', limpiarError(error)); S.vista='inicio'; pintar(); return; }

  S.resultados = data || [];

  // Un codigo de barras exacto no necesita lista intermedia.
  const unico = S.resultados.length === 1;
  const porCodigo = S.resultados.length && S.resultados[0].exacto;
  if (porCodigo || (entrarSiEsUno && unico)){
    await abrir(S.resultados[0].producto_id);
    return;
  }
  pintar();
}

async function escanearCodigo(){
  const codigo = await escanear();
  if (!codigo) return;
  S.busqueda = codigo;
  caja.value = codigo;
  await buscar({ entrarSiEsUno:true });
}

/* ================= abrir el producto ================= */
async function abrir(id){
  S.cargando = true; S.vista = 'ficha'; pintar();

  const [perfil, semanas, conteos] = await Promise.all([
    sb.rpc('fn_consultar_producto', { p_producto_id:id, p_sucursal_id:S.sucursal }),
    sb.rpc('fn_ventas_producto_semanas', { p_producto_id:id, p_semanas:5,
                                           p_sucursal_id:S.sucursal }),
    sb.rpc('fn_conteos_del_producto', { p_producto_id:id, p_sucursal_id:S.sucursal,
                                        p_limite:5 })
  ]);

  S.cargando = false;
  if (perfil.error){
    aviso('No se pudo abrir el producto', limpiarError(perfil.error));
    S.vista = S.resultados.length ? 'resultados' : 'inicio';
    pintar();
    return;
  }

  S.prod = perfil.data;
  S.puedeAprobar = !!perfil.data.puede_aprobar;
  S.semanas = semanas.error ? [] : (semanas.data || []);
  S.conteos = conteos.error ? [] : (conteos.data || []);
  await cargarBodega();
  pintar();
  // El campo queda listo para el siguiente escaneo sin tocar nada.
  caja.select();
}

async function recargarFicha(){
  if (S.prod) await abrir(S.prod.producto_id);
}

/* ================= pintar ================= */
function pintar(){
  if (S.cargando && S.vista !== 'ficha'){
    $('#cuerpo').innerHTML = '<div class="vacio"><span class="girando"></span></div>';
    return;
  }
  if (S.vista === 'inicio')      return pintarInicio();
  if (S.vista === 'resultados')  return pintarResultados();
  return pintarFicha();
}

function pintarInicio(){
  const n = S.pendientes.length;
  const bandeja = n ? `
    <div class="pend">
      <div class="titulin">${n === 1 ? 'Un conteo espera aprobación'
                                     : n + ' conteos esperan aprobación'}</div>
      ${S.pendientes.map(a => `
        <button class="pend-fila" style="width:100%;text-align:left"
                data-abrir="${a.producto_id}">
          <div class="pend-txt">
            <b>${escapar(a.producto)}</b>
            <small>${escapar(a.ubicacion)}${a.lote ? ' · lote ' + escapar(a.lote) : ''} ·
              de ${cant(a.sistema)} a ${cant(a.contado)} · ${escapar(a.solicitado_por || '')}</small>
          </div>
          <span class="pend-dif ${Number(a.diferencia) > 0 ? 'mas' : ''}">${conSigno(a.diferencia)}</span>
        </button>`).join('')}
      <div class="pend-espera">${S.puedeAprobar
        ? 'Toque uno para revisarlo y aprobarlo.'
        : 'El gerente los aprueba. Mientras tanto el inventario no cambia.'}</div>
    </div>` : '';

  $('#cuerpo').innerHTML = bandeja + `
    <div class="vacio">
      <b>¿Qué quiere saber de un producto?</b>
      <p>Escanee el código de barras o escriba el nombre. Verá el precio, cuánto
         hay en el piso de ventas y en la bodega, las ventas de las últimas
         semanas y los vencimientos.</p>
    </div>`;
}

/* -3 en vez de -3, +5 en vez de 5: el signo es el dato */
function conSigno(n){
  const x = Number(n) || 0;
  return (x > 0 ? '+' : x < 0 ? '−' : '') + cant(Math.abs(x));
}

function pintarResultados(){
  if (!S.resultados.length){
    $('#cuerpo').innerHTML = `
      <div class="vacio">
        <b>Nada con «${escapar(S.busqueda.trim())}»</b>
        <p>Revise el nombre, o busque por el código interno. Si el producto es
           nuevo, primero hay que crearlo en Catálogos.</p>
      </div>`;
    return;
  }
  $('#cuerpo').innerHTML = S.resultados.map(r => `
    <button class="res" data-abrir="${r.producto_id}">
      <div class="res-txt">
        <span class="res-nom">${escapar(r.nombre)}</span>
        <span class="res-sub">${escapar(r.categoria)} · ${escapar(r.sku)}${r.codigo ? ' · ' + escapar(r.codigo) : ''}</span>
      </div>
      <div class="res-fin">
        <b>${money(r.precio)}</b>
        <small>${cant(r.existencia)} ${escapar(r.unidad)}</small>
      </div>
    </button>`).join('');
}

function pintarFicha(){
  if (S.cargando || !S.prod){
    $('#cuerpo').innerHTML = '<div class="vacio"><span class="girando"></span></div>';
    return;
  }
  const p = S.prod;
  const ve = p.puede_ver_costos;

  const codigos = (p.codigos || []).join(' · ');
  const chips = [];
  if (p.categoria) chips.push(`<span class="chip">${escapar(p.categoria)}</span>`);
  if (p.marca)     chips.push(`<span class="chip">${escapar(p.marca)}</span>`);
  if (p.proveedor) chips.push(`<span class="chip">${escapar(p.proveedor)}</span>`);
  if (!p.activo)   chips.push('<span class="chip malo">Inactivo</span>');
  else if (!p.se_vende) chips.push('<span class="chip alerta">No se vende</span>');
  if (p.stock_bajo) chips.push('<span class="chip alerta">Bajo el mínimo</span>');
  if (Number(p.apartado) > 0)
    chips.push(`<span class="chip alerta">${cant(p.apartado)} apartado para pedidos</span>`);

  /* ---- existencia: el total y cada lugar, en cifras grandes ---- */
  const lugares = p.ubicaciones || [];
  /* Cada cifra se toca: abre el detalle por lugar, que es desde donde se baja
     a piso y se carga a bodega. */
  const tiles = [
    `<button class="tile fuerte ${p.stock_bajo ? 'bajo' : ''}" data-u="">
       <b>${cant(p.existencia)}</b><small>Existencia</small></button>`,
    ...lugares.map(u => {
      const n = Number(u.cantidad) || 0;
      return `<button class="tile ${n === 0 ? 'vacio' : ''}"
         data-u="${escapar(u.ubicacion_id)}">
        <b>${cant(n)}</b><small>${escapar(u.nombre)}</small></button>`;
    })
  ].join('');

  const pie = [
    Number(p.apartado) > 0 ? `Apartado <b>${cant(p.apartado)}</b>` : '',
    `Mínimo <b>${cant(p.stock_minimo)}</b>`,
    p.stock_maximo ? `Máximo <b>${cant(p.stock_maximo)}</b>` : '',
    ve ? `Costo <b>${money(p.costo_promedio)}</b>` : ''
  ].filter(Boolean).join(' · ');

  /* El conteo del piso depende de la bodega, asi que el estado se ve aqui y
     no escondido dentro de la hoja: quien llega a contar lo sabe antes. */
  const bod = S.bodega;
  const faltanBod = (bod?.ubicaciones || []).filter(u => !u.al_dia);
  const avisoBodega = !bod || !bod.bodegas ? '' : (bod.al_dia
    ? `<div class="bodega-av ok">Bodega auditada hace menos de 24 h. Se puede contar el piso.</div>`
    : `<div class="bodega-av no">Para contar el piso falta auditar
         <b>${escapar(faltanBod.map(u => u.nombre).join(', ') || 'la bodega')}</b>.
         <a href="auditoria.html">Ir a auditar</a></div>`);

  // La regla se explica una vez, abajo, en vez de repetirla en cada cifra.
  const cual = lugares.find(u => u.predeterminada);
  const notaLugar = cual && lugares.length > 1
    ? `<div class="lugar-pie">Lo que entra sin asignarle lugar se cuenta en
         <b>${escapar(cual.nombre)}</b>.</div>`
    : '';

  const otras = (p.otras_sucursales || []).map(o =>
    `<div class="lugar"><span class="lugar-nom">${escapar(o.sucursal)}</span>
     <span class="lugar-n">${cant(o.cantidad)}</span></div>`).join('');

  /* ---- la grafica de cinco semanas ---- */
  const graf = pintarGrafica();

  /* ---- vencimientos ---- */
  const lotes = p.lotes || [];
  const margenDias = p.dias_alerta ?? 30;
  const bloqueLotes = lotes.length ? `
    <div class="ficha">
      <div class="titulin">Vencimientos en inventario</div>
      ${lotes.map(l => {
        const d = l.dias;
        let clase = '', texto = 'Sin fecha de vencimiento';
        if (d !== null && d !== undefined){
          if (d < 0){ clase = 'vencido'; texto = `Vencido hace ${Math.abs(d)} ${Math.abs(d)===1?'día':'días'} · ${fecha(l.vence)}`; }
          else if (d <= margenDias){ clase = 'cerca'; texto = `Vence en ${d} ${d===1?'día':'días'} · ${fecha(l.vence)}`; }
          else { texto = `Vence el ${fecha(l.vence)} · faltan ${d} días`; }
        }
        return `<div class="lote ${clase === 'vencido' ? 'vencido' : ''}">
          <span class="semaforo ${clase}"></span>
          <div class="lote-txt">
            <b>${escapar(l.codigo || 'Lote sin código')}</b>
            <small>${escapar(texto)}</small>
          </div>
          <span class="lote-n">${cant(l.cantidad)}</span>
        </div>`;
      }).join('')}
      ${Number(p.sin_lote) > 0 ? `<div class="lote">
        <span class="semaforo" style="background:var(--linea)"></span>
        <div class="lote-txt"><b>Sin lote</b><small>No se le lleva vencimiento</small></div>
        <span class="lote-n">${cant(p.sin_lote)}</span></div>` : ''}
    </div>` : '';

  /* ---- datos sueltos ---- */
  const uc = p.ultima_compra;
  const datos = [
    ve ? `<div class="dato"><small>Costo promedio</small><b>${money(p.costo_promedio)}</b></div>` : '',
    ve && p.margen !== null && p.margen !== undefined
      ? `<div class="dato"><small>Margen</small><b>${p.margen}%</b></div>` : '',
    ve ? `<div class="dato"><small>Valor del inventario</small><b>${money(p.valor_inventario)}</b></div>` : '',
    `<div class="dato"><small>Mínimo / máximo</small><b>${cant(p.stock_minimo)}${p.stock_maximo ? ' / ' + cant(p.stock_maximo) : ' / —'}</b></div>`,
    `<div class="dato"><small>Vendido en 30 días</small><b>${cant(p.vendido_30d)} ${escapar(p.unidad)}</b></div>`,
    `<div class="dato"><small>Última venta</small><b>${p.ultima_venta ? fecha(p.ultima_venta) : 'Nunca'}</b></div>`,
    uc ? `<div class="dato"><small>Última compra</small><b>${fecha(uc.fecha)}${uc.costo ? ' · ' + money(uc.costo) : ''}</b></div>` : '',
    `<div class="dato"><small>Impuesto</small><b>${(Number(p.tasa_impuesto)*100).toLocaleString('es-HN',{maximumFractionDigits:2})}%</b></div>`
  ].filter(Boolean).join('');

  /* ---- los ultimos conteos de este producto ----
     Sin esto nadie sabe si lo que esta mirando se reviso ayer o hace tres
     meses, y se vuelve a contar lo mismo. */
  const ESTADO = { pendiente:['Espera', 'espera'], aprobado:['Aplicado', ''],
                   rechazado:['Rechazado', 'no'], contado:['En la hoja', 'espera'],
                   aplicado:['Aplicado', ''], cancelado:['Cancelado', 'no'] };
  const bloqueConteos = S.conteos.length ? `
    <div class="ficha">
      <div class="titulin">Últimos conteos</div>
      ${S.conteos.map(c => {
        const [et, cl] = ESTADO[c.estado] || [c.estado, ''];
        const dif = c.diferencia;
        const hayDif = dif !== null && dif !== undefined;
        return `<div class="cnt">
          <div class="cnt-txt">
            <b>${c.origen === 'hoja' ? 'Hoja ' + escapar(c.referencia)
                                     : escapar(c.ubicacion || 'Sucursal')}</b>
            <small>${c.origen === 'lugar'
                ? `<span class="nowrap">${escapar(c.referencia)}</span> · ` : ''
              }${escapar(c.quien)} · ${cuando(c.cuando)}${c.lote ? ' · lote ' + escapar(c.lote) : ''}</small>
          </div>
          <div class="cnt-fin">
            <b class="${hayDif ? (Number(dif) > 0 ? 'mas' : Number(dif) < 0 ? 'menos' : '') : ''}"
               >${hayDif ? conSigno(dif) : cant(c.contado)}</b>
            <small class="${cl}">${escapar(et)}</small>
          </div>
        </div>`;
      }).join('')}
    </div>` : '';

  const abierto = p.conteo_abierto;
  const textoConteo = abierto
    ? `Agregar a la hoja ${abierto.numero}`
    : 'Hoja de conteo';

  /* Lo que este producto tiene esperando aprobacion. Va arriba del todo:
     sin esto dos personas piden el mismo ajuste y la segunda solo se entera
     por un error. */
  const pend = p.ajustes_pendientes || [];
  const bloquePend = pend.length ? `
    <div class="pend">
      <div class="titulin">${pend.length === 1 ? 'Conteo esperando aprobación'
                                               : 'Conteos esperando aprobación'}</div>
      ${pend.map(a => `
        <div class="pend-fila">
          <div class="pend-txt">
            <b>${escapar(a.ubicacion)}${a.lote ? ' · lote ' + escapar(a.lote) : ''}</b>
            <small>De ${cant(a.sistema)} a ${cant(a.contado)} · pedido por
              ${escapar(a.solicitado_por || '—')}${a.motivo ? ' · «' + escapar(a.motivo) + '»' : ''}</small>
          </div>
          <span class="pend-dif ${Number(a.diferencia) > 0 ? 'mas' : ''}">${conSigno(a.diferencia)}</span>
        </div>
        ${p.puede_aprobar ? `<div class="pend-acc">
          <button class="btn no" data-rechazar="${a.ajuste_id}">Rechazar</button>
          <button class="btn si" data-aprobar="${a.ajuste_id}">Aprobar</button>
        </div>` : ''}`).join('')}
      ${p.puede_aprobar ? '' :

function pintarGrafica(){
  const sem = S.semanas;
  if (!sem.length) return '<div class="vacio" style="padding:20px">Sin datos de ventas</div>';

  const tope = Math.max(1, ...sem.map(s => Number(s.unidades) || 0));
  const unidades = sem.reduce((a, s) => a + (Number(s.unidades) || 0), 0);
  const importe  = sem.reduce((a, s) => a + (Number(s.importe)  || 0), 0);

  const barras = sem.map((s, i) => {
    const n = Number(s.unidades) || 0;
    // El alto se reparte dejando sitio al numero de arriba.
    const alto = n === 0 ? 3 : Math.max(8, Math.round(n / tope * 100));
    const ahora = i === sem.length - 1;
    return `<div class="gcol ${n === 0 ? 'vacia' : ''} ${ahora ? 'ahora' : ''}"
       title="${cant(n)} ${escapar(S.prod.unidad)} · ${money(s.importe)}">
      <span class="gnum">${cant(n)}</span>
      <span class="gbarra" style="height:${alto}%"></span>
    </div>`;
  }).join('');

  const pies = sem.map((s, i) => {
    const ahora = i === sem.length - 1;
    return `<div><b>${semanaCorta(s.semana_inicio)}</b>${ahora ? 'esta semana' : money(s.importe).replace(S.moneda + ' ', '')}</div>`;
  }).join('');

  return `
    <div class="graf">${barras}</div>
    <div class="gpie">${pies}</div>
    <div class="graf-tot">
      <span>Total de las 5 semanas</span>
      <b>${cant(unidades)} ${escapar(S.prod.unidad)} · ${money(importe)}</b>
    </div>`;
}

/* 2026-10-05 -> "5 oct". La semana se identifica por el lunes con que arranca. */
const MESES = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
function semanaCorta(iso){
  if (!iso) return '—';
  const [a, m, d] = String(iso).slice(0,10).split('-').map(Number);
  return `${d} ${MESES[m-1]}`;
}
/* "ayer 3:40 p. m." pesa menos que una fecha completa cuando lo que importa
   es si fue hace poco. Mas alla de una semana si va la fecha. */
function cuando(v){
  if (!v) return '—';
  const d = new Date(v);
  const dias = Math.floor((Date.now() - d.getTime()) / 86400000);
  const hora = d.toLocaleTimeString('es-HN', { hour:'numeric', minute:'2-digit' });
  if (dias <= 0) return 'hoy ' + hora;
  if (dias === 1) return 'ayer ' + hora;
  if (dias < 7)   return 'hace ' + dias + ' días';
  return fecha(v);
}

function fecha(v){
  if (!v) return '—';
  const [a, m, d] = String(v).slice(0,10).split('-').map(Number);
  return `${d} ${MESES[m-1]} ${a}`;
}
/* Dentro de un desplegable el ancho es poco y el año largo se corta a la
   mitad ("vence 8 ago 202"). Ahí va de dos cifras. */
function fechaMini(v){
  if (!v) return '—';
  const [a, m, d] = String(v).slice(0,10).split('-').map(Number);
  return `${d} ${MESES[m-1]} ${String(a).slice(2)}`;
}
const opcionLote = l =>
  `${escapar(l.codigo || 'Lote')} (${cant(l.cantidad)})` +
  (l.vence ? ' · vence ' + fechaMini(l.vence) : '');

/* ================= registrar merma =================

     por daño        alguien sabe que paso y lo dice (se vencio, se quebro)

  $('#hoja').innerHTML = `

    <p class="sub">${escapar(p.nombre)}</p>
    <div class="campo-g">
      <label for="mr-causa">¿Qué le pasó?</label>
      <select class="entrada" id="mr-causa">
        ${dano.length ? `<optgroup label="Por daño">${dano.map(opt).join('')}</optgroup>` : ''}
        ${desc.length ? `<optgroup label="No se sabe">${desc.map(opt).join('')}</optgroup>` : ''}

    </div>

    <div class="campo-g" style="margin-top:12px">

      <label for="mr-nota">Detalle (opcional)</label>

    </div>
    <div class="aviso ojo" style="margin-top:14px">Esto <b>da de baja la
      mercadería</b> del negocio. Va a aprobación del gerente: hasta entonces
      el inventario no cambia.</div>
    <div class="aviso malo oculto" id="mr-error"></div>
    <div class="acciones">
      <button class="btn secundario" id="mr-no">Cancelar</button>

    </div>`;
  ver('#velo');

  $('#mr-cant').addEventListener('input', e => {
    e.target.value = e.target.value.replace(/[^0-9.]/g, '');
  });

/* ================= editar inventario =================

   Corregir lo que hay en un lugar NO cambia el inventario de una vez: se
   manda a aprobacion. Bajar una existencia es la forma mas comoda de tapar
   un faltante, asi que lo pide uno y lo aprueba otro.
   ===================================================== */
/* El conteo del piso de ventas.

   El piso no se guarda: se CALCULA como el resto -el total menos lo que esta
   asignado a bodega-. Por eso dos cosas:

     · hace falta la bodega auditada hace menos de 24 horas, o la cifra
       contra la que se compara no vale nada;
     · se cuenta el piso ENTERO. Un producto puede estar en la gondola, en la
       punta y junto a la caja, asi que se va sumando con "Agregar mas" y al
       final se manda un solo numero.
*/
function hojaEditar(loteElegido){
  const p = S.prod;
  const lotes = p.lotes || [];
  const haySinLote = Number(p.sin_lote) > 0;
  const lote = loteElegido === undefined
    ? (lotes.length ? lotes[0].lote_id : null)
    : (loteElegido || null);

  const bod = S.bodega;
  const alDia = bod && bod.al_dia;
  const faltan = alDia ? [] :
    (bod?.ubicaciones || []).filter(u => !u.al_dia).map(u => u.nombre);

  if (!alDia){
    $('#hoja').innerHTML = `
      <h2>Primero hay que auditar la bodega</h2>
      <p class="sub">${escapar(p.nombre)}</p>
      <div class="aviso ojo">El piso de ventas se calcula restando lo que hay
        en bodega. Con la bodega sin auditar en las últimas 24 horas, la cifra
        contra la que se compararía el conteo no sirve.</div>
      ${faltan.length ? `<div class="aviso malo">Falta auditar:
        <b>${escapar(faltan.join(', '))}</b>.</div>`
        : '<div class="aviso malo">No hay ninguna ubicación de bodega configurada.</div>'}
      <div class="acciones">
        <button class="btn secundario" id="ed-no">Cerrar</button>
        <a class="btn principal-b" href="auditoria.html"
           style="display:grid;place-items:center">Ir a auditar</a>
      </div>`;
    ver('#velo');
    $('#ed-no').onclick = cerrarHoja;
    return;
  }

  const selLote = (lotes.length || haySinLote) ? `
    <div class="campo-g" style="margin-top:12px">
      <label for="ed-lote">¿De qué lote?</label>
      <select class="entrada" id="ed-lote">
        ${lotes.map(l => `<option value="${l.lote_id}" ${l.lote_id === lote ? 'selected' : ''}
          >${opcionLote(l)}</option>`).join('')}
        ${haySinLote ? `<option value="" ${lote === null ? 'selected' : ''}
          >Sin lote (${cant(p.sin_lote)})</option>` : ''}
      </select>
    </div>` : '';

  $('#hoja').innerHTML = `
    <h2>${escapar(p.nombre)}</h2>
    <p class="sub">${escapar(p.sku)}${(p.codigos || []).length ? ' · ' + escapar(p.codigos[0]) : ''}${
      p.categoria ? ' · ' + escapar(p.categoria) : ''} · se cuenta en
      <b>${escapar(p.unidad)}</b></p>
    ${selLote}
    <div class="campo-g" style="margin-top:12px">
      <label for="ed-cant">Contado en el piso de ventas</label>
      <div class="cant-g">
        <input id="ed-cant" inputmode="decimal" placeholder="0">
      </div>
    </div>
    <button class="btn secundario" id="ed-mas" style="width:100%;margin-top:10px">
      + Agregar más</button>
    <div class="suma oculto" id="ed-suma"></div>
    <div class="campo-g" style="margin-top:14px">
      <label for="ed-motivo">Nota (opcional)</label>
      <input class="entrada" id="ed-motivo" placeholder="Conté góndola y punta…">
    </div>
    <div class="aviso malo oculto" id="ed-error"></div>
    <div class="acciones">
      <button class="btn secundario" id="ed-no">Cancelar</button>
      <button class="btn principal-b" id="ed-si">Guardar</button>
    </div>`;
  ver('#velo');

  S.sumados = [];
  const campo = $('#ed-cant');
  campo.focus();
  campo.addEventListener('input', e => {
    e.target.value = e.target.value.replace(/[^0-9.]/g, '');
    pintarSuma();
  });
  campo.addEventListener('keydown', e => {
    if (e.key === 'Enter'){ e.preventDefault(); $('#ed-mas').click(); }
  });

  /* El total incluye lo que este escrito en el campo, no solo lo ya agregado:
     si dice 20 y al guardar salen 23, el numero de la pantalla mintio. */
  const pintarSuma = () => {
    const z = $('#ed-suma');
    const txt = campo.value.trim();
    const suelto = txt === '' ? null : Number(txt);
    const partes = S.sumados.slice();
    if (suelto >= 0 && txt !== '') partes.push(suelto);
    if (partes.length < 2){ z.classList.add('oculto'); return; }
    const tot = partes.reduce((a, n) => a + n, 0);
    z.classList.remove('oculto');
    z.innerHTML = `<span>${partes.map(cant).join(' + ')}</span>
      <b>${cant(tot)} ${escapar(p.unidad)}</b>
      ${S.sumados.length
        ? '<button class="borrar" id="ed-borrar" aria-label="Quitar el último">✕</button>'
        : ''}`;
    const b = $('#ed-borrar');
    if (b) b.onclick = () => { S.sumados.pop(); pintarSuma(); campo.focus(); };
  };

  $('#ed-mas').onclick = () => {
    const txt = campo.value.trim();
    const n = Number(txt);
    if (txt === '' || !(n >= 0)){
      campo.focus();
      return;
    }
    S.sumados.push(n);
    campo.value = '';
    pintarSuma();
    campo.focus();
  };

  $('#ed-lote')?.addEventListener('change', e => hojaEditar(e.target.value));
  $('#ed-no').onclick = cerrarHoja;
  $('#ed-si').onclick = () => mandarConteoPiso(lote);
}

async function mandarConteoPiso(lote){
  const err = $('#ed-error');
  const fallar = t => { err.textContent = t; err.classList.remove('oculto'); };
  err.classList.add('oculto');

  const txt = $('#ed-cant').value.trim();
  const suelto = txt === '' ? 0 : Number(txt);
  if (txt !== '' && !(suelto >= 0))
    return fallar('Hay una cantidad que no se entiende.');

  const total = S.sumados.reduce((a, n) => a + n, 0) + suelto;
  if (!S.sumados.length && txt === '')
    return fallar('Escriba lo que contó en el piso de ventas.');

  const b = $('#ed-si');
  b.disabled = true; b.innerHTML = '<span class="girando"></span>';

  const { data, error } = await sb.rpc('fn_solicitar_conteo_piso', {
    p_producto_id:S.prod.producto_id,
    p_cantidad:total,
    p_lote_id:lote,
    p_motivo:$('#ed-motivo').value.trim() || null,
    p_sucursal_id:S.sucursal });

  b.disabled = false; b.textContent = 'Guardar';
  if (error) return fallar(limpiarError(error));

  $('#hoja').innerHTML = `
    <h2>Enviado a aprobación</h2>
    <p class="sub">${escapar(S.prod.nombre)}</p>
    <div class="pend-fila">
      <div class="pend-txt">
        <b>Piso de ventas · ${escapar(data.numero)}</b>
        <small>De ${cant(data.sistema)} a ${cant(data.contado)}</small>
      </div>
      <span class="pend-dif ${Number(data.diferencia) > 0 ? 'mas' : ''}">${conSigno(data.diferencia)}</span>
    </div>
    <div class="aviso ojo" style="margin-top:12px">El inventario <b>no cambió
      todavía</b>. ${data.puede_aprobar ? 'Usted puede aprobarlo aquí mismo.'
                                        : 'Cambia cuando el gerente lo apruebe.'}</div>
    <div class="acciones">
      <button class="btn principal-b" id="ed-listo" style="flex:1">Entendido</button>
    </div>`;
  $('#ed-listo').onclick = async () => {
    cerrarHoja();
    await cargarPendientes();
    await recargarFicha();
  };
}

/* ================= bodega: ver por lugar y pasar =================

   Tocar cualquier cifra del inventario abre esto: lo que hay en cada lugar.
   De ahi salen los dos movimientos del dia a dia de una pulperia:

     bajar al piso     se acabo lo que estaba en la gondola
     cargar a bodega   acaba de llegar la compra y no cabe todo afuera

   Las dos son el mismo movimiento al reves, asi que es una sola hoja que
   adivina el destino por el tipo del lugar de donde sale. Nada entra ni sale
   del negocio: el total no se toca, solo cambia donde esta.
   ================================================================= */
function hojaLugares(resaltar){
  const p = S.prod;
  const lugares = p.ubicaciones || [];

  if (lugares.length < 2){
    aviso('Falta configurar ubicaciones',
      'Esta sucursal tiene un solo lugar, así que no hay bodega de dónde bajar. ' +
      'Un supervisor puede agregarla desde Catálogos.');
    return;
  }

  const bodegas = lugares.filter(u => u.tipo === 'bodega');
  const pisos   = lugares.filter(u => u.tipo !== 'bodega');

  const fila = (u) => {
    const n    = Number(u.cantidad) || 0;
    const esB  = u.tipo === 'bodega';
    // De una bodega se baja al piso; del piso se carga a bodega. Si no hay
    // a donde, la fila queda informativa en vez de prometer un botón muerto.
    const haciaDonde = esB ? pisos : bodegas;
    const puede = n > 0 && haciaDonde.length > 0;
    const accion = puede
      ? `<span class="fila-ir">${esB ? 'Bajar al piso →' : 'Cargar a bodega →'}</span>`
      : '';
    // "Piso de ventas · S01-P01" no cabe junto a "Cargar a bodega →" en
    // celular: se corta. La palabra sola alcanza, el titulo ya da el contexto.
    const sub = [esB ? 'Bodega' : 'Piso',
                 u.codigo ? escapar(u.codigo) : ''].filter(Boolean).join(' · ');
    const cuerpo = `
      <div class="fila-alto"><b>${escapar(u.nombre)}</b>
        <span class="fila-n">${cant(n)}<i>${escapar(p.unidad)}</i></span></div>
      <div class="fila-bajo"><small>${sub}</small>${accion}</div>`;
    const clase = `fila-l ${u.ubicacion_id === resaltar ? 'aqui' : ''}`;
    return puede
      ? `<button class="${clase}" data-pasar="${escapar(u.ubicacion_id)}">${cuerpo}</button>`
      : `<div class="${clase}">${cuerpo}</div>`;
  };

  const sinBodega = !bodegas.length;

  /* Cada fila ya ofrece su movimiento, asi que abajo no va un segundo boton
     de "cargar a bodega": repetido obligaba a adivinar de que lugar sale. */
  $('#hoja').innerHTML = `
    <h2>¿Dónde está?</h2>
    <p class="sub"><b>${escapar(p.nombre)}</b> · ${cant(p.existencia)}
      ${escapar(p.unidad)} en total</p>
    <div class="filas">${lugares.map(fila).join('')}</div>
    ${sinBodega
      ? `<div class="lugar-pie">Esta sucursal no tiene ninguna bodega, así que no
           hay a dónde cargar. Un supervisor crea el lugar en Catálogos y lo
           marca como bodega.</div>`
      : `<div class="lugar-pie">Toque un lugar para pasar mercadería desde ahí.
           El total no cambia: solo cambia dónde está.</div>`}
    <button class="todo" id="lu-mover">Mover entre cualesquiera dos lugares →</button>
    <div class="acciones" style="grid-template-columns:1fr">
      <button class="btn secundario" id="lu-no">Cerrar</button>
    </div>`;
  ver('#velo');

  $('#lu-no').onclick = cerrarHoja;
  $('#lu-mover').onclick = hojaMover;
  $$('[data-pasar]').forEach(b =>
    b.addEventListener('click', () => hojaPasar(b.dataset.pasar)));
}

function hojaPasar(desdeId){
  const p = S.prod;
  const lugares = p.ubicaciones || [];
  const desde = lugares.find(u => u.ubicacion_id === desdeId);
  if (!desde) return hojaLugares();

  const esB     = desde.tipo === 'bodega';
  const destinos = lugares.filter(u =>
    u.ubicacion_id !== desde.ubicacion_id &&
    (esB ? u.tipo !== 'bodega' : u.tipo === 'bodega'));

  if (!destinos.length){
    aviso('No hay a dónde pasarlo',
      esB ? 'No hay ningún lugar de piso de ventas configurado.'
          : 'Esta sucursal no tiene ninguna bodega configurada.');
    return;
  }

  const hay = Number(desde.cantidad) || 0;
  const lotes = p.lotes || [];
  const selLote = lotes.length ? `
    <div class="campo-g" style="margin-top:12px">
      <label for="pa-lote">¿De qué lote?</label>
      <select class="entrada" id="pa-lote">
        ${Number(p.sin_lote) > 0 ? `<option value="">Sin lote (${cant(p.sin_lote)})</option>` : ''}
        ${lotes.map(l => `<option value="${l.lote_id}">${opcionLote(l)}</option>`).join('')}
      </select>
    </div>
    <div class="lugar-pie" style="margin-top:6px">La cantidad de arriba es de
      todos los lotes juntos.</div>` : '';

  // Con un solo destino no se pregunta: se dice a dónde va y listo.
  const unico = destinos.length === 1;
  const destino = unico ? `
    <div class="de-a">
      <div class="caja"><small>De</small><b>${escapar(desde.nombre)}</b></div>
      <span class="flecha">→</span>
      <div class="caja"><small>A</small><b>${escapar(destinos[0].nombre)}</b></div>
    </div>` : `
    <div class="campo-g" style="margin-top:14px">
      <label for="pa-hacia">${esB ? '¿A qué lugar del piso?' : '¿A qué bodega?'}</label>
      <select class="entrada" id="pa-hacia">
        ${destinos.map(u => `<option value="${escapar(u.ubicacion_id)}"
          >${escapar(u.nombre)} (${cant(u.cantidad)})</option>`).join('')}
      </select>
    </div>`;

  $('#hoja').innerHTML = `
    <h2>${esB ? 'Bajar al piso' : 'Cargar a bodega'}</h2>
    <p class="sub"><b>${escapar(p.nombre)}</b></p>
    <div class="aviso ojo">En <b>${escapar(desde.nombre)}</b> hay
      <b>${cant(hay)} ${escapar(p.unidad)}</b>.</div>
    ${destino}
    ${selLote}
    <div class="campo-g" style="margin-top:12px">
      <label for="pa-cant">¿Cuánto pasa?</label>
      <input class="entrada" id="pa-cant" inputmode="decimal" placeholder="0">
    </div>
    ${hay > 0 && !lotes.length
      /* Con lotes no va: la cifra del lugar es de todos los lotes juntos, asi
         que "pasar todo (30)" prometeria mover 30 de un lote que tiene 6. */
      ? `<button class="todo" id="pa-todo">Pasar todo (${cant(hay)})</button>` : ''}
    <div class="aviso malo oculto" id="pa-error"></div>
    <div class="acciones">
      <button class="btn secundario" id="pa-no">Volver</button>
      <button class="btn principal-b" id="pa-si">${esB ? 'Bajar' : 'Cargar'}</button>
    </div>`;
  ver('#velo');
  $('#pa-cant').focus();

  $('#pa-cant').addEventListener('input', e => {
    e.target.value = e.target.value.replace(/[^0-9.]/g, '');
  });
  const todo = $('#pa-todo');
  if (todo) todo.onclick = () => { $('#pa-cant').value = hay; $('#pa-cant').focus(); };

  $('#pa-no').onclick = () => hojaLugares(desde.ubicacion_id);
  $('#pa-si').onclick = async () => {
    const hacia = unico ? destinos[0].ubicacion_id : $('#pa-hacia').value;
    const lote  = $('#pa-lote') ? ($('#pa-lote').value || null) : null;
    const n     = Number($('#pa-cant').value);
    const err   = $('#pa-error');
    const fallar = t => { err.textContent = t; err.classList.remove('oculto'); };
    err.classList.add('oculto');

    if (!n || n <= 0) return fallar('Ponga cuánto se pasa.');
    if (n > hay) return fallar(`En ${desde.nombre} solo hay ${cant(hay)}.`);

    const b = $('#pa-si');
    const texto = b.textContent;
    b.disabled = true; b.innerHTML = '<span class="girando"></span>';

    const { data, error } = await sb.rpc('fn_mover_entre_ubicaciones', {
      p_producto_id:p.producto_id, p_hacia:hacia, p_cantidad:n,
      p_desde:desde.ubicacion_id, p_lote_id:lote });

    b.disabled = false; b.textContent = texto;
    if (error) return fallar(limpiarError(error));

    cerrarHoja();
    await recargarFicha();
    aviso(esB ? 'Bajado al piso' : 'Cargado a bodega',
      `${cant(data.cantidad)} ${p.unidad} de ${data.producto}: de ${data.desde} a ${data.hacia}.`);
  };
}

/* ================= mover de lugar ================= */
function hojaMover(){
  const p = S.prod;
  const lugares = p.ubicaciones || [];
  if (lugares.length < 2){
    aviso('Falta configurar ubicaciones',
      'Esta sucursal tiene una sola ubicación, así que no hay a dónde mover. ' +
      'Un supervisor puede agregar la bodega o el refrigerador desde Catálogos.');
    return;
  }

  const ops = lugares.map(u =>
    `<option value="${u.ubicacion_id}">${escapar(u.nombre)} (${cant(u.cantidad)})</option>`).join('');

  const lotes = p.lotes || [];
  const selLote = lotes.length ? `
    <div class="campo-g" style="margin-top:12px">
      <label for="mv-lote">¿De qué lote?</label>
      <select class="entrada" id="mv-lote">
        ${Number(p.sin_lote) > 0 ? `<option value="">Sin lote (${cant(p.sin_lote)})</option>` : ''}
        ${lotes.map(l => `<option value="${l.lote_id}">${opcionLote(l)}</option>`).join('')}
      </select>
    </div>
    <div class="lugar-pie" style="margin-top:8px">Las cantidades que aparecen
      junto a cada lugar son de todos los lotes juntos.</div>` : '';

  $('#hoja').innerHTML = `
    <h2>Mover de lugar</h2>
    <p class="sub">${escapar(p.nombre)}. No entra ni sale nada del negocio:
      solo cambia dónde está.</p>
    <div class="campo-g">
      <label for="mv-desde">De</label>
      <select class="entrada" id="mv-desde">${ops}</select>
    </div>
    <div class="campo-g" style="margin-top:12px">
      <label for="mv-hacia">A</label>
      <select class="entrada" id="mv-hacia">${ops}</select>
    </div>
    ${selLote}
    <div class="campo-g" style="margin-top:12px">
      <label for="mv-cant">Cantidad</label>
      <input class="entrada" id="mv-cant" inputmode="decimal" placeholder="0">
    </div>
    <div class="aviso malo oculto" id="mv-error"></div>
    <div class="acciones">
      <button class="btn secundario" id="mv-no">Cancelar</button>
      <button class="btn principal-b" id="mv-si">Mover</button>
    </div>`;
  ver('#velo');

  // El destino arranca en la segunda ubicacion para que no coincida con el origen
  $('#mv-hacia').selectedIndex = 1;
  $('#mv-cant').focus();

  $('#mv-cant').addEventListener('input', e => {
    e.target.value = e.target.value.replace(/[^0-9.]/g, '');
  });
  $('#mv-no').onclick = cerrarHoja;
  $('#mv-si').onclick = async () => {
    const desde = $('#mv-desde').value;
    const hacia = $('#mv-hacia').value;
    const lote  = $('#mv-lote') ? ($('#mv-lote').value || null) : null;
    const n     = Number($('#mv-cant').value);
    const err   = $('#mv-error');

    const fallar = t => { err.textContent = t; err.classList.remove('oculto'); };
    err.classList.add('oculto');

    if (desde === hacia) return fallar('El origen y el destino son el mismo lugar.');
    if (!n || n <= 0)    return fallar('Ponga cuánto se mueve.');

    const b = $('#mv-si');
    b.disabled = true; b.innerHTML = '<span class="girando"></span>';

    const { data, error } = await sb.rpc('fn_mover_entre_ubicaciones', {
      p_producto_id:p.producto_id, p_hacia:hacia, p_cantidad:n,
      p_desde:desde, p_lote_id:lote });

    b.disabled = false; b.textContent = 'Mover';
    if (error) return fallar(limpiarError(error));

    cerrarHoja();
    await recargarFicha();
    aviso('Movido', `${cant(data.cantidad)} de ${data.producto}: de ${data.desde} a ${data.hacia}.`);
  };
}

/* ================= generar conteo desde el producto ================= */
function hojaConteo(){
  const p = S.prod;
  const abierto = p.conteo_abierto;

  $('#hoja').innerHTML = `
    <h2>${abierto ? 'Agregar a la hoja' : 'Abrir una hoja de conteo'}</h2>
    <p class="sub">${escapar(p.nombre)}</p>
    ${abierto
      ? `<div class="aviso ojo">Ya hay una hoja de conteo abierta en esta sucursal
          (<b>${escapar(abierto.numero)}</b>). Este producto se agrega a esa:
          dos hojas abiertas a la vez se pisan el ajuste.</div>`
      : `<div class="aviso bien">Se abre una hoja nueva que contiene
          <b>solo los productos que usted agregue</b>. No hay que contar la
          categoría entera ni todo el proveedor.</div>`}
    <div class="aviso ojo">El sistema dice <b>${cant(p.existencia)} ${escapar(p.unidad)}</b>.
      Esa cifra no se muestra a quien cuenta: contar sirve cuando no se sabe
      la respuesta.</div>
    <div class="aviso malo oculto" id="ct-error"></div>
    <div class="acciones">
      <button class="btn secundario" id="ct-no">Cancelar</button>
      <button class="btn principal-b" id="ct-si">${abierto ? 'Agregar' : 'Abrir la hoja'}</button>
    </div>`;
  ver('#velo');

  $('#ct-no').onclick = cerrarHoja;
  $('#ct-si').onclick = async () => {
    const err = $('#ct-error');
    err.classList.add('oculto');
    const b = $('#ct-si');
    const texto = b.textContent;
    b.disabled = true; b.innerHTML = '<span class="girando"></span>';

    const { data, error } = await sb.rpc('fn_agregar_a_conteo', {
      p_producto_id:p.producto_id,
      p_conteo_id:abierto ? abierto.conteo_id : null,
      p_sucursal_id:S.sucursal });

    b.disabled = false; b.textContent = texto;
    if (error){
      err.textContent = limpiarError(error);
      err.classList.remove('oculto');
      return;
    }

    const lineas = data.lineas_producto;
    const detalle = data.ya_estaba && data.agregadas === 0
      ? 'Ya estaba en el conteo.'
      : `${data.agregadas} ${data.agregadas === 1 ? 'línea' : 'líneas'} para contar` +
        (lineas > 1 ? ` (una por lote, ${lineas} en total).` : '.');

    $('#hoja').innerHTML = `
      <h2>${escapar(data.numero)}</h2>
      <p class="sub">${escapar(data.producto)}. ${escapar(detalle)}</p>
      ${data.conteo_nuevo
        ? '<div class="aviso bien">Hoja nueva. Puede seguir agregando productos desde esta pantalla y contarlos todos juntos.</div>'
        : ''}
      <div class="acciones">
        <button class="btn secundario" id="cf-no">Seguir consultando</button>
        <a class="btn principal-b" href="conteo.html"
           style="display:grid;place-items:center">Ir a la hoja</a>
      </div>`;
    $('#cf-no').onclick = async () => { cerrarHoja(); await recargarFicha(); };
  };
}

/* ================= clics de la lista ================= */
$('#cuerpo').addEventListener('click', e => {
  const ap = e.target.closest('[data-aprobar]');
  if (ap){ aprobarAjuste(ap.dataset.aprobar); return; }
  const rz = e.target.closest('[data-rechazar]');
  if (rz){ hojaRechazar(rz.dataset.rechazar); return; }
  const b = e.target.closest('[data-abrir]');
  if (b) abrir(b.dataset.abrir);
});

/* ================= al aire ================= */
arrancar();

if ('serviceWorker' in navigator)
  navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
