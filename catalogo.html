<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F1729">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" href="icono-192.png" type="image/png">
<link rel="apple-touch-icon" href="icono-192.png">
<title>Catálogos · Pulpeando</title>
<script src="config.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="ui.css">
<style>
.zona{flex:1;display:flex;flex-direction:column;min-height:0;padding:14px 16px 0}
.barra-busca{display:flex;gap:10px;margin-bottom:14px;flex:0 0 auto}
.btn-nuevo{
  height:50px;padding:0 18px;border-radius:var(--r-md);background:var(--verde);color:#fff;
  font-weight:700;font-size:14px;display:flex;align-items:center;gap:7px;flex:0 0 auto;
  box-shadow:0 6px 18px -6px rgba(18,161,80,.6);
}
.btn-nuevo:disabled{background:#CBD5E1;box-shadow:none}

/* min-height:0 para que la lista de abajo pueda hacer scroll */
.lista{flex:1;overflow-y:auto;min-height:0;padding-bottom:24px}

.fila{
  display:flex;align-items:center;gap:13px;width:100%;text-align:left;
  background:var(--panel);border:1px solid var(--linea);border-radius:var(--r-md);
  padding:13px 15px;margin-bottom:9px;transition:border-color .15s;
}
.fila:hover{border-color:#C9D6E8}
.fila:active{transform:scale(.995)}
.fila-ini{
  width:38px;height:38px;border-radius:11px;flex:0 0 auto;display:grid;place-items:center;
  background:var(--fondo);font-weight:800;font-size:15px;color:#8A99B3;
  background-size:cover;background-position:center;
}
.fila-txt{flex:1;min-width:0}
.fila-txt b{display:block;font-size:14.5px;font-weight:600;line-height:1.3}
.fila-txt small{display:block;font-size:12.5px;color:var(--tenue);margin-top:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fila-fin{text-align:right;flex:0 0 auto;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.fila-fin b{font-family:var(--num);font-size:14.5px;font-weight:700}
.inactivo{opacity:.5}

.conteo{font-size:12.5px;color:var(--tenue);margin-bottom:10px;flex:0 0 auto}

/* formulario */
.form-velo{
  position:fixed;inset:0;z-index:95;background:rgba(15,23,41,.55);
  display:flex;justify-content:flex-end;backdrop-filter:blur(3px);
}
.cajon{
  width:min(520px,100%);background:var(--panel);height:100%;display:flex;flex-direction:column;
  box-shadow:-20px 0 60px -20px rgba(15,23,41,.5);
  animation:entrar-der .24s cubic-bezier(.2,.8,.3,1);
}
@keyframes entrar-der{from{transform:translateX(100%)}to{transform:none}}
.cajon-enc{
  display:flex;align-items:center;gap:12px;padding:16px;border-bottom:1px solid var(--linea);
  flex:0 0 auto;
}
.cajon-enc h2{flex:1;font-size:18px}
.cajon-cuerpo{flex:1;overflow-y:auto;min-height:0;padding:16px}
.cajon-pie{
  padding:14px 16px calc(14px + env(safe-area-inset-bottom));
  border-top:1px solid var(--linea);display:flex;gap:10px;flex:0 0 auto;
}
.cajon-pie .btn{flex:1}
.cerrar-x{width:38px;height:38px;border-radius:11px;background:var(--fondo);
  color:var(--tenue);font-size:17px;flex:0 0 auto}

.campos{display:grid;gap:13px}
.campos.dos{grid-template-columns:1fr 1fr}
.ancho-total{grid-column:1/-1}
.ayuda{font-size:12px;color:var(--tenue);margin-top:-3px;line-height:1.4}
.marca-check{display:flex;align-items:center;gap:10px;padding:12px 14px;
  background:var(--fondo);border-radius:var(--r-sm);font-size:13.5px;font-weight:600}
.marca-check input{width:20px;height:20px;flex:0 0 auto;accent-color:var(--verde)}

.codigos{display:flex;flex-direction:column;gap:7px}
.codigo{display:flex;align-items:center;gap:10px;background:var(--fondo);
  border-radius:var(--r-sm);padding:10px 12px;font-family:var(--num);font-size:13.5px}
.codigo b{flex:1;font-weight:600}
.codigo button{width:28px;height:28px;border-radius:8px;color:var(--tenue);font-size:14px}
.codigo button:hover{background:#FFEDF1;color:var(--rojo)}
.agregar-cod{display:flex;gap:8px}

.seccion{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;
  color:#9AA8BC;margin:20px 0 -2px;grid-column:1/-1}
.seccion:first-child{margin-top:0}

@media (max-width:820px){
  .zona{padding:12px 14px 0}
  .cajon{width:100%}
  .campos.dos{grid-template-columns:1fr}
  .etq-nuevo{display:none}
  .btn-nuevo{padding:0 15px}
}
</style>
</head>
<body>

<div class="oscura oculto" id="p-config">
  <div class="tarjeta-oscura">
    <div class="marca"><span>◧</span> Configuración</div>
    <div class="titulo-o">Falta conectar el proyecto</div>
    <p class="sub-o">Ponga la URL y la llave publishable en <b>config.js</b>.</p>
  </div>
</div>

<div class="oscura oculto" id="p-sesion">
  <div class="tarjeta-oscura">
    <div class="marca"><span>◧</span> Catálogos</div>
    <div class="titulo-o">Iniciar sesión</div>
    <p class="sub-o">Use el correo con el que su gerente lo dio de alta</p>
    <input class="campo-o" id="s-email" type="email" placeholder="correo@negocio.hn" autocomplete="username">
    <input class="campo-o" id="s-clave" type="password" placeholder="Contraseña" autocomplete="current-password">
    <div class="error-o" id="s-error"></div>
    <button class="btn-o" id="s-entrar">Entrar</button>
  </div>
</div>

<div class="oscura oculto" id="p-bloqueado">
  <div class="tarjeta-oscura">
    <div class="marca"><span>◧</span> Catálogos</div>
    <div class="titulo-o" id="bl-titulo">Sin permiso</div>
    <p class="sub-o" id="bl-texto"></p>
    <a class="btn-o" href="index.html" style="display:block;line-height:52px">Ir a la caja</a>
    <button class="btn-o fantasma" id="bl-salir">Cerrar sesión</button>
  </div>
</div>

<div class="armazon oculto" id="app">
  <aside id="menu"></aside>

  <div class="principal">
    <header class="barra">
      <button class="hamburguesa" id="abrir-menu" aria-label="Menú">
        <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <div class="barra-titulo">
        <b id="h-titulo">Catálogos</b>
        <small id="h-sucursal">—</small>
      </div>
      <div class="barra-fin">
        <span class="pill" id="h-usuario">—</span>
      </div>
    </header>

    <div class="zona">
      <div class="barra-busca">
        <label class="campo">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input id="buscar" placeholder="Buscar" autocomplete="off">
        </label>
        <button class="btn-nuevo" id="btn-nuevo">
          <span style="font-size:19px;line-height:1">+</span><span class="etq-nuevo">Nuevo</span>
        </button>
      </div>
      <div class="conteo" id="conteo"></div>
      <div class="lista" id="lista"></div>
    </div>
  </div>
</div>

<div class="form-velo oculto" id="form-velo">
  <div class="cajon">
    <div class="cajon-enc">
      <h2 id="form-titulo">—</h2>
      <button class="cerrar-x" id="form-cerrar">✕</button>
    </div>
    <div class="cajon-cuerpo" id="form-cuerpo"></div>
    <div class="cajon-pie">
      <button class="btn secundario" id="form-cancelar">Cancelar</button>
      <button class="btn principal-b" id="form-guardar">Guardar</button>
    </div>
  </div>
</div>

<div class="velo oculto" id="velo"><div class="hoja" id="hoja"></div></div>

<script type="module">
const CFG = window.SUPABASE_CONFIG || {};
const SUPABASE_URL = CFG.url || 'PEGUE_AQUI_LA_URL';
const SUPABASE_KEY = CFG.key || 'PEGUE_AQUI_LA_LLAVE';

const $ = s => document.querySelector(s);
const ver = (id, si = true) => $(id).classList.toggle('oculto', !si);

if (SUPABASE_URL.startsWith('PEGUE')){ ver('#p-config'); throw new Error('sin configurar'); }

import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
import { montarMenu, escapar, iniciales } from './menu.js';
import { escanear, hayCamara } from './escaner.js';

const sb = createClient(SUPABASE_URL, SUPABASE_KEY, {
  auth:{ persistSession:true, autoRefreshToken:true }
});

const S = { ctx:null, sucursal:null, moneda:'L', menu:null, nivel:0,
            entidad:null, filas:[], busqueda:'', editando:null, aux:{} };

const money = n => S.moneda + ' ' + (Number(n)||0).toLocaleString('es-HN',
  {minimumFractionDigits:2, maximumFractionDigits:2});
const num = v => { const n = parseFloat(String(v ?? '').replace(/[^0-9.\-]/g,'')); return isNaN(n)?0:n; };

function limpiarError(e){
  const m = (e?.message || String(e)).replace(/^.*?:\s*/, '');
  if (/duplicate key|unique/i.test(m))  return 'Ya existe un registro con ese nombre o código';
  if (/violates foreign key/i.test(m))  return 'No se puede: hay otros registros que dependen de este';
  if (/row-level security|permission/i.test(m)) return 'Su rol no tiene permiso para esto';
  if (/JWT|token/i.test(m))             return 'La sesión venció. Vuelva a entrar.';
  if (/Failed to fetch|NetworkError/i.test(m)) return 'Sin conexión con el servidor';
  return m;
}

/* ==========================================================================
   DEFINICIÓN DE LAS ENTIDADES
   Todo lo que distingue una pantalla de otra vive aquí. El motor de abajo
   es el mismo para las cinco.
   ========================================================================== */
const ENTIDADES = {
  productos: {
    nombre:'Productos', singular:'Producto', icono:'inventario',
    tabla:'productos', nivel:3, orden:'nombre',
    columnas:'id,sku,nombre,categoria_id,marca_id,proveedor_id,impuesto_id,tipo,unidad_base,controla_lote,controla_vencimiento,stock_minimo,stock_maximo,dias_cobertura,imagen_url,se_vende,se_compra,activo',
    buscaEn:['nombre','sku'],
    fila: r => ({
      ini: r.nombre?.[0] || '·',
      img: r.imagen_url,
      titulo: r.nombre,
      sub: [r.sku, S.aux.categorias?.find(c => c.id === r.categoria_id)?.nombre]
             .filter(Boolean).join(' · '),
      der: S.aux.precios?.[r.id] ? money(S.aux.precios[r.id]) : 'Sin precio',
      inactivo: !r.activo
    }),
    campos: [
      { s:'Identificación' },
      { k:'nombre', e:'Nombre', tipo:'texto', req:true, ancho:true },
      { k:'sku', e:'Código interno', tipo:'texto', req:true,
        ayuda:'Como lo llama usted. Si no tiene, invente uno corto.' },
      { k:'activo', e:'Activo', tipo:'si', def:true },
      { s:'Clasificación' },
      { k:'categoria_id', e:'Categoría', tipo:'lista', de:'categorias' },
      { k:'marca_id', e:'Marca', tipo:'lista', de:'marcas' },
      { k:'proveedor_id', e:'Proveedor habitual', tipo:'lista', de:'proveedores' },
      { k:'impuesto_id', e:'Impuesto', tipo:'lista', de:'impuestos' },
      { s:'Venta' },
      { k:'precio', e:'Precio de venta', tipo:'decimal', req:true,
        ayuda:'Sin este precio el producto no aparece en la caja.' },
      { k:'unidad_base', e:'Unidad', tipo:'texto', def:'UND' },
      { k:'tipo', e:'Se vende por', tipo:'opciones',
        opciones:[['unidad','Unidad'],['peso','Peso'],['granel','Granel'],['servicio','Servicio']],
        def:'unidad' },
      { k:'se_vende', e:'Se vende en caja', tipo:'si', def:true },
      { k:'se_compra', e:'Se compra a proveedor', tipo:'si', def:true },
      { s:'Inventario' },
      { k:'stock_minimo', e:'Stock mínimo', tipo:'decimal', def:0,
        ayuda:'Debajo de esto se marca en rojo.' },
      { k:'dias_cobertura', e:'Días de cobertura', tipo:'entero', def:15,
        ayuda:'Para las sugerencias de compra.' },
      { k:'controla_vencimiento', e:'Controla vencimiento', tipo:'si', def:false,
        ayuda:'Actívelo en perecederos: pide lote y fecha al recibir.' },
      { k:'controla_lote', e:'Controla lote', tipo:'si', def:false },
      { s:'Códigos de barras' },
      { k:'__codigos', tipo:'codigos', ancho:true }
    ]
  },

  categorias: {
    nombre:'Categorías', singular:'Categoría', icono:'etiqueta',
    tabla:'categorias', nivel:3, orden:'orden',
    columnas:'id,nombre,color,icono,orden,activa',
    buscaEn:['nombre'],
    fila: r => ({ ini:r.nombre?.[0]||'·', titulo:r.nombre,
                  sub:'Orden ' + (r.orden ?? 0), inactivo:!r.activa }),
    campos:[
      { k:'nombre', e:'Nombre', tipo:'texto', req:true, ancho:true },
      { k:'orden', e:'Orden en la caja', tipo:'entero', def:0,
        ayuda:'Menor número aparece primero.' },
      { k:'activa', e:'Activa', tipo:'si', def:true }
    ]
  },

  proveedores: {
    nombre:'Proveedores', singular:'Proveedor', icono:'compras',
    tabla:'proveedores', nivel:3, orden:'nombre',
    columnas:'id,codigo,nombre,identificacion_fiscal,contacto,telefono,email,direccion,dias_credito,dias_entrega,notas,activo',
    buscaEn:['nombre','contacto','telefono'],
    fila: r => ({ ini:r.nombre?.[0]||'·', titulo:r.nombre,
                  sub:[r.contacto, r.telefono].filter(Boolean).join(' · ') || 'Sin contacto',
                  der: r.dias_credito ? r.dias_credito + ' días' : 'Contado',
                  inactivo:!r.activo }),
    campos:[
      { k:'nombre', e:'Nombre', tipo:'texto', req:true, ancho:true },
      { k:'contacto', e:'Persona de contacto', tipo:'texto' },
      { k:'telefono', e:'Teléfono', tipo:'tel' },
      { k:'email', e:'Correo', tipo:'email' },
      { k:'identificacion_fiscal', e:'RTN', tipo:'texto' },
      { k:'direccion', e:'Dirección', tipo:'texto', ancho:true },
      { k:'dias_credito', e:'Días de crédito', tipo:'entero', def:0,
        ayuda:'0 si le vende de contado.' },
      { k:'dias_entrega', e:'Días de entrega', tipo:'entero', def:3,
        ayuda:'Cuánto tarda en traer el pedido. Se usa para sugerir compras.' },
      { k:'notas', e:'Notas', tipo:'texto', ancho:true },
      { k:'activo', e:'Activo', tipo:'si', def:true }
    ]
  },

  clientes: {
    nombre:'Clientes', singular:'Cliente', icono:'pedidos',
    tabla:'clientes', nivel:1, orden:'nombre',
    columnas:'id,codigo,nombre,identificacion_fiscal,telefono,email,direccion,limite_credito,saldo,puntos,activo',
    buscaEn:['nombre','telefono'],
    fila: r => ({ ini:iniciales(r.nombre), titulo:r.nombre,
                  sub:r.telefono || 'Sin teléfono',
                  der: Number(r.saldo) > 0 ? 'Debe ' + money(r.saldo) : '',
                  inactivo:!r.activo }),
    campos:[
      { k:'nombre', e:'Nombre', tipo:'texto', req:true, ancho:true },
      { k:'telefono', e:'Teléfono', tipo:'tel',
        ayuda:'Con este lo encuentra la cajera.' },
      { k:'email', e:'Correo', tipo:'email' },
      { k:'direccion', e:'Dirección', tipo:'texto', ancho:true },
      { k:'identificacion_fiscal', e:'RTN', tipo:'texto' },
      { k:'limite_credito', e:'Límite de fiado', tipo:'decimal', def:0, nivel:2,
        ayuda:'Cuánto le puede fiar como máximo. En 0 no se le fía.',
        ayudaBloqueado:'Cuánto le puede fiar como máximo. Solo un supervisor lo cambia.' },
      { k:'activo', e:'Activo', tipo:'si', def:true }
    ],
    soloLectura:['saldo']
  },

  usuarios: {
    nombre:'Usuarios', singular:'Usuario', icono:'ajustes',
    tabla:'perfiles', nivel:3, orden:'nombre', sinCrear:true,
    columnas:'id,nombre,email,telefono,rol,activo,pin_pos',
    buscaEn:['nombre','email'],
    fila: r => ({ ini:iniciales(r.nombre), titulo:r.nombre,
                  sub:[r.rol, r.pin_pos ? 'con PIN' : 'sin PIN'].join(' · '),
                  inactivo:!r.activo }),
    campos:[
      { k:'nombre', e:'Nombre', tipo:'texto', req:true, ancho:true },
      { k:'telefono', e:'Teléfono', tipo:'tel' },
      { k:'rol', e:'Rol', tipo:'opciones', req:true,
        opciones:[['auxiliar','Auxiliar'],['supervisor','Supervisor'],
                  ['gerente','Gerente'],['repartidor','Repartidor']],
        ayuda:'Auxiliar vende. Supervisor además recibe mercadería y anula. Gerente todo.' },
      { k:'activo', e:'Activo', tipo:'si', def:true },
      { s:'PIN de caja' },
      { k:'__pin', tipo:'pin', ancho:true }
    ]
  }
};

/* ==========================================================================
   SESIÓN
   ========================================================================== */
$('#s-entrar').addEventListener('click', async () => {
  const b = $('#s-entrar');
  $('#s-error').textContent = '';
  b.disabled = true; b.innerHTML = '<span class="girando"></span>';
  const { error } = await sb.auth.signInWithPassword({
    email:$('#s-email').value.trim(), password:$('#s-clave').value });
  b.disabled = false; b.textContent = 'Entrar';
  if (error){ $('#s-error').textContent = 'Correo o contraseña incorrectos'; return; }
  arrancar();
});
$('#s-clave').addEventListener('keydown', e => { if (e.key === 'Enter') $('#s-entrar').click(); });
$('#bl-salir').addEventListener('click', async () => { await sb.auth.signOut(); location.reload(); });

/* ==========================================================================
   ARRANQUE
   ========================================================================== */
async function arrancar(){
  const { data:{ session } } = await sb.auth.getSession();
  if (!session){ ver('#p-sesion'); return; }
  ver('#p-sesion', false);

  const { data, error } = await sb.rpc('fn_pos_contexto');
  if (error){
    ver('#p-sesion');
    $('#s-error').textContent = 'Su usuario no tiene perfil en ningún negocio';
    await sb.auth.signOut();
    return;
  }
  S.ctx = data;
  S.nivel = data.usuario.nivel;
  S.moneda = data.organizacion.moneda === 'HNL' ? 'L' : data.organizacion.moneda;

  if (data.usuario.nivel < 1){
    ver('#p-bloqueado');
    $('#bl-titulo').textContent = 'Esta pantalla no es para su rol';
    $('#bl-texto').textContent = 'Los catálogos son para el personal de la tienda.';
    return;
  }
  S.sucursal = data.sucursales[0]?.id || null;
  $('#h-usuario').textContent = data.usuario.nombre;
  $('#h-sucursal').textContent = data.sucursales[0]?.nombre || '';
  $('#app').classList.remove('oculto');

  // solo las entidades que el rol puede ver
  const visibles = Object.entries(ENTIDADES)
    .filter(([,e]) => data.usuario.nivel >= e.nivel);

  S.menu = montarMenu({
    contenedor:'#menu', modulo:'catalogo', ctx:S.ctx,
    alSalir: async () => { await sb.auth.signOut(); location.reload(); },
    secciones:[{
      id:'entidades', titulo:'Catálogos',
      items: visibles.map(([k,e], i) => ({
        valor:k, nombre:e.nombre, icono:e.icono, activo:i === 0 }))
    }]
  });
  S.menu.alElegir(abrirEntidad);
  $('#abrir-menu').addEventListener('click', () => S.menu.alternar());

  await cargarAuxiliares();
  abrirEntidad(visibles[0][0]);
}

/* listas que alimentan los desplegables */
async function cargarAuxiliares(){
  const [cat, mar, pro, imp] = await Promise.all([
    sb.from('categorias').select('id,nombre').eq('activa', true).order('nombre'),
    sb.from('marcas').select('id,nombre').eq('activa', true).order('nombre'),
    sb.from('proveedores').select('id,nombre').eq('activo', true).order('nombre'),
    sb.from('impuestos').select('id,nombre,tasa').eq('activo', true).order('nombre')
  ]);
  S.aux.categorias  = cat.data || [];
  S.aux.marcas      = mar.data || [];
  S.aux.proveedores = pro.data || [];
  S.aux.impuestos   = imp.data || [];
}

/* ==========================================================================
   LISTA
   ========================================================================== */
async function abrirEntidad(clave){
  S.entidad = clave;
  S.busqueda = '';
  $('#buscar').value = '';
  const e = ENTIDADES[clave];
  $('#h-titulo').textContent = e.nombre;
  $('#buscar').placeholder = 'Buscar ' + e.nombre.toLowerCase();
  ver('#btn-nuevo', !e.sinCrear);
  await cargarLista();
}

async function cargarLista(){
  const e = ENTIDADES[S.entidad];
  $('#lista').innerHTML = '<div class="vacio"><p>Cargando…</p></div>';

  const { data, error } = await sb.from(e.tabla).select(e.columnas).order(e.orden);
  if (error){
    $('#lista').innerHTML = `<div class="vacio"><p>${escapar(limpiarError(error))}</p></div>`;
    return;
  }
  S.filas = data || [];

  // los precios vivien en otra tabla; se traen de un solo golpe
  if (S.entidad === 'productos' && S.sucursal){
    const { data:pr } = await sb.from('precios')
      .select('producto_id,precio,sucursal_id,nivel,vigente_hasta')
      .eq('nivel', 'detalle');
    S.aux.precios = {};
    (pr || []).forEach(p => {
      if (p.vigente_hasta) return;
      if (p.sucursal_id && p.sucursal_id !== S.sucursal) return;
      S.aux.precios[p.producto_id] = p.precio;
    });
  }
  pintar();
}

function pintar(){
  const e = ENTIDADES[S.entidad];
  const q = S.busqueda.toLowerCase().trim();
  const lista = S.filas.filter(r => !q ||
    e.buscaEn.some(c => String(r[c] ?? '').toLowerCase().includes(q)));

  $('#conteo').textContent = q
    ? lista.length + ' de ' + S.filas.length
    : S.filas.length + ' ' + (S.filas.length === 1 ? e.singular.toLowerCase() : e.nombre.toLowerCase());

  if (!lista.length){
    $('#lista').innerHTML = `<div class="vacio"><div>📋</div>
      <p>${q ? 'Sin resultados para “' + escapar(q) + '”'
             : 'Todavía no hay ' + e.nombre.toLowerCase() +
               (e.sinCrear ? '' : '.<br>Toque Nuevo para agregar el primero.')}</p></div>`;
    return;
  }

  $('#lista').innerHTML = lista.map(r => {
    const f = e.fila(r);
    const fondo = f.img ? `style="background-image:url('${escapar(f.img)}')"` : '';
    return `<button class="fila ${f.inactivo ? 'inactivo' : ''}" data-id="${r.id}">
      <span class="fila-ini" ${fondo}>${f.img ? '' : escapar(f.ini)}</span>
      <span class="fila-txt">
        <b>${escapar(f.titulo)}</b>
        <small>${escapar(f.sub || '')}</small>
      </span>
      <span class="fila-fin">
        ${f.der ? `<b>${escapar(f.der)}</b>` : ''}
        ${f.inactivo ? '<span class="sello anulado">Inactivo</span>' : ''}
      </span>
    </button>`;
  }).join('');
}

$('#buscar').addEventListener('input', e => { S.busqueda = e.target.value; pintar(); });
$('#lista').addEventListener('click', e => {
  const b = e.target.closest('[data-id]'); if (!b) return;
  abrirForm(S.filas.find(r => String(r.id) === b.dataset.id));
});
$('#btn-nuevo').addEventListener('click', () => abrirForm(null));

/* ==========================================================================
   FORMULARIO
   ========================================================================== */
function abrirForm(fila){
  const e = ENTIDADES[S.entidad];
  S.editando = fila;
  $('#form-titulo').textContent = fila ? 'Editar ' + e.singular.toLowerCase()
                                       : 'Nuevo ' + e.singular.toLowerCase();

  const val = k => {
    if (fila) return fila[k] ?? '';
    const d = e.campos.find(c => c.k === k)?.def;
    return d === undefined ? '' : d;
  };

  let html = '<div class="campos dos">';
  for (const c of e.campos){
    if (c.s){ html += `<div class="seccion">${escapar(c.s)}</div>`; continue; }
    const cls = c.ancho ? 'campo-g ancho-total' : 'campo-g';

    // Un campo puede pedir más rango que la pantalla. Se muestra, para que el
    // auxiliar vea cómo está, pero bloqueado: la base lo rechazaría igual.
    const bloqueado = c.nivel !== undefined && S.nivel < c.nivel;

    if (c.tipo === 'si'){
      const on = fila ? !!fila[c.k] : !!c.def;
      html += `<label class="marca-check ${c.ancho ? 'ancho-total' : ''}">
        <input type="checkbox" data-k="${c.k}" ${on ? 'checked' : ''}>
        <span>${escapar(c.e)}</span></label>`;
      if (c.ayuda) html += `<div class="ayuda ancho-total">${escapar(c.ayuda)}</div>`;
      continue;
    }

    if (c.tipo === 'codigos'){
      html += `<div class="ancho-total">
        <div class="codigos" id="lista-codigos"></div>
        <div class="agregar-cod" style="margin-top:8px">
          <input class="entrada" id="cod-nuevo" placeholder="Escriba o escanee el código">
          <button class="btn-camara oculto" id="cod-camara" style="height:46px;min-width:46px;padding:0 14px">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
              stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2M7 12h10"/>
            </svg></button>
          <button class="btn secundario" id="cod-agregar" style="height:46px;padding:0 16px">Agregar</button>
        </div>
        <div class="ayuda" style="margin-top:7px">Con esto la cajera lo encuentra escaneando.</div>
      </div>`;
      continue;
    }

    if (c.tipo === 'pin'){
      html += `<div class="ancho-total">
        <div class="ayuda" style="margin-bottom:8px">
          ${fila?.pin_pos ? 'Ya tiene PIN. Escriba uno nuevo solo si lo quiere cambiar.'
                          : 'Sin PIN no puede abrir caja.'}
        </div>
        <input class="entrada num" id="pin-nuevo" inputmode="numeric" maxlength="5"
               placeholder="•••••" style="text-align:center;letter-spacing:.4em;font-size:20px">
        <div class="ayuda" style="margin-top:6px">5 dígitos. No puede ser 12345 ni cinco iguales.</div>
      </div>`;
      continue;
    }

    html += `<div class="${cls}"><label>${escapar(c.e)}${c.req ? ' *' : ''}</label>`;

    if (c.tipo === 'lista'){
      const ops = S.aux[c.de] || [];
      html += `<select class="entrada" data-k="${c.k}">
        <option value="">— ninguno —</option>
        ${ops.map(o => `<option value="${o.id}" ${String(val(c.k)) === String(o.id) ? 'selected' : ''}
          >${escapar(o.nombre)}</option>`).join('')}</select>`;
    } else if (c.tipo === 'opciones'){
      html += `<select class="entrada" data-k="${c.k}">
        ${c.opciones.map(([v,t]) => `<option value="${v}" ${String(val(c.k)) === v ? 'selected' : ''}
          >${escapar(t)}</option>`).join('')}</select>`;
    } else {
      const modo = c.tipo === 'decimal' || c.tipo === 'entero' ? 'inputmode="decimal"' :
                   c.tipo === 'tel' ? 'inputmode="tel"' :
                   c.tipo === 'email' ? 'type="email"' : '';
      const numCls = (c.tipo === 'decimal' || c.tipo === 'entero') ? ' num' : '';
      html += `<input class="entrada${numCls}" data-k="${c.k}" ${modo}
                 ${bloqueado ? 'disabled' : ''} value="${escapar(val(c.k))}">`;
    }
    html += '</div>';
    const ayuda = bloqueado ? (c.ayudaBloqueado || 'Solo un supervisor puede cambiarlo.')
                            : c.ayuda;
    if (ayuda) html += `<div class="ayuda ${c.ancho ? 'ancho-total' : ''}">${escapar(ayuda)}</div>`;
  }
  html += '</div>';

  // acciones extra abajo
  if (fila && S.entidad === 'clientes' && Number(fila.saldo) > 0){
    html += `<div class="aviso ojo" style="margin-top:18px">
      Debe <b>${money(fila.saldo)}</b> de fiado.</div>`;
  }

  $('#form-cuerpo').innerHTML = html;
  ver('#form-velo');

  if (S.entidad === 'productos') prepararCodigos(fila);
  if (S.entidad === 'productos' && fila) cargarPrecio(fila.id);

  const primero = $('#form-cuerpo').querySelector('input[data-k],select[data-k]');
  if (primero && !fila) setTimeout(() => primero.focus(), 220);
}

async function cargarPrecio(productoId){
  const { data } = await sb.from('precios')
    .select('precio').eq('producto_id', productoId).eq('nivel','detalle')
    .is('vigente_hasta', null).order('cantidad_minima').limit(1);
  const campo = $('#form-cuerpo').querySelector('[data-k="precio"]');
  if (campo && data?.length) campo.value = data[0].precio;
}

/* ---------- códigos de barras ---------- */
let codigos = [];
let codigosOriginales = [];

async function prepararCodigos(fila){
  codigos = [];
  codigosOriginales = [];
  if (fila){
    const { data } = await sb.from('producto_codigos')
      .select('id,codigo').eq('producto_id', fila.id);
    codigos = (data || []).map(c => ({ id:c.id, codigo:c.codigo }));
    // copia aparte: con esto se sabe cuales quito el usuario
    codigosOriginales = codigos.map(c => ({ ...c }));
  }
  pintarCodigos();

  ver('#cod-camara', hayCamara());
  $('#cod-camara')?.addEventListener('click', async () => {
    const c = await escanear({ titulo:'Escanear código del producto' });
    if (c) agregarCodigo(c);
  });
  $('#cod-agregar')?.addEventListener('click', () => {
    const v = $('#cod-nuevo').value.trim();
    if (v) agregarCodigo(v);
  });
  $('#cod-nuevo')?.addEventListener('keydown', ev => {
    if (ev.key === 'Enter'){ ev.preventDefault(); $('#cod-agregar').click(); }
  });
}

function agregarCodigo(c){
  if (codigos.some(x => x.codigo === c)){
    $('#cod-nuevo').value = '';
    return;
  }
  codigos.push({ id:null, codigo:c });
  $('#cod-nuevo').value = '';
  pintarCodigos();
}

function pintarCodigos(){
  const z = $('#lista-codigos'); if (!z) return;
  z.innerHTML = codigos.length
    ? codigos.map((c,i) => `<div class="codigo"><b>${escapar(c.codigo)}</b>
        <button data-quitar="${i}" aria-label="Quitar">✕</button></div>`).join('')
    : '<div class="ayuda">Sin códigos todavía.</div>';
  z.querySelectorAll('[data-quitar]').forEach(b =>
    b.onclick = () => { codigos.splice(+b.dataset.quitar, 1); pintarCodigos(); });
}

/* ---------- guardar ---------- */
$('#form-cerrar').addEventListener('click', () => ver('#form-velo', false));
$('#form-cancelar').addEventListener('click', () => ver('#form-velo', false));

$('#form-guardar').addEventListener('click', async () => {
  const e = ENTIDADES[S.entidad];
  const b = $('#form-guardar');
  const datos = {};

  for (const c of e.campos){
    if (!c.k || c.k.startsWith('__')) continue;
    if (e.soloLectura?.includes(c.k)) continue;
    const el = $('#form-cuerpo').querySelector(`[data-k="${c.k}"]`);
    if (!el) continue;

    let v;
    if (c.tipo === 'si')            v = el.checked;
    else if (c.tipo === 'decimal')  v = num(el.value);
    else if (c.tipo === 'entero')   v = Math.round(num(el.value));
    else if (c.tipo === 'lista')    v = el.value || null;
    else                            v = el.value.trim() || null;

    if (c.req && (v === null || v === '' || (c.tipo === 'decimal' && v <= 0))){
      aviso('Falta un dato', 'Complete «' + c.e + '».', 'malo');
      return;
    }
    if (c.k !== 'precio') datos[c.k] = v;
  }

  const precio = S.entidad === 'productos'
    ? num($('#form-cuerpo').querySelector('[data-k="precio"]')?.value) : null;

  b.disabled = true; b.innerHTML = '<span class="girando"></span>';

  try{
    let id = S.editando?.id;

    if (S.entidad === 'usuarios'){
      // los usuarios no se crean aquí: solo se editan
      const { error } = await sb.from('perfiles')
        .update({ nombre:datos.nombre, telefono:datos.telefono,
                  rol:datos.rol, activo:datos.activo })
        .eq('id', id);
      if (error) throw error;

      const pin = $('#pin-nuevo')?.value.trim();
      if (pin){
        const { error:e2 } = await sb.rpc('fn_establecer_pin',
          { p_perfil_id:id, p_pin:pin });
        if (e2) throw e2;
      }
    } else {
      // El límite de fiado no se escribe en la tabla: la base no lo permite
      // y es decisión de supervisor. Va por su propia función, que deja
      // constancia de quién lo fijó.
      let limite = null;
      if (S.entidad === 'clientes' && 'limite_credito' in datos){
        limite = Number(datos.limite_credito) || 0;
        delete datos.limite_credito;
      }

      if (id){
        const { error } = await sb.from(e.tabla).update(datos).eq('id', id);
        if (error) throw error;
      } else {
        datos.organizacion_id = S.ctx.organizacion.id;
        const { data, error } = await sb.from(e.tabla).insert(datos).select('id').single();
        if (error) throw error;
        id = data.id;
      }

      if (limite !== null && limite !== Number(S.editando?.limite_credito || 0)){
        const { error } = await sb.rpc('fn_fijar_limite_credito',
          { p_cliente_id:id, p_limite:limite });
        if (error) throw error;
      }
    }

    if (S.entidad === 'productos'){
      await guardarPrecio(id, precio);
      await guardarCodigos(id);
    }

    ver('#form-velo', false);
    await Promise.all([cargarLista(), cargarAuxiliares()]);
  }catch(err){
    aviso('No se pudo guardar', limpiarError(err), 'malo');
  }finally{
    b.disabled = false; b.textContent = 'Guardar';
  }
});

async function guardarPrecio(productoId, precio){
  if (!precio || precio <= 0) return;
  const { data } = await sb.from('precios')
    .select('id,precio').eq('producto_id', productoId).eq('nivel','detalle')
    .is('sucursal_id', null).is('vigente_hasta', null).limit(1);

  if (data?.length){
    if (Number(data[0].precio) === precio) return;
    const { error } = await sb.from('precios').update({ precio }).eq('id', data[0].id);
    if (error) throw error;
  } else {
    const { error } = await sb.from('precios').insert({
      organizacion_id:S.ctx.organizacion.id, producto_id:productoId,
      precio, nivel:'detalle', cantidad_minima:1 });
    if (error) throw error;
  }
}

async function guardarCodigos(productoId){
  const nuevos = codigos.filter(c => !c.id);
  if (nuevos.length){
    const { error } = await sb.from('producto_codigos').insert(
      nuevos.map(c => ({ organizacion_id:S.ctx.organizacion.id,
                         producto_id:productoId, codigo:c.codigo })));
    if (error) throw error;
  }
  const quitados = codigosOriginales
    .filter(o => !codigos.some(c => c.id === o.id));
  if (quitados.length){
    const { error } = await sb.from('producto_codigos')
      .delete().in('id', quitados.map(q => q.id));
    if (error) throw error;
  }
}

/* ==========================================================================
   AVISOS
   ========================================================================== */
function aviso(titulo, texto, tono){
  $('#hoja').innerHTML = `<h2>${escapar(titulo)}</h2>
    <div class="aviso ${tono}" style="margin-top:14px">${escapar(texto)}</div>
    <button class="btn principal-b" style="width:100%" id="ok">Entendido</button>`;
  ver('#velo');
  $('#ok').onclick = () => ver('#velo', false);
}
$('#velo').addEventListener('click', e => { if (e.target.id === 'velo') ver('#velo', false); });
$('#form-velo').addEventListener('click', e => {
  if (e.target.id === 'form-velo') ver('#form-velo', false);
});

/* ==========================================================================
   INICIO
   ========================================================================== */
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
sb.auth.onAuthStateChange(ev => { if (ev === 'SIGNED_OUT') location.reload(); });
arrancar();
</script>
