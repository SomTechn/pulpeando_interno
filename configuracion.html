<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F1729">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" href="icono-192.png" type="image/png">
<link rel="apple-touch-icon" href="icono-192.png">
<title>Configuración · Pulpeando</title>
<script src="config.js"></script>
<script src="tema.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="ui.css">
<style>
.zona{flex:1;overflow-y:auto;min-height:0;padding:16px 16px 40px}
.limite{max-width:860px;margin:0 auto}

.ficha{background:var(--panel);border:1px solid var(--linea);border-radius:var(--r-md);
  padding:18px;margin-bottom:14px}
.ficha h3{font-size:16px;font-weight:800;margin-bottom:4px}
/* logo y promociones de la caja bloqueada */
.img-fila{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
/* el color de la marca */
.perm{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:10px 0;
  border-bottom:1px solid var(--linea);font-size:14px;font-weight:600;cursor:pointer}
.perm:last-of-type{border-bottom:0}
.col-sug{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:16px}
.col-mu{width:40px;height:40px;border-radius:12px;background:var(--c);position:relative;
  box-shadow:inset 0 0 0 1px rgba(15,23,41,.08);transition:transform .12s;cursor:pointer}
.col-mu:hover{transform:scale(1.06)}
.col-mu.si{box-shadow:0 0 0 2px var(--panel),0 0 0 4px var(--c)}
.col-mu.si::after{content:'';position:absolute;left:50%;top:50%;width:10px;height:6px;
  border:solid #fff;border-width:0 0 2.5px 2.5px;transform:translate(-50%,-65%) rotate(-45deg)}
.col-otro{background:conic-gradient(#e11d48,#f59e0b,#16a34a,#0ea5e9,#6366f1,#d946ef,#e11d48);
  display:grid;place-items:center;overflow:hidden}
.col-otro span{width:22px;height:22px;border-radius:50%;background:var(--panel);display:grid;
  place-items:center;font-weight:800;font-size:15px;color:var(--tinta)}
.col-otro input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.col-fila{display:flex;gap:16px;align-items:flex-end;flex-wrap:wrap}
.col-muestra{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding-bottom:4px}
.col-muestra span{height:38px;display:inline-flex;align-items:center;padding:0 14px;border-radius:10px;
  font-size:13px;font-weight:700}
.col-btn{background:var(--marca);color:var(--marca-sobre)}
.col-sel{background:var(--marca-suave);color:var(--marca-tinta);border:1px solid var(--marca-borde)}
.col-link{color:var(--marca-tinta);text-decoration:underline}
.col-aviso{font-size:12.5px;color:var(--tenue);margin-top:10px;min-height:16px}
.col-acc{display:flex;gap:10px;justify-content:flex-end;margin-top:12px;flex-wrap:wrap}
.col-acc .btn{height:44px}
.img-logo{width:200px;height:90px;border:1px dashed var(--linea);border-radius:var(--r-sm);
  display:grid;place-items:center;background:var(--fondo);overflow:hidden;padding:8px;flex:0 0 auto}
.img-logo img{max-width:100%;max-height:100%;object-fit:contain}
.img-logo span{font-size:12px;color:var(--tenue);text-align:center}
.img-botones{display:flex;gap:8px;flex-wrap:wrap}
.img-subir{cursor:pointer}
.img-promos{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.img-promo{position:relative;aspect-ratio:16/9;border-radius:var(--r-sm);overflow:hidden;
  background:var(--fondo);border:1px solid var(--linea)}
.img-promo img{width:100%;height:100%;object-fit:cover;display:block}
.img-quitar{position:absolute;top:6px;right:6px;width:32px;height:32px;border-radius:50%;
  background:rgba(15,23,41,.75);color:#fff;font-size:14px;font-weight:700}
.img-agregar{display:grid;place-items:center;border-style:dashed;cursor:pointer;
  font-size:13px;font-weight:700;color:var(--azul)}
.img-agregar:focus-within,.img-subir:focus-within{outline:2px solid var(--azul);outline-offset:2px}
.ficha .sub{font-size:13px;color:var(--tenue);line-height:1.5;margin-bottom:14px}
.campos{display:grid;gap:13px;grid-template-columns:1fr 1fr}
.ancho-total{grid-column:1/-1}
.ayuda{font-size:12px;color:var(--tenue);margin-top:-3px;line-height:1.4}
.entrada{height:48px;border:1.5px solid var(--linea);border-radius:var(--r-md);padding:0 13px;
  outline:none;font-size:15px;background:var(--panel);width:100%}
.entrada:focus{border-color:var(--azul)}
select.entrada{padding:0 10px}
textarea.entrada{height:auto;min-height:70px;padding:11px 13px;resize:vertical;font:inherit}
.pie-ficha{display:flex;justify-content:flex-end;gap:10px;margin-top:16px}

.interruptor{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:var(--r-md);
  background:var(--fondo)}
.interruptor div{flex:1}
.interruptor b{display:block;font-size:14.5px}
.interruptor small{display:block;font-size:12.5px;color:var(--tenue);margin-top:2px;line-height:1.45}
.switch{width:48px;height:28px;border-radius:999px;background:#CBD5E1;position:relative;flex:0 0 auto;
  transition:background .15s}
.switch::after{content:'';position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;
  background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .15s}
.switch.on{background:var(--marca)}
.switch.on::after{transform:translateX(20px)}

.segmento{display:inline-flex;background:var(--fondo);border-radius:var(--r-md);padding:3px}
.segmento button{height:40px;padding:0 16px;border-radius:9px;font-size:13.5px;font-weight:800;color:var(--tenue)}
.segmento button.activo{background:var(--panel);color:var(--tinta);box-shadow:0 1px 3px rgba(15,23,41,.12)}

/* rangos de facturacion */
.rango{border:1px solid var(--linea);border-radius:var(--r-md);padding:14px 15px;margin-bottom:10px}
.rango.alerta{border-color:#F3E2BC;background:#FFFBF2}
.rango.malo{border-color:#F6CBD6;background:#FFF7F9}
.rango.apagado{opacity:.6}
.rango-cab{display:flex;align-items:flex-start;gap:10px;flex-wrap:wrap}
.rango-cab b{font-family:var(--num);font-size:15px}
.rango-cab small{display:block;font-size:12px;color:var(--tenue);margin-top:3px;font-family:var(--num);
  overflow-wrap:anywhere}
.rango-cab .sello{margin-left:auto}
.barra-uso{height:8px;border-radius:999px;background:var(--fondo);overflow:hidden;margin:12px 0 8px}
.barra-uso span{display:block;height:100%;border-radius:999px;background:var(--verde)}
.rango.alerta .barra-uso span{background:var(--ambar)}
.rango.malo .barra-uso span{background:var(--rojo)}
.rango-datos{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px;color:var(--tenue)}
.rango-datos b{color:var(--tinta);font-family:var(--num)}
.rango-acc{display:flex;gap:8px;margin-top:10px}
.rango-acc .btn{height:38px;font-size:13px;padding:0 14px}
.sello{display:inline-flex;align-items:center;padding:3px 10px;border-radius:999px;font-size:11px;
  font-weight:800;text-transform:uppercase;letter-spacing:.03em}
.sello.ok{background:#E7F7EE;color:var(--verde-oscuro)}
.sello.alerta{background:#FFF4E0;color:#8A5A00}
.sello.malo{background:#FFEDF1;color:#9F1239}
.sello.off{background:var(--fondo);color:var(--tenue)}

/* sucursales, cajas, impuestos */
.fila{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--linea)}
.fila:first-of-type{border-top:none}
.fila-txt{flex:1;min-width:0}
.fila-txt b{display:block;font-size:14.5px;font-weight:700}
.fila-txt small{display:block;font-size:12.5px;color:var(--tenue);margin-top:2px;line-height:1.45}
.fila .btn{height:38px;font-size:13px;padding:0 14px;flex:0 0 auto}
.cajas{margin:4px 0 8px 14px;padding-left:12px;border-left:2px solid var(--linea)}
.cajas .fila{padding:8px 0}
.mas{height:40px;border-radius:10px;border:1.5px dashed var(--linea);width:100%;font-size:13.5px;
  font-weight:700;color:var(--tenue);margin-top:8px}
.mas:hover{border-color:var(--azul);color:var(--azul)}
.inactivo{opacity:.5}

@media (max-width:640px){
  .campos{grid-template-columns:1fr}
  .zona{padding:12px 12px 40px}
  .ficha{padding:15px}
}
</style>
</head>
<body>

<div class="oscura oculto" id="p-config">
  <div class="tarjeta-oscura">
    <div class="marca"><span>◧</span> Configuración</div>
    <div class="titulo-o">Falta conectar el proyecto</div>
    <p class="sub-o">Ponga la URL y la llave publishable en <b>config.js</b>.</p>
  </div>
</div>

<div class="oscura oculto" id="p-sesion">
  <div class="tarjeta-oscura">
    <div class="marca"><span>◧</span> Configuración</div>
    <div class="titulo-o">Iniciar sesión</div>
    <p class="sub-o">Use el correo con el que entra al sistema</p>
    <input class="campo-o" id="s-email" type="email" placeholder="correo@negocio.hn" autocomplete="username">
    <input class="campo-o" id="s-clave" type="password" placeholder="Contraseña" autocomplete="current-password">
    <div class="error-o" id="s-error"></div>
    <button class="btn-o" id="s-entrar">Entrar</button>
  </div>
</div>

<div class="oscura oculto" id="p-bloqueado">
  <div class="tarjeta-oscura">
    <div class="marca"><span>◧</span> Configuración</div>
    <div class="titulo-o" id="bl-titulo">Sin permiso</div>
    <p class="sub-o" id="bl-texto"></p>
    <a class="btn-o" href="caja/" style="display:block;line-height:52px">Ir a la caja</a>
    <button class="btn-o fantasma" id="bl-salir">Cerrar sesión</button>
  </div>
</div>

<div class="armazon oculto" id="app">
  <aside id="menu"></aside>
  <div class="principal">
    <header class="barra">
      <button class="hamburguesa" id="abrir-menu" aria-label="Menú">
        <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <div class="barra-titulo"><b id="h-titulo">Negocio</b><small id="h-negocio">—</small></div>
      <div class="barra-fin"><span class="pill" id="h-usuario">—</span></div>
    </header>
    <div class="zona"><div class="limite" id="cuerpo"></div></div>
  </div>
</div>

<div class="velo oculto" id="velo"><div class="hoja" id="hoja"></div></div>

<script type="module">
const CFG = window.SUPABASE_CONFIG || {};
const SUPABASE_URL = CFG.url || 'PEGUE_AQUI_LA_URL';
const SUPABASE_KEY = CFG.key || 'PEGUE_AQUI_LA_LLAVE';

const $ = s => document.querySelector(s);
const ver = (id, si = true) => $(id).classList.toggle('oculto', !si);

if (SUPABASE_URL.startsWith('PEGUE')){ ver('#p-config'); throw new Error('sin configurar'); }

import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
import { montarMenu, escapar } from './menu.js';
import { imprimirTicket } from './ticket.js';

const sb = createClient(SUPABASE_URL, SUPABASE_KEY, {
  auth:{ persistSession:true, autoRefreshToken:true }
});

const S = { ctx:null, menu:null, vista:'negocio', org:null, sucursales:[], cajas:[],
            impuestos:[], aparatos:[], facturacion:null, moneda:'L' };

const money = n => S.moneda + ' ' + (Number(n)||0).toLocaleString('es-HN',
  { minimumFractionDigits:2, maximumFractionDigits:2 });
const num = v => { const n = parseFloat(String(v).replace(/[^0-9.\-]/g, '')); return isNaN(n) ? 0 : n; };
const hoyIso = () => { const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };
const MESES = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
function fecha(v){
  if (!v) return '—';
  const [a, m, d] = String(v).slice(0,10).split('-').map(Number);
  return `${d} ${MESES[m-1]} ${a}`;
}

function limpiarError(e){
  const m = (e?.message || String(e)).replace(/^(?:[0-9A-Z]{5}|error|Error|ERROR):\s*/, '');
  if (/JWT|token/i.test(m)) return 'La sesión venció. Vuelva a entrar.';
  if (/Failed to fetch|NetworkError/i.test(m)) return 'Sin conexión con el servidor';
  if (/Could not find the function|schema cache/i.test(m)) return 'Falta instalar la migración 030 en Supabase.';
  if (/sucursales_organizacion_id_codigo_key/.test(m)) return 'Ya hay una sucursal con ese código.';
  if (/cajas_sucursal_id_codigo_key/.test(m)) return 'Ya hay una caja con ese código en esa sucursal.';
  if (/impuestos_organizacion_id_nombre_key/.test(m)) return 'Ya hay un impuesto con ese nombre.';
  return m;
}

function aviso(titulo, texto, tono = 'malo'){
  $('#hoja').innerHTML = `<h2>${escapar(titulo)}</h2>
    <div class="aviso ${tono}" style="margin-top:12px">${escapar(texto)}</div>
    <button class="btn principal-b" style="width:100%" id="ok">Entendido</button>`;
  ver('#velo');
  $('#ok').onclick = () => ver('#velo', false);
}
const cerrarHoja = () => ver('#velo', false);
$('#velo').addEventListener('click', e => { if (e.target.id === 'velo') cerrarHoja(); });

function confirmar(titulo, texto, si = 'Sí'){
  return new Promise(res => {
    $('#hoja').innerHTML = `<h2>${escapar(titulo)}</h2>
      <div class="aviso ojo" style="margin-top:12px">${texto}</div>
      <div class="acciones"><button class="btn secundario" id="c-no">Volver</button>
        <button class="btn principal-b" id="c-si">${escapar(si)}</button></div>`;
    ver('#velo');
    $('#c-no').onclick = () => { cerrarHoja(); res(false); };
    $('#c-si').onclick = () => { cerrarHoja(); res(true); };
  });
}

/* ================= sesión ================= */
$('#s-entrar').addEventListener('click', async () => {
  const b = $('#s-entrar');
  $('#s-error').textContent = '';
  b.disabled = true; b.innerHTML = '<span class="girando"></span>';
  const { error } = await sb.auth.signInWithPassword({
    email:$('#s-email').value.trim(), password:$('#s-clave').value });
  b.disabled = false; b.textContent = 'Entrar';
  if (error){ $('#s-error').textContent = 'Correo o contraseña incorrectos'; return; }
  arrancar();
});
$('#s-clave').addEventListener('keydown', e => { if (e.key === 'Enter') $('#s-entrar').click(); });
$('#bl-salir').addEventListener('click', async () => { await sb.auth.signOut(); location.reload(); });

async function arrancar(){
  const { data:{ session } } = await sb.auth.getSession();
  if (!session){ ver('#p-sesion'); return; }
  ver('#p-sesion', false);

  const { data, error } = await sb.rpc('fn_pos_contexto');
  if (error){
    ver('#p-sesion');
    $('#s-error').textContent = 'Su usuario no tiene perfil en ningún negocio';
    await sb.auth.signOut();
    return;
  }
  S.ctx = data;
  S.moneda = data.organizacion.moneda === 'HNL' ? 'L' : data.organizacion.moneda;

  if (data.usuario.nivel < 3){
    ver('#p-bloqueado');
    $('#bl-titulo').textContent = 'Esta pantalla es del gerente';
    $('#bl-texto').textContent = 'Los datos fiscales, las sucursales y las cajas los configura el gerente.';
    return;
  }

  $('#h-usuario').textContent = data.usuario.nombre;
  $('#h-negocio').textContent = data.organizacion.nombre;
  $('#app').classList.remove('oculto');

  S.menu = montarMenu({
    contenedor:'#menu', modulo:'configuracion', ctx:S.ctx,
    alSalir: async () => { await sb.auth.signOut(); location.reload(); },
    secciones:[{ id:'config', titulo:'Configuración', items:[
      { valor:'negocio',     nombre:'Negocio y ticket', icono:'ajustes', activo:true },
      { valor:'facturacion', nombre:'Facturación (CAI)', icono:'reportes' },
      { valor:'sucursales',  nombre:'Sucursales y cajas', icono:'caja' },
      { valor:'aparatos',    nombre:'Aparatos de caja', icono:'caja' },
      { valor:'impuestos',   nombre:'Impuestos', icono:'etiqueta' } ] }]
  });
  S.menu.alElegir(abrir);
  $('#abrir-menu').addEventListener('click', () => S.menu.alternar());

  await cargarTodo();
  abrir('negocio');
}

async function cargarTodo(){
  const [o, s, c, i, f] = await Promise.all([
    sb.from('organizaciones').select('id,nombre,identificacion_fiscal,facturacion_fiscal_activa,config,moneda,codigo_tienda')
      .eq('id', S.ctx.organizacion.id).single(),
    sb.from('sucursales').select('id,codigo,nombre,direccion,telefono,es_principal,activa,acepta_domicilio,costo_envio,pedido_minimo')
      .order('es_principal', { ascending:false }).order('nombre'),
    sb.from('cajas').select('id,sucursal_id,codigo,nombre,activa,numero').order('codigo'),
    sb.from('impuestos').select('id,nombre,tasa,incluido_en_precio,es_predeterminado,activo').order('tasa'),
    sb.rpc('fn_estado_facturacion')
  ]);
  S.org = o.data || { config:{} };
  S.org.config = S.org.config || {};
  S.sucursales = s.data || [];
  S.cajas = c.data || [];
  S.impuestos = i.data || [];
  S.facturacion = f.error ? { error:limpiarError(f.error), rangos:[] } : f.data;
}

const TITULOS = { negocio:'Negocio y ticket', facturacion:'Facturación (CAI)',
                  sucursales:'Sucursales y cajas', aparatos:'Aparatos de caja',
                  impuestos:'Impuestos' };

function abrir(v){
  S.vista = v;
  S.menu?.marcar?.(v);
  $('#h-titulo').textContent = TITULOS[v];
  ({ negocio:pintarNegocio, facturacion:pintarFacturacion,
     sucursales:pintarSucursales, aparatos:pintarAparatos,
     impuestos:pintarImpuestos })[v]();
}

/* ================= negocio y ticket ================= */
function pintarNegocio(){
  const o = S.org, c = o.config || {};
  const ancho = Number(c.ancho_ticket) === 58 ? 58 : 80;
  $('#cuerpo').innerHTML = `
    <div class="ficha">
      <h3>Datos del negocio</h3>
      <p class="sub">Salen en el encabezado de cada ticket y factura. Para facturar, la SAR
        pide el RTN y el domicilio fiscal tal como están en su constancia.</p>
      <div class="campos">
        <div class="campo-g ancho-total"><label for="n-nombre">Nombre comercial *</label>
          <input class="entrada" id="n-nombre" value="${escapar(o.nombre)}"></div>
        <div class="campo-g ancho-total"><label for="n-razon">Razón social</label>
          <input class="entrada" id="n-razon" value="${escapar(c.razon_social || '')}"
                 placeholder="Como aparece en el RTN, si es distinta del nombre"></div>
        <div class="campo-g"><label for="n-rtn">RTN</label>
          <input class="entrada num" id="n-rtn" inputmode="numeric" maxlength="16"
                 value="${escapar(o.identificacion_fiscal || '')}" placeholder="14 dígitos"></div>
        <div class="campo-g"><label for="n-tel">Teléfono</label>
          <input class="entrada" id="n-tel" inputmode="tel" value="${escapar(c.telefono || '')}"></div>
        <div class="campo-g ancho-total"><label for="n-dir">Domicilio fiscal</label>
          <input class="entrada" id="n-dir" value="${escapar(c.direccion_fiscal || '')}"
                 placeholder="Colonia, calle, municipio, departamento"></div>
        <div class="campo-g ancho-total"><label for="n-correo">Correo</label>
          <input class="entrada" id="n-correo" type="email" value="${escapar(c.correo || '')}"></div>
      </div>
    </div>

    <div class="ficha">
      <h3>Color de la marca</h3>
      <p class="sub">El color principal de todo el sistema: botones, lo seleccionado, el menú y
        la caja. Escoja uno de los sugeridos o el de su logo. Si es muy claro, el sistema
        oscurece el texto solo para que se siga leyendo.</p>
      <div id="n-color-zona"></div>
    </div>

    <div class="ficha">
      <h3>Permisos en la caja</h3>
      <p class="sub">Lo que la cajera no puede hacer sola: pide el código y el PIN de un supervisor o del
        gerente. Queda anotado quién autorizó, y se ve en Finanzas.</p>
      <div id="n-permisos"></div>
    </div>

    <div class="ficha">
      <h3>La caja bloqueada</h3>
      <p class="sub">Lo que se ve en la caja entre un cliente y otro: el logo del negocio y
        las imágenes de las promociones. PNG, JPG o WEBP, de 2 MB como mucho.</p>
      <div class="campo-g ancho-total"><label>Logo</label>
        <div id="n-logo-zona"></div></div>
      <div class="campo-g ancho-total" style="margin-top:16px"><label>Promociones</label>
        <div id="n-promos-zona"></div></div>
    </div>

    <div class="ficha">
      <h3>El ticket</h3>
      <p class="sub">Cómo sale impreso en la caja y en Ventas.</p>

/* ================= logo y promociones =================

   Se suben a Storage (bucket "marca", una carpeta por negocio) y en la
   configuración queda solo la ruta. Cada subida se guarda en el momento: no
   espera al botón Guardar, porque una imagen subida y no anotada es basura
   que nadie va a encontrar para borrar. */
const MAX_PROMOS = 8;
const urlPublica = ruta => `${SUPABASE_URL}/storage/v1/object/public/marca/${ruta}`;
const TIPOS_IMG = { 'image/png':'png', 'image/jpeg':'jpg', 'image/webp':'webp' };

async function subirImagen(archivo, prefijo){
  if (!TIPOS_IMG[archivo.type]) throw new Error('Use una imagen PNG, JPG o WEBP.');
  if (archivo.size > 2 * 1024 * 1024)
    throw new Error('La imagen pasa de 2 MB. Achíquela antes de subirla.');
  const ruta = `${S.ctx.organizacion.id}/${prefijo}-${Date.now()}-` +
               `${Math.random().toString(36).slice(2, 7)}.${TIPOS_IMG[archivo.type]}`;
  const { error } = await sb.storage.from('marca').upload(ruta, archivo,
    { contentType:archivo.type, upsert:false, cacheControl:'31536000' });
  if (error) throw error;
  return ruta;
}

async function anotarImagenes(cambios){
  const config = { ...(S.org.config || {}), ...cambios };
  const { error } = await sb.from('organizaciones').update({ config }).eq('id', S.ctx.organizacion.id);
  if (error) throw error;
  S.org.config = config;
}

// Borrar el archivo viejo es limpieza: si falla, la imagen ya no se usa igual.
async function borrarArchivo(ruta){
  if (!ruta) return;
  try { await sb.storage.from('marca').remove([ruta]); } catch {}
}

/* ---------- el color de la marca ----------
   Se ve al instante en toda la pantalla mientras se escoge; se guarda con
   el botón. Si se sale sin guardar, vuelve el que estaba. */
function pintarColor(){
  const T = window.PulpeandoTema;
  const z = $('#n-color-zona');
  if (!T || !z) return;
  const actual = (S.org.config || {}).color_marca;
  const guardado = T.valido(actual) ? actual.toUpperCase() : T.FABRICA;
  let elegido = guardado;

  z.innerHTML = `
    <div class="col-sug" role="radiogroup" aria-label="Colores sugeridos">
      ${T.SUGERIDOS.map(([c, n]) => `
        <button class="col-mu" role="radio" data-c="${c}" title="${n}" aria-label="${n}"
                style="--c:${c}"></button>`).join('')}
      <label class="col-mu col-otro" title="Otro color">
        <input type="color" id="n-color-libre" value="${guardado}" aria-label="Otro color">
        <span>+</span>
      </label>
    </div>
    <div class="col-fila">
      <div class="campo-g"><label for="n-color-hex">Código del color</label>
        <input class="entrada num" id="n-color-hex" value="${guardado}" maxlength="7"
               spellcheck="false" autocomplete="off" style="width:130px;text-align:left"></div>
      <div class="col-muestra" aria-hidden="true">
        <span class="col-btn">Cobrar</span>
        <span class="col-sel">Seleccionado</span>
        <span class="col-link">Un enlace</span>
      </div>
    </div>
    <div class="col-aviso" id="n-color-aviso"></div>
    <div class="col-acc">
      <button class="btn secundario" id="n-color-fabrica">Volver al de fábrica</button>
      <button class="btn principal-b" id="n-color-guardar" disabled>Guardar color</button>
    </div>`;

  const marcar = () => {
    z.querySelectorAll('[data-c]').forEach(b => {
      const si = b.dataset.c.toUpperCase() === elegido;
      b.classList.toggle('si', si); b.setAttribute('aria-checked', String(si));
    });
    $('#n-color-hex').value = elegido;
    $('#n-color-libre').value = elegido.toLowerCase();
    $('#n-color-guardar').disabled = elegido === guardado;
    const t = T.tonos(elegido);
    const claro = T.contraste(elegido, '#FFFFFF') < 3;
    $('#n-color-aviso').textContent = claro
      ? 'Es un color claro: en botones lleva letra oscura y en textos se usa una versión más oscura.'
      : '';
  };
  const probar = c => {
    if (!T.valido(c)) return;
    elegido = c.toUpperCase();
    T.aplicar(elegido, false);
    marcar();
  };
  marcar();

  z.querySelectorAll('[data-c]').forEach(b => b.addEventListener('click', () => probar(b.dataset.c)));
  $('#n-color-libre').addEventListener('input', e => probar(e.target.value));
  $('#n-color-hex').addEventListener('input', e => {
    let v = e.target.value.trim();
    if (v && v[0] !== '#') v = '#' + v;
    if (T.valido(v)) probar(v);
  });
  $('#n-color-fabrica').addEventListener('click', () => probar(T.FABRICA));
  $('#n-color-guardar').addEventListener('click', async () => {
    const b = $('#n-color-guardar');
    b.disabled = true; b.innerHTML = '<span class="girando"></span>';
    try{
      await anotarImagenes({ color_marca: elegido === T.FABRICA ? null : elegido });
      T.aplicar(elegido === T.FABRICA ? null : elegido);
      if (S.ctx?.organizacion) S.ctx.organizacion.color = elegido;
      pintarColor();
    }catch(err){
      b.disabled = false; b.textContent = 'Guardar color';
      aviso('No se pudo guardar el color', limpiarError(err));
    }
  });
  // Si se va sin guardar, la pantalla no se queda con un color de prueba.
  window.addEventListener('pagehide', () => {
    if (elegido !== guardado) T.aplicar(guardado === T.FABRICA ? null : guardado, false);
  }, { once:true });
}

/* ---------- qué pide permiso en la caja ---------- */
const PERMISOS = [
  ['cancelar',  'Cancelar una venta con productos ya marcados (F12)', true],
  ['descartar', 'Borrar ventas que están en espera', true],
  ['quitar',    'Quitar o bajar productos ya marcados (F4 y −)', false]];
function pintarPermisos(){
  const z = $('#n-permisos'); if (!z) return;
  const c = (S.org.config || {}).caja_autoriza || {};
  z.innerHTML = PERMISOS.map(([k, t, def]) => {
    const on = c[k] === undefined ? def : !!c[k];
    return `<label class="perm"><span>${t}</span>
      <button class="switch ${on ? 'on' : ''}" role="switch" aria-checked="${on}" data-perm="${k}"><i></i></button></label>`;
  }).join('') + `<p class="sub" style="margin:10px 0 0">En una pulpería chica conviene dejar libre quitar productos;
    en un negocio con varias cajas, conviene pedirlo todo.</p>`;
  z.querySelectorAll('[data-perm]').forEach(b => b.addEventListener('click', async () => {
    const actual = { ...Object.fromEntries(PERMISOS.map(([k, , d]) => [k, c[k] === undefined ? d : !!c[k]])) };
    actual[b.dataset.perm] = !actual[b.dataset.perm];
    b.disabled = true;
    try{ await anotarImagenes({ caja_autoriza:actual }); pintarPermisos(); }
    catch(err){ b.disabled = false; aviso('No se pudo guardar', limpiarError(err)); }
  }));
}

function pintarImagenes(){
  pintarColor();
  pintarPermisos();
  const c = S.org.config || {};
  const logo = c.logo_path;
  const promos = Array.isArray(c.promos_caja) ? c.promos_caja : [];

  $('#n-logo-zona').innerHTML = `
    <div class="img-fila">
      <div class="img-logo">${logo
        ? `<img src="${escapar(urlPublica(logo))}" alt="Logo">`
        : '<span>Sin logo: se ve el nombre del negocio</span>'}</div>
      <div class="img-botones">
        <label class="btn secundario img-subir">${logo ? 'Cambiar logo' : 'Subir logo'}
          <input type="file" id="n-logo-archivo" accept="image/png,image/jpeg,image/webp" hidden></label>
        ${logo ? '<button class="btn secundario" id="n-logo-quitar">Quitar</button>' : ''}
      </div>
    </div>`;

  $('#n-promos-zona').innerHTML = `
    <div class="img-promos">
      ${promos.map((r, i) => `
        <div class="img-promo"><img src="${escapar(urlPublica(r))}" alt="Promoción ${i + 1}">
          <button class="img-quitar" data-quitar="${i}" aria-label="Quitar la promoción ${i + 1}">✕</button></div>`).join('')}
      ${promos.length < MAX_PROMOS ? `
        <label class="img-promo img-agregar">+ Agregar imágenes
          <input type="file" id="n-promos-archivo" accept="image/png,image/jpeg,image/webp" multiple hidden></label>` : ''}
    </div>
    <div class="ayuda" style="margin-top:6px">${promos.length} de ${MAX_PROMOS}. En la caja
      pasan una tras otra.</div>`;

  $('#n-logo-archivo').onchange = async e => {
    const f = e.target.files[0]; if (!f) return;
    try{
      const viejo = logo;
      const ruta = await subirImagen(f, 'logo');
      await anotarImagenes({ logo_path:ruta });
      await borrarArchivo(viejo);
      pintarImagenes();
    }catch(err){ aviso('No se pudo subir el logo', limpiarError(err)); }
  };
  $('#n-logo-quitar')?.addEventListener('click', async () => {
    if (!await confirmar('Quitar el logo', 'La caja bloqueada enseñará el nombre del negocio.', 'Quitar')) return;
    try{ await anotarImagenes({ logo_path:null }); await borrarArchivo(logo); pintarImagenes(); }
    catch(err){ aviso('No se pudo quitar', limpiarError(err)); }
  });

  $('#n-promos-archivo')?.addEventListener('change', async e => {
    const archivos = [...e.target.files].slice(0, MAX_PROMOS - promos.length);
    if (!archivos.length) return;
    const nuevas = [];
    try{
      for (const f of archivos) nuevas.push(await subirImagen(f, 'promo'));
      await anotarImagenes({ promos_caja:[...promos, ...nuevas] });
      pintarImagenes();
    }catch(err){
      // Lo que alcanzó a subir antes del error se anota igual.
      if (nuevas.length){
        try{ await anotarImagenes({ promos_caja:[...promos, ...nuevas] }); }catch{}
        pintarImagenes();
      }
      aviso('No se pudo subir una imagen', limpiarError(err));
    }
  });
  $('#n-promos-zona').querySelectorAll('[data-quitar]').forEach(b => b.onclick = async () => {
    const i = Number(b.dataset.quitar);
    if (!await confirmar('Quitar la promoción', 'Deja de verse en la caja.', 'Quitar')) return;
    const ruta = promos[i];
    try{
      await anotarImagenes({ promos_caja:promos.filter((_, j) => j !== i) });
      await borrarArchivo(ruta);
      pintarImagenes();
    }catch(err){ aviso('No se pudo quitar', limpiarError(err)); }
  });
}

  if (d.rtn && d.rtn.length !== 14){ aviso('RTN incompleto', 'El RTN tiene 14 dígitos.'); return; }
  const b = $('#n-guardar');
  b.disabled = true; b.innerHTML = '<span class="girando"></span>';
  const { error } = await sb.from('organizaciones')
    .update({ nombre:d.nombre, identificacion_fiscal:d.rtn || null, config:d.config })
    .eq('id', S.org.id);
  b.disabled = false; b.textContent = 'Guardar';
  if (error){ aviso('No se pudo guardar', limpiarError(error)); return; }

/* ================= facturación ================= */
function estadoRango(r){
  if (!r.activa) return { clase:'off', texto:'Inactivo', tono:'apagado' };
  if (r.quedan <= 0) return { clase:'malo', texto:'Agotado', tono:'malo' };
  if (r.dias !== null && r.dias < 0) return { clase:'malo', texto:'Vencido', tono:'malo' };
  if (r.quedan <= 50 || (r.dias !== null && r.dias <= 15))
    return { clase:'alerta', texto:'Por acabarse', tono:'alerta' };
  return { clase:'ok', texto:'Vigente', tono:'' };
}

function pintarFacturacion(){
  const f = S.facturacion || { rangos:[] };
  const activa = !!S.org.facturacion_fiscal_activa;
  // Facturas primero; las notas de credito (devoluciones de una factura)
  // llevan su propio rango y su propio CAI.
  const rangos = (f.rangos || []).filter(r => r.tipo === 'factura' || r.tipo === 'nota_credito')
    .sort((a, b) => (a.tipo === 'factura' ? 0 : 1) - (b.tipo === 'factura' ? 0 : 1));
  const vigentes = rangos.filter(r => r.vigente && r.tipo === 'factura');
  const conNC = rangos.some(r => r.vigente && r.tipo === 'nota_credito');
  const sinRango = S.sucursales.filter(s => s.activa && !vigentes.some(r => r.sucursal_id === s.id));

  $('#cuerpo').innerHTML = `
    ${f.error ? `<div class="aviso malo">${escapar(f.error)}</div>` : ''}
    <div class="ficha">
      <h3>Facturación fiscal</h3>
      <p class="sub">Con esto encendido la caja puede emitir <b>factura</b> con CAI y correlativo
        de la SAR. Apagado, todo sale como comprobante interno.</p>
      <div class="interruptor">
        <div><b>${activa ? 'La caja emite facturas' : 'Solo comprobantes internos'}</b>
          <small>${activa
            ? 'En cada cobro la cajera elige si lleva factura fiscal.'
            : 'Necesita al menos un rango de CAI vigente para encenderlo.'}</small></div>
        <button class="switch ${activa ? 'on' : ''}" id="f-activa" aria-label="Facturación fiscal"></button>
      </div>
      ${activa && sinRango.length ? `<div class="aviso ojo" style="margin:12px 0 0">
        ${sinRango.map(s => escapar(s.nombre)).join(', ')} no ${sinRango.length === 1 ? 'tiene' : 'tienen'}
        rango vigente: ahí no se podrá facturar hasta registrar uno.</div>` : ''}
      ${activa && !conNC ? `<div class="aviso ojo" style="margin:12px 0 0" id="f-sin-nc">
        No hay rango de <b>notas de crédito</b>: si se devuelve algo de una factura, la devolución
        se registra pero sin nota de crédito fiscal.</div>` : ''}
    </div>

    <div class="ficha">
      <h3>Rangos autorizados (CAI)</h3>
      <p class="sub">Cada rango que le autoriza la SAR, con su CAI y su fecha límite. Cuando se
        acaba o vence, la caja pasa sola al siguiente rango vigente de la sucursal. Un rango ya usado
        no se puede editar ni borrar: así nunca se repite un número de factura.</p>
      ${rangos.length ? rangos.map(r => {
        const e = estadoRango(r);
        const total = r.final - r.inicial + 1;
        const pct = Math.min(100, Math.round(r.usadas / total * 100));
        const pre = n => escapar(r.prefijo) + '-' + String(n).padStart(8, '0');
        return `<div class="rango ${e.tono}">
          <div class="rango-cab">
            <div><b>${pre(r.inicial)} al ${pre(r.final)}</b>
              <small>${r.tipo === 'nota_credito' ? 'Notas de crédito' : 'Facturas'} · CAI ${escapar(r.cai || '—')}</small></div>
            <span class="sello ${e.clase}">${e.texto}</span>
          </div>
          <div class="barra-uso"><span style="width:${pct}%"></span></div>
          <div class="rango-datos">
            <span>${escapar(r.sucursal || '')}</span>
            <span>Usadas <b>${r.usadas}</b> de ${total}</span>
            <span>Quedan <b>${r.quedan}</b></span>
            ${r.quedan > 0 ? `<span>Siguiente <b>${pre(r.siguiente)}</b></span>` : ''}
            <span>Fecha límite <b>${fecha(r.fecha_limite)}</b>${r.dias !== null && r.dias >= 0
              ? ` (${r.dias} día${r.dias === 1 ? '' : 's'})` : ''}</span>
          </div>
          <div class="rango-acc">
            <button class="btn secundario" data-act-rango="${escapar(r.id)}" data-on="${r.activa ? 0 : 1}">
              ${r.activa ? 'Desactivar' : 'Activar'}</button>
            ${r.usadas === 0 ? `<button class="btn secundario" data-borrar-rango="${escapar(r.id)}"
              style="color:var(--rojo)">Borrar</button>` : ''}
          </div>
        </div>`;
      }).join('') : `<div class="vacio" style="padding:20px"><p>Todavía no hay rangos registrados.</p></div>`}
      <button class="mas" id="f-nuevo">+ Registrar rango autorizado</button>
    </div>`;

  $('#f-activa').onclick = cambiarFacturacion;
  $('#f-nuevo').onclick = hojaRango;
  $('#cuerpo').querySelectorAll('[data-act-rango]').forEach(b => b.onclick = async () => {
    const { error } = await sb.from('series_fiscales').update({ activa:b.dataset.on === '1' })
      .eq('id', b.dataset.actRango);
    if (error){ aviso('No se pudo cambiar', limpiarError(error)); return; }
    await recargarFacturacion();
  });
  $('#cuerpo').querySelectorAll('[data-borrar-rango]').forEach(b => b.onclick = async () => {
    if (!await confirmar('Borrar el rango', 'Este rango no se ha usado. Se borra para corregirlo.', 'Borrar')) return;
    const { error } = await sb.from('series_fiscales').delete().eq('id', b.dataset.borrarRango);
    if (error){ aviso('No se pudo borrar', limpiarError(error)); return; }
    await recargarFacturacion();
  });
}

async function recargarFacturacion(){
  const { data, error } = await sb.rpc('fn_estado_facturacion');
  S.facturacion = error ? { error:limpiarError(error), rangos:[] } : data;
  pintarFacturacion();
}

async function cambiarFacturacion(){
  const encender = !S.org.facturacion_fiscal_activa;
  const vigentes = (S.facturacion?.rangos || []).filter(r => r.vigente && r.tipo === 'factura');
  if (encender && !vigentes.length){
    aviso('Primero el rango', 'Registre al menos un rango autorizado (CAI) vigente antes de encender la facturación.', 'ojo');
    return;
  }
  if (!encender && !await confirmar('Apagar la facturación',
      'Desde ya todo sale como <b>comprobante interno</b>. Las facturas ya emitidas no cambian.', 'Apagar')) return;
  const { error } = await sb.from('organizaciones')
    .update({ facturacion_fiscal_activa:encender }).eq('id', S.org.id);
  if (error){ aviso('No se pudo cambiar', limpiarError(error)); return; }
  S.org.facturacion_fiscal_activa = encender;
  pintarFacturacion();
}

function hojaRango(){
  const sucs = S.sucursales.filter(s => s.activa);
  $('#hoja').innerHTML = `
    <h2>Rango autorizado</h2>
    <p class="sub">Cópielo tal como viene en la resolución de la SAR.</p>
    <div class="campos">
      <div class="campo-g ancho-total"><label for="r-tipo">Documento</label>
        <select class="entrada" id="r-tipo">
          <option value="factura">Factura</option>
          <option value="nota_credito">Nota de crédito (devoluciones de facturas)</option>
        </select></div>
      ${sucs.length > 1 ? `<div class="campo-g ancho-total"><label for="r-suc">Sucursal</label>
        <select class="entrada" id="r-suc">${sucs.map(s =>
          `<option value="${escapar(s.id)}">${escapar(s.nombre)}</option>`).join('')}</select></div>` : ''}
      <div class="campo-g ancho-total"><label for="r-cai">CAI *</label>
        <input class="entrada num" id="r-cai" placeholder="XXXXXX-XXXXXX-XXXXXX-XXXXXX-XXXXXX-XX"
               autocomplete="off" style="text-transform:uppercase"></div>
      <div class="campo-g ancho-total"><label for="r-pre">Prefijo *</label>
        <input class="entrada num" id="r-pre" placeholder="000-001-01" autocomplete="off">
        <div class="ayuda" style="margin-top:4px">Establecimiento-punto de emisión-tipo de documento,
          como viene en la resolución.</div></div>
      <div class="campo-g"><label for="r-ini">Desde *</label>
        <input class="entrada num" id="r-ini" inputmode="numeric" placeholder="1"></div>
      <div class="campo-g"><label for="r-fin">Hasta *</label>
        <input class="entrada num" id="r-fin" inputmode="numeric" placeholder="500"></div>
      <div class="campo-g ancho-total"><label for="r-lim">Fecha límite de emisión *</label>
        <input class="entrada" id="r-lim" type="date" min="${hoyIso()}"></div>
    </div>
    <div class="aviso malo oculto" id="r-err" style="margin-top:12px"></div>
    <div class="acciones" style="margin-top:14px">
      <button class="btn secundario" id="r-no">Cancelar</button>
      <button class="btn principal-b" id="r-si">Registrar</button>
    </div>`;
  ver('#velo');
  // Formato al vuelo: el CAI en grupos de 6, el prefijo 000-000-00
  $('#r-cai').addEventListener('input', e => {
    const limpio = e.target.value.toUpperCase().replace(/[^0-9A-F]/g, '').slice(0, 32);
    e.target.value = (limpio.match(/.{1,6}/g) || []).join('-');
  });
  $('#r-pre').addEventListener('input', e => {
    const d = e.target.value.replace(/\D/g, '').slice(0, 8);
    e.target.value = [d.slice(0,3), d.slice(3,6), d.slice(6,8)].filter(Boolean).join('-');
  });
  $('#r-no').onclick = cerrarHoja;
  $('#r-si').onclick = guardarRango;
}

async function guardarRango(){
  const err = $('#r-err');
  const mal = t => { err.textContent = t; err.classList.remove('oculto'); };
  const cai = $('#r-cai').value.trim().toUpperCase();
  const prefijo = $('#r-pre').value.trim();
  const ini = Math.round(num($('#r-ini').value));
  const fin = Math.round(num($('#r-fin').value));
  const lim = $('#r-lim').value;
  if (!/^[0-9A-F]{6}(-[0-9A-F]{6}){4}-[0-9A-F]{2}$/.test(cai)) return mal('El CAI tiene 32 caracteres: 6-6-6-6-6-2, con números y letras de la A a la F.');
  if (!/^\d{3}-\d{3}-\d{2}$/.test(prefijo)) return mal('El prefijo es 000-001-01.');
  if (!(ini >= 1) || !(fin >= ini)) return mal('Revise el rango: «Hasta» debe ser mayor o igual a «Desde».');
  if (!lim) return mal('Ponga la fecha límite de emisión.');
  if (lim < hoyIso()) return mal('Esa fecha límite ya pasó.');

  const b = $('#r-si');
  b.disabled = true; b.innerHTML = '<span class="girando"></span>';
  const { error } = await sb.from('series_fiscales').insert({
    organizacion_id:S.org.id,
    sucursal_id: $('#r-suc')?.value || S.sucursales.find(s => s.activa)?.id,
    tipo_documento: $('#r-tipo')?.value === 'nota_credito' ? 'nota_credito' : 'factura', cai, prefijo,
    correlativo_inicial:ini, correlativo_final:fin, correlativo_actual:ini,
    fecha_limite_emision:lim, activa:true });
  b.disabled = false; b.textContent = 'Registrar';
  if (error) return mal(limpiarError(error));
  cerrarHoja();
  await recargarFacturacion();
}

/* ================= aparatos de caja =================

   Un aparato pareado es la tablet del mostrador. Guarda una llave larga que
   el servidor verifica antes de dejar que alguien intente un PIN. Sin eso,
   la puerta de /caja seria un PIN de cinco digitos de cara a internet.

   La llave se enseña UNA sola vez. No se puede volver a ver porque en la
   base solo queda su hash, igual que una contraseña. Si se pierde, se
   revoca el aparato y se parea otra vez: no cuesta nada.
   ================================================================== */
const LLAVERO = 'pulpeando.aparato';

function aparatoDeEsteEquipo(){
  try { return JSON.parse(localStorage.getItem(LLAVERO) || 'null'); }
  catch { return null; }
}

async function pintarAparatos(){
  $('#cuerpo').innerHTML = `<div class="ficha"><p class="sub">Cargando…</p></div>`;
  const { data, error } = await sb.rpc('fn_aparatos_caja');
  if (error){
    $('#cuerpo').innerHTML = `<div class="ficha">
      <h3>Aparatos de caja</h3>
      <div class="aviso malo">${escapar(limpiarError(error))}</div></div>`;
    return;
  }
  S.aparatos = data || [];
  const mio = aparatoDeEsteEquipo();

  $('#cuerpo').innerHTML = `
    <div class="ficha">
      <h3>Este equipo</h3>
      <p class="sub">La caja abre en <b>/caja</b> y ahí solo se pide el código y el PIN de la
        cajera. Para que ese PIN tan corto alcance, el aparato tiene que estar pareado: guarda
        una llave larga que nadie teclea y que usted puede revocar si se pierde la tablet.</p>
      ${mio && mio.id
        ? `<div class="fila">
             <div class="fila-txt"><b>Pareado · ${escapar(mio.caja || 'sin caja')}</b>
               <small>${escapar(mio.negocio || '')} · esta tablet ya puede abrir caja</small></div>
             <button class="btn secundario" id="a-olvidar">Olvidar</button>
           </div>
           <button class="mas" id="a-nuevo" style="margin-top:14px">+ Parear otro aparato</button>`
        : `<div class="aviso ojo">Este equipo todavía no está pareado. Mientras no lo esté,
             <b>/caja</b> no deja vender desde aquí.</div>
           <button class="mas" id="a-este" style="margin-top:14px">+ Parear este equipo</button>
           <button class="mas" id="a-nuevo">+ Parear otro aparato</button>`}
    </div>

    <div class="ficha">
      <h3>Aparatos del negocio</h3>
      <p class="sub">Si una tablet se pierde o se cambia, revóquela: deja de poder abrir caja
        al instante, sin tocar los PIN de nadie.</p>
      ${S.aparatos.length ? S.aparatos.map(a => {
        /* Se arma como lista y se une: concatenar a mano dejaba separadores
           colgando cuando una parte salia vacia ("nunca se ha usado ·"). */
        const partes = [escapar(a.sucursal)];
        if (a.caja) partes.push(escapar(a.caja));
        partes.push(a.ultimo_uso ? 'último uso ' + fecha(a.ultimo_uso) : 'nunca se ha usado');
        if (!a.activo) partes.push('revocado');
        if (a.activo && a.bloqueado_hasta && new Date(a.bloqueado_hasta) > new Date())
          partes.push('<b style="color:var(--rojo)">enfriando por intentos fallidos</b>');
        return `<div class="fila ${a.activo ? '' : 'inactivo'}">
          <div class="fila-txt"><b>${escapar(a.nombre)}</b>
            <small>${partes.join(' · ')}</small></div>
          ${a.activo ? `<button class="btn secundario" data-rev="${escapar(a.aparato_id)}">Revocar</button>` : ''}
        </div>`; }).join('')
        : '<div class="aviso ojo">Todavía no hay ningún aparato pareado.</div>'}
    </div>`;

  $('#a-este')?.addEventListener('click', () => hojaParear(true));
  $('#a-nuevo')?.addEventListener('click', () => hojaParear(false));
  $('#a-olvidar')?.addEventListener('click', async () => {
    if (!await confirmar('Olvidar el pareo',
      'Esta tablet dejará de poder abrir caja. El aparato sigue existiendo en la lista: ' +
      'si quiere matarlo de verdad, <b>revóquelo</b> abajo.', 'Olvidar')) return;
    try { localStorage.removeItem(LLAVERO); } catch {}
    pintarAparatos();
  });
  $('#cuerpo').querySelectorAll('[data-rev]').forEach(b => b.onclick = async () => {
    const a = S.aparatos.find(x => x.aparato_id === b.dataset.rev);
    if (!await confirmar('Revocar el aparato',
      `<b>${escapar(a.nombre)}</b> dejará de poder abrir caja ahora mismo. ` +
      'Si vuelve a usarlo, tendrá que parearlo otra vez.', 'Revocar')) return;
    const { error } = await sb.rpc('fn_revocar_aparato', { p_aparato_id:a.aparato_id });
    if (error) return aviso('No se pudo revocar', limpiarError(error));
    /* Si el revocado era este mismo equipo, la llave guardada ya no sirve:
       dejarla solo haria que la cajera marcara su PIN para nada. */
    const mio2 = aparatoDeEsteEquipo();
    if (mio2 && mio2.id === a.aparato_id){ try { localStorage.removeItem(LLAVERO); } catch {} }
    pintarAparatos();
  });
}

function hojaParear(esteEquipo){
  const activas = S.sucursales.filter(s => s.activa);
  $('#hoja').innerHTML = `
    <h2>${esteEquipo ? 'Parear este equipo' : 'Parear otro aparato'}</h2>
    <p class="sub">${esteEquipo
      ? 'La llave queda guardada en esta tablet y la caja abre sola.'
      : 'Se le va a enseñar una llave UNA sola vez. Cópiela y péguela en el otro aparato.'}</p>
    <div class="campos">
      <div class="campo-g ancho-total"><label for="ap-suc">Sucursal</label>
        <select class="entrada" id="ap-suc">
          ${activas.map(s => `<option value="${escapar(s.id)}">${escapar(s.nombre)}</option>`).join('')}
        </select></div>
      <div class="campo-g ancho-total"><label for="ap-caja">Caja</label>
        <select class="entrada" id="ap-caja"></select></div>
      <div class="campo-g ancho-total"><label for="ap-nombre">Nombre del aparato</label>
        <input class="entrada" id="ap-nombre" maxlength="60" placeholder="Tablet de la caja 1">
        <div class="ayuda" style="margin-top:6px">Para reconocerlo en la lista el día que haya
          que revocarlo.</div></div>
    </div>
    <div class="aviso malo oculto" id="ap-error"></div>
    <div class="acciones"><button class="btn secundario" id="ap-no">Volver</button>
      <button class="btn principal-b" id="ap-si">Parear</button></div>`;
  ver('#velo');

  const pintarCajas = () => {
    const suc = $('#ap-suc').value;
    const cajas = S.cajas.filter(c => c.sucursal_id === suc && c.activa);
    /* La caja es obligatoria: es lo que hace que la tablet sepa sola en qué
       caja está, y que nadie tenga que elegirla al entrar. */
    $('#ap-caja').innerHTML = cajas.length
      ? cajas.map(c => `<option value="${escapar(c.id)}">${escapar(c.nombre)}</option>`).join('')
      : '<option value="">Esta sucursal no tiene cajas</option>';
  };
  pintarCajas();
  $('#ap-suc').onchange = pintarCajas;
  $('#ap-no').onclick = cerrarHoja;

  $('#ap-si').onclick = async () => {
    const b = $('#ap-si');
    if (!activas.length){ return mostrarError('Primero cree una sucursal'); }
    if (!$('#ap-caja').value){ return mostrarError('Elija la caja de este aparato. Si no hay, créela en Sucursales y cajas.'); }
    b.disabled = true; b.textContent = 'Pareando…';
    const { data, error } = await sb.rpc('fn_parear_aparato', {
      p_sucursal_id:$('#ap-suc').value,
      p_caja_id:$('#ap-caja').value || null,
      p_nombre:$('#ap-nombre').value.trim() || null });
    b.disabled = false; b.textContent = 'Parear';
    if (error) return mostrarError(limpiarError(error));

    const suc  = activas.find(s => s.id === $('#ap-suc').value);
    const caja = S.cajas.find(c => c.id === $('#ap-caja').value);
    const guardado = { id:data.aparato_id, llave:data.llave, caja_id:caja?.id || null,
                       negocio:S.org?.nombre || S.ctx.organizacion.nombre,
                       sucursal:suc?.nombre || '', caja:caja?.nombre || '' };

    if (esteEquipo){
      try { localStorage.setItem(LLAVERO, JSON.stringify(guardado)); }
      catch { return mostrarError('Este navegador no deja guardar la llave. Pruebe fuera del modo privado.'); }
    }
    hojaLlave(data, esteEquipo);
    await cargarTodo();
    pintarAparatos();
  };

  function mostrarError(m){
    const e = $('#ap-error'); e.textContent = m; e.classList.remove('oculto');
  }
}

function hojaLlave(data, esteEquipo){
  $('#hoja').innerHTML = `
    <h2>Aparato pareado</h2>
    <div class="aviso bueno" style="margin-top:12px">
      <b>${escapar(data.nombre)}</b> ya puede abrir caja.</div>
    ${esteEquipo ? `<p class="sub" style="margin-top:12px">La llave quedó guardada en esta
      tablet. Abra <b>/caja</b> y pida a la cajera su código y su PIN.</p>` : `
      <p class="sub" style="margin-top:12px">Copie esta llave y péguela en el otro aparato.
        <b>No se vuelve a mostrar:</b> en la base solo queda su huella. Si la pierde, revoque
        el aparato y paréelo otra vez.</p>
      <textarea class="entrada num" id="ap-llave" rows="3" readonly
        style="width:100%;word-break:break-all">${escapar(JSON.stringify({
          id:data.aparato_id, llave:data.llave }))}</textarea>
      <button class="btn secundario" id="ap-copiar" style="width:100%;margin-top:8px">Copiar</button>`}

  ver('#velo');
  $('#ap-listo').onclick = cerrarHoja;
  $('#ap-copiar')?.addEventListener('click', async () => {
    const t = $('#ap-llave');
    t.select();
    try { await navigator.clipboard.writeText(t.value); $('#ap-copiar').textContent = 'Copiada'; }
    catch { $('#ap-copiar').textContent = 'Cópiela a mano'; }
  });
}

/* ================= impuestos ================= */
function pintarImpuestos(){
  $('#cuerpo').innerHTML = `
    <div class="ficha">
      <h3>Impuestos</h3>
      <p class="sub">El <b>predeterminado</b> es el que lleva un producto nuevo. En Honduras lo común
        es ISV 15%, ISV 18% (bebidas alcohólicas y tabaco) y Exento (canasta básica).</p>
      ${S.impuestos.map(i => `<div class="fila ${i.activo ? '' : 'inactivo'}">
        <div class="fila-txt"><b>${escapar(i.nombre)} <span class="num" style="color:var(--tenue)">${(Number(i.tasa) * 100).toFixed(0)}%</span>
          ${i.es_predeterminado ? '<span class="sello ok" style="margin-left:6px">Predeterminado</span>' : ''}</b>
          <small>${i.incluido_en_precio ? 'Incluido en el precio' : 'Se suma al precio'}${i.activo ? '' : ' · inactivo'}</small></div>
        ${!i.es_predeterminado && i.activo ? `<button class="btn secundario" data-pred="${escapar(i.id)}">Hacer predeterminado</button>` : ''}
        <button class="btn secundario" data-imp="${escapar(i.id)}">${i.activo ? 'Desactivar' : 'Activar'}</button>
      </div>`).join('')}
      <button class="mas" id="i-nuevo">+ Impuesto</button>
    </div>`;
  $('#i-nuevo').onclick = hojaImpuesto;
  $('#cuerpo').querySelectorAll('[data-pred]').forEach(b => b.onclick = async () => {
    // Uno solo predeterminado: primero se apagan todos
    let { error } = await sb.from('impuestos').update({ es_predeterminado:false }).eq('organizacion_id', S.org.id);
    if (!error) ({ error } = await sb.from('impuestos').update({ es_predeterminado:true }).eq('id', b.dataset.pred));
    if (error){ aviso('No se pudo cambiar', limpiarError(error)); return; }
    await cargarTodo(); pintarImpuestos();
  });
  $('#cuerpo').querySelectorAll('[data-imp]').forEach(b => b.onclick = async () => {
    const i = S.impuestos.find(x => x.id === b.dataset.imp);
    if (i.es_predeterminado && i.activo){ aviso('Es el predeterminado', 'Elija otro como predeterminado antes de desactivar este.', 'ojo'); return; }
    const { error } = await sb.from('impuestos').update({ activo:!i.activo }).eq('id', i.id);
    if (error){ aviso('No se pudo cambiar', limpiarError(error)); return; }
    await cargarTodo(); pintarImpuestos();
  });
}

function hojaImpuesto(){
  $('#hoja').innerHTML = `
    <h2>Impuesto nuevo</h2>
    <div class="campos">
      <div class="campo-g"><label for="i-nom">Nombre *</label>
        <input class="entrada" id="i-nom" placeholder="ISV 18%"></div>
      <div class="campo-g"><label for="i-tasa">Tasa % *</label>
        <input class="entrada num" id="i-tasa" inputmode="decimal" placeholder="18"></div>
      <label class="ancho-total" style="display:flex;gap:9px;align-items:center;font-size:14px;font-weight:600">
        <input type="checkbox" id="i-inc" checked style="width:20px;height:20px;accent-color:var(--marca)">
        Ya viene incluido en el precio de venta</label>
    </div>
    <div class="aviso malo oculto" id="i-err" style="margin-top:12px"></div>
    <div class="acciones" style="margin-top:14px">
      <button class="btn secundario" id="i-no">Cancelar</button>
      <button class="btn principal-b" id="i-si">Guardar</button>
    </div>`;
  ver('#velo');
  $('#i-no').onclick = cerrarHoja;
  $('#i-si').onclick = async () => {
    const err = $('#i-err');
    const nombre = $('#i-nom').value.trim();
    const tasa = num($('#i-tasa').value);
    if (!nombre || tasa < 0 || tasa > 100){ err.textContent = 'Escriba el nombre y una tasa entre 0 y 100.'; err.classList.remove('oculto'); return; }
    const { error } = await sb.from('impuestos').insert({ organizacion_id:S.org.id, nombre,
      tasa:Math.round(tasa * 100) / 10000, incluido_en_precio:$('#i-inc').checked, activo:true });
    if (error){ err.textContent = limpiarError(error); err.classList.remove('oculto'); return; }
    cerrarHoja();
    await cargarTodo(); pintarImpuestos();
  };
}

/* ================= al aire ================= */
arrancar();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
