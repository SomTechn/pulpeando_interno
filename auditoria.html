<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F1729">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" href="icono-192.png" type="image/png">
<link rel="apple-touch-icon" href="icono-192.png">
<title>Auditoría · Pulpeando</title>
<script src="config.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="ui.css">
<style>
.zona{flex:1;display:flex;flex-direction:column;min-height:0;padding:14px 16px 0}
.cuerpo{flex:1;overflow-y:auto;min-height:0;padding-bottom:24px}
.cuerpo.con-pie{padding-bottom:96px}

.titulin{font-size:11.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;
  color:#9AA8BC;margin-bottom:10px}
.ficha{background:var(--panel);border:1px solid var(--linea);border-radius:var(--r-md);
  padding:16px 18px;margin-bottom:12px}

/* el boton grande de escanear: es la accion de toda la pantalla */
.escanear-g{display:flex;align-items:center;justify-content:center;gap:11px;
  width:100%;height:60px;border-radius:var(--r-md);background:var(--azul);color:#fff;
  font-size:16px;font-weight:800;box-shadow:0 8px 20px -8px rgba(37,99,235,.7);
  margin-bottom:12px;flex:0 0 auto}
.escanear-g:active{transform:scale(.99)}
.escanear-g.verde{background:var(--verde);box-shadow:0 8px 20px -8px rgba(18,161,80,.7)}

/* una ubicacion de la lista */
.ubi{display:flex;align-items:center;gap:13px;width:100%;text-align:left;
  background:var(--panel);border:1px solid var(--linea);border-radius:var(--r-md);
  padding:13px 15px;margin-bottom:9px}
.ubi:active{transform:scale(.995)}
.ubi-cod{flex:0 0 auto;min-width:62px;padding:6px 9px;border-radius:var(--r-sm);
  background:var(--fondo);font-family:var(--num);font-size:12px;font-weight:700;
  text-align:center}
.ubi-txt{flex:1;min-width:0}
.ubi-txt b{display:block;font-size:14.5px;font-weight:700;line-height:1.3;
  overflow-wrap:anywhere}
.ubi-txt small{display:block;font-size:12px;color:var(--tenue);margin-top:3px;
  line-height:1.4}
.ubi-sem{flex:0 0 auto;width:10px;height:10px;border-radius:50%;background:var(--linea)}
.ubi-sem.ok{background:var(--verde)}
.ubi-sem.viejo{background:var(--ambar)}
.ubi.abierta{background:#FFF9EC;border-color:#F3E2BC}
.ubi.abierta .ubi-cod{background:#F8EAC9}

/* una linea de la auditoria */
.ln{display:flex;align-items:center;gap:12px;background:var(--panel);
  border:1px solid var(--linea);border-radius:var(--r-md);padding:12px 14px;
  margin-bottom:8px}
.ln.pendiente{background:#FBFCFE;border-style:dashed}
.ln-txt{flex:1;min-width:0}
.ln-txt b{display:block;font-size:14px;font-weight:700;line-height:1.3;
  overflow-wrap:anywhere}
.ln-txt small{display:block;font-size:11.5px;color:var(--tenue);margin-top:3px;
  line-height:1.4}
.ln-n{flex:0 0 auto;text-align:right}
.ln-n b{display:block;font-family:var(--num);font-size:18px;font-weight:700;
  line-height:1}
.ln-n small{display:block;font-size:10.5px;color:var(--tenue);margin-top:3px}
.ln.pendiente .ln-n b{color:var(--claro)}

/* el pie fijo */
.pie{position:absolute;left:0;right:0;bottom:0;display:flex;gap:10px;
  padding:12px 16px calc(12px + env(safe-area-inset-bottom));
  background:var(--panel);border-top:1px solid var(--linea)}
.pie .btn{flex:1}
.principal{position:relative}

/* la hoja de cantidad */
.cant-g{display:flex;gap:10px;align-items:stretch;margin-top:4px}
.cant-g input{flex:1;min-width:0;height:62px;border:1.5px solid var(--linea);
  border-radius:var(--r-md);padding:0 16px;outline:none;text-align:right;
  font-family:var(--num);font-size:28px;font-weight:700;background:var(--panel)}
.cant-g input:focus{border-color:var(--azul)}
.caja{flex:0 0 auto;padding:0 16px;border-radius:var(--r-md);
  background:var(--azul-suave);color:var(--azul);font-size:13.5px;font-weight:800;
  line-height:1.25;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:2px}
.caja small{font-family:var(--num);font-size:12px;font-weight:700}
.llevaba{margin-top:10px;padding:11px 13px;border-radius:var(--r-sm);
  background:#FFF4E0;color:#8A5A00;font-size:13px;line-height:1.45}
.llevaba b{font-family:var(--num);font-weight:700}

.entrada{height:50px;border:1.5px solid var(--linea);border-radius:var(--r-md);
  padding:0 14px;outline:none;font-size:15px;background:var(--panel);width:100%}
.entrada:focus{border-color:var(--azul)}
.aviso{border-radius:var(--r-sm);padding:11px 13px;font-size:13px;line-height:1.45;
  margin-bottom:12px}
.aviso.malo{background:#FFEDF1;color:#9F1239}
.aviso.bien{background:#E7F7EE;color:var(--verde-oscuro)}
.aviso.ojo{background:#FFF4E0;color:#8A5A00}
.acciones{display:flex;gap:10px;margin-top:18px}
.acciones .btn{flex:1}
.vacio{text-align:center;padding:40px 20px;color:var(--tenue)}
.vacio b{display:block;font-size:16px;color:var(--tinta);margin-bottom:6px}
.vacio p{font-size:13.5px;line-height:1.5;max-width:360px;margin:0 auto}

.opcion{display:flex;gap:11px;align-items:flex-start;padding:12px 13px;
  border:1.5px solid var(--linea);border-radius:var(--r-md);margin-bottom:9px;
  width:100%;text-align:left}
.opcion.activa{border-color:var(--azul);background:var(--azul-suave)}
.opcion i{flex:0 0 auto;width:18px;height:18px;border-radius:50%;margin-top:2px;
  border:2px solid var(--linea);background:var(--panel)}
.opcion.activa i{border-color:var(--azul);box-shadow:inset 0 0 0 4px var(--azul)}
.opcion b{display:block;font-size:13.5px;font-weight:700}
.opcion small{display:block;font-size:12px;color:var(--tenue);margin-top:3px;
  line-height:1.45}

/* etiquetas para imprimir */
.etiquetas{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:12px}
.etq{border:1.5px dashed var(--linea);border-radius:var(--r-md);padding:14px;
  text-align:center;background:var(--panel);break-inside:avoid}
.etq canvas,.etq .sinqr{width:124px;height:124px;margin:0 auto 9px;display:block}
.etq .sinqr{display:grid;place-items:center;background:var(--fondo);
  border-radius:var(--r-sm);font-family:var(--num);font-size:13px;color:var(--tenue);
  padding:8px;line-height:1.3}
.etq b{display:block;font-family:var(--num);font-size:16px;font-weight:700;
  letter-spacing:.02em}
.etq small{display:block;font-size:12px;color:var(--tenue);margin-top:3px;
  line-height:1.3;overflow-wrap:anywhere}

@media (max-width:820px){
  .zona{padding:12px 14px 0}
  .ficha{padding:14px 15px}
  .cant-g input{font-size:24px;height:58px}
}
@media print{
  body *{visibility:hidden}
  #cuerpo, #cuerpo *{visibility:visible}
  #cuerpo{position:absolute;inset:0;padding:0;overflow:visible}
  .etiquetas{grid-template-columns:repeat(3,1fr)}
  .no-imprimir{display:none!important}
}
</style>
</head>
<body>

<div class="oscura oculto" id="p-config">
  <div class="tarjeta-oscura">
    <div class="marca"><span>◧</span> Configuración</div>
    <div class="titulo-o">Falta conectar el proyecto</div>
    <p class="sub-o">Ponga la URL y la llave publishable en <b>config.js</b>.</p>
  </div>
</div>

<div class="oscura oculto" id="p-sesion">
  <div class="tarjeta-oscura">
    <div class="marca"><span>◧</span> Auditoría</div>
    <div class="titulo-o">Iniciar sesión</div>
    <p class="sub-o">Use el correo con el que su gerente lo dio de alta</p>
    <input class="campo-o" id="s-email" type="email" placeholder="correo@negocio.hn" autocomplete="username">
    <input class="campo-o" id="s-clave" type="password" placeholder="Contraseña" autocomplete="current-password">
    <div class="error-o" id="s-error"></div>
    <button class="btn-o" id="s-entrar">Entrar</button>
  </div>
</div>

<div class="oscura oculto" id="p-bloqueado">
  <div class="tarjeta-oscura">
    <div class="marca"><span>◧</span> Auditoría</div>
    <div class="titulo-o" id="bl-titulo">Sin permiso</div>
    <p class="sub-o" id="bl-texto"></p>
    <a class="btn-o" href="index.html" style="display:block;line-height:52px">Ir a la caja</a>
    <button class="btn-o fantasma" id="bl-salir">Cerrar sesión</button>
  </div>
</div>

<div class="armazon oculto" id="app">
  <aside id="menu"></aside>

  <div class="principal">
    <header class="barra">
      <button class="hamburguesa" id="abrir-menu" aria-label="Menú">
        <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <div class="barra-titulo">
        <b id="h-titulo">Auditoría</b>
        <small id="h-sucursal">—</small>
      </div>
      <div class="barra-fin">
        <span class="pill" id="h-usuario">—</span>
      </div>
    </header>

    <div class="zona">
      <div id="arriba"></div>
      <div class="cuerpo" id="cuerpo"></div>
    </div>
    <div id="pie"></div>
  </div>
</div>

<div class="velo oculto" id="velo"><div class="hoja" id="hoja"></div></div>

<script type="module">
const CFG = window.SUPABASE_CONFIG || {};
const SUPABASE_URL = CFG.url || 'PEGUE_AQUI_LA_URL';
const SUPABASE_KEY = CFG.key || 'PEGUE_AQUI_LA_LLAVE';

const $ = s => document.querySelector(s);
const ver = (id, si = true) => $(id).classList.toggle('oculto', !si);

if (SUPABASE_URL.startsWith('PEGUE')){ ver('#p-config'); throw new Error('sin configurar'); }

import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
import { montarMenu, escapar } from './menu.js';
import { escanear, hayCamara } from './escaner.js';

const sb = createClient(SUPABASE_URL, SUPABASE_KEY, {
  auth:{ persistSession:true, autoRefreshToken:true }
});

const S = {
  ctx:null, sucursal:null, moneda:'L', menu:null, nivel:0, camara:false,
  vista:'lugares',          // lugares · auditando · etiquetas
  lugares:[], auditoria:null, resumen:null, lineas:[], cargando:false
};

const cant = n => (Number(n)||0).toLocaleString('es-HN', { maximumFractionDigits:3 });

const MESES = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
function cuando(v){
  if (!v) return 'nunca';
  const d = new Date(v);
  const horas = (Date.now() - d.getTime()) / 3600000;
  const hora = d.toLocaleTimeString('es-HN', { hour:'numeric', minute:'2-digit' });
  if (horas < 1)  return 'hace un rato';
  if (horas < 24) return 'hoy ' + hora;
  if (horas < 48) return 'ayer ' + hora;
  const dias = Math.floor(horas / 24);
  if (dias < 8) return 'hace ' + dias + ' días';
  return `${d.getDate()} ${MESES[d.getMonth()]} ${d.getFullYear()}`;
}
const alDia = v => v && (Date.now() - new Date(v).getTime()) < 24*3600000;

function limpiarError(e){
  // Antes se cortaba hasta el primer ":", lo que se comia la mitad de los
  // mensajes propios: "Falta: Bodega de arriba" quedaba en "Bodega de
  // arriba". Ahora solo se quita el prefijo tecnico de Postgres.
  const m = (e?.message || String(e))
    .replace(/^(?:[0-9A-Z]{5}|error|Error|ERROR):\s*/, '');
  if (/JWT|token/i.test(m)) return 'La sesión venció. Vuelva a entrar.';
  if (/Failed to fetch|NetworkError/i.test(m)) return 'Sin conexión con el servidor';
  return m;
}

function aviso(titulo, texto){
  $('#hoja').innerHTML = `<h2>${escapar(titulo)}</h2>
    <p class="sub">${escapar(texto)}</p>
    <button class="btn principal-b" style="width:100%" id="ok">Entendido</button>`;
  ver('#velo');
  $('#ok').onclick = () => ver('#velo', false);
}
const cerrarHoja = () => ver('#velo', false);
$('#velo').addEventListener('click', e => { if (e.target === $('#velo')) cerrarHoja(); });

/* ================= sesión ================= */
$('#s-entrar').addEventListener('click', async () => {
  const b = $('#s-entrar');
  $('#s-error').textContent = '';
  b.disabled = true; b.innerHTML = '<span class="girando"></span>';
  const { error } = await sb.auth.signInWithPassword({
    email:$('#s-email').value.trim(), password:$('#s-clave').value });
  b.disabled = false; b.textContent = 'Entrar';
  if (error){ $('#s-error').textContent = 'Correo o contraseña incorrectos'; return; }
  arrancar();
});
$('#s-clave').addEventListener('keydown', e => { if (e.key === 'Enter') $('#s-entrar').click(); });
$('#bl-salir').addEventListener('click', async () => { await sb.auth.signOut(); location.reload(); });

/* ================= arranque ================= */
async function arrancar(){
  const { data:{ session } } = await sb.auth.getSession();
  if (!session){ ver('#p-sesion'); return; }
  ver('#p-sesion', false);

  const { data, error } = await sb.rpc('fn_pos_contexto');
  if (error){
    ver('#p-sesion');
    $('#s-error').textContent = 'Su usuario no tiene perfil en ningún negocio';
    await sb.auth.signOut();
    return;
  }
  S.ctx = data;
  S.nivel = data.usuario.nivel;
  S.moneda = data.organizacion.moneda === 'HNL' ? 'L' : data.organizacion.moneda;

  if (S.nivel < 1){
    ver('#p-bloqueado');
    $('#bl-titulo').textContent = 'Esta pantalla no es para su rol';
    $('#bl-texto').textContent = 'La auditoría de bodega la hace el personal de la tienda.';
    return;
  }

  S.sucursal = data.sucursales[0]?.id || null;
  $('#h-usuario').textContent = data.usuario.nombre;
  $('#h-sucursal').textContent = data.sucursales[0]?.nombre || '';
  $('#app').classList.remove('oculto');

  S.menu = montarMenu({
    contenedor:'#menu', modulo:'auditoria', ctx:S.ctx,
    alSalir: async () => { await sb.auth.signOut(); location.reload(); }
  });
  $('#abrir-menu').addEventListener('click', () => S.menu.alternar());

  S.camara = await hayCamara();
  cargarLugares();
}

/* ================= las ubicaciones ================= */
async function cargarLugares(){
  S.vista = 'lugares'; S.auditoria = null; S.cargando = true; pintar();
  const [ubis, auds] = await Promise.all([
    sb.rpc('fn_ubicaciones_detalle', { p_sucursal_id:S.sucursal }),
    sb.rpc('fn_auditorias', { p_sucursal_id:S.sucursal, p_limite:40 })
  ]);
  S.cargando = false;
  if (ubis.error){ aviso('No se pudieron leer las ubicaciones', limpiarError(ubis.error)); return; }
  const abiertas = (auds.error ? [] : (auds.data || []))
    .filter(a => a.estado === 'abierta');
  S.lugares = (ubis.data || []).filter(u => u.activa).map(u => ({
    ...u, abierta: abiertas.find(a => a.ubicacion === u.nombre) || null }));
  pintar();
}

/* ================= auditar ================= */
async function abrirAuditoria(ubicacionId){
  S.cargando = true; S.vista = 'auditando'; pintar();
  const { data, error } = await sb.rpc('fn_abrir_auditoria', { p_ubicacion_id:ubicacionId });
  if (error){
    S.cargando = false;
    aviso('No se pudo abrir la auditoría', limpiarError(error));
    cargarLugares();
    return;
  }
  S.auditoria = data.auditoria_id;
  await recargarAuditoria();
}

async function recargarAuditoria(){
  S.cargando = true; pintar();
  const [res, lin] = await Promise.all([
    sb.rpc('fn_auditoria_resumen', { p_auditoria_id:S.auditoria }),
    sb.rpc('fn_auditoria_lineas',  { p_auditoria_id:S.auditoria })
  ]);
  S.cargando = false;
  if (res.error){ aviso('No se pudo leer la auditoría', limpiarError(res.error)); cargarLugares(); return; }
  S.resumen = res.data;
  S.lineas = lin.error ? [] : (lin.data || []);
  pintar();
}

/* Escanear el QR del estante. Tambien se puede digitar el codigo. */
async function escanearUbicacion(){
  const codigo = await escanear({
    titulo:'Escanear la ubicación',
    pista:'Acerque el QR pegado en el estante' });
  if (!codigo) return;
  const { data, error } = await sb.rpc('fn_ubicacion_por_codigo', { p_codigo:codigo });
  if (error){ aviso('No se reconoció la ubicación', limpiarError(error)); return; }
  if (data.predeterminada){
    aviso('Esa ubicación no se audita',
      `${data.nombre} es donde cae todo lo que no está asignado a un lugar: ` +
      'su cantidad es el resto. Audite las bodegas y cuente el piso desde Consultar.');
    return;
  }
  abrirAuditoria(data.ubicacion_id);
}

/* Escanear un producto. Cada escaneo SUMA a lo que ya se llevaba. */
async function escanearProducto(){
  const codigo = await escanear({
    titulo:'Escanear el producto',
    pista:'Acerque el código de barras de la caja' });
  if (!codigo) return;

  const { data, error } = await sb.rpc('fn_buscar_para_consulta',
    { p_busqueda:codigo, p_sucursal_id:S.sucursal, p_limite:8 });
  if (error){ aviso('No se pudo buscar', limpiarError(error)); return; }
  const lista = data || [];
  if (!lista.length){
    aviso('Ese código no está en el catálogo',
      `No hay ningún producto con «${codigo}». Agréguelo en Catálogos antes de auditarlo.`);
    return;
  }
  if (lista.length === 1 || lista[0].exacto){ hojaCantidad(lista[0]); return; }

  // Varios candidatos: que elija
  $('#hoja').innerHTML = `
    <h2>¿Cuál de estos?</h2>
    <p class="sub">El código «${escapar(codigo)}» coincide con varios.</p>
    ${lista.map(p => `<button class="opcion" data-prod="${p.producto_id}">
      <i style="visibility:hidden"></i>
      <span><b>${escapar(p.nombre)}</b><small>${escapar(p.sku)} · ${escapar(p.categoria)}</small></span>
    </button>`).join('')}
    <div class="acciones"><button class="btn secundario" id="el-no" style="flex:1">Cancelar</button></div>`;
  ver('#velo');
  $('#el-no').onclick = cerrarHoja;
  $('#hoja').querySelectorAll('[data-prod]').forEach(b => {
    b.onclick = () => hojaCantidad(lista.find(p => p.producto_id === b.dataset.prod));
  });
}

/* La hoja de la cantidad. Lo que pidio el proceso: arriba el producto, el
   campo con la caja completa propuesta, y abajo cuanto llevaba. */
function hojaCantidad(prod, lote = null){
  const linea = S.lineas.find(l => l.producto_id === prod.producto_id &&
                                   (l.lote_id || null) === (lote || null) && l.escaneado);
  const llevaba = linea ? Number(linea.contado) : 0;
  const empaque = linea ? Number(linea.empaque || 0) : 0;

  $('#hoja').innerHTML = `
    <h2>${escapar(prod.nombre)}</h2>
    <p class="sub">${escapar(prod.sku || '')}${prod.codigo ? ' · ' + escapar(prod.codigo) : ''}</p>
    <div class="campo-g">
      <label for="ct-cant">¿Cuántas unidades hay en esta caja?</label>
      <div class="cant-g">
        <input id="ct-cant" inputmode="decimal" placeholder="0">
        <button class="caja" id="ct-caja" ${empaque ? '' : 'style="display:none"'}>
          Caja completa<small>${cant(empaque)}</small></button>
      </div>
    </div>
    ${llevaba > 0
      ? `<div class="llevaba">En este lugar ya lleva <b>${cant(llevaba)}</b>.
           Lo que escriba se <b>suma</b> a eso.</div>`
      : ''}
    <div class="aviso malo oculto" id="ct-error"></div>
    <div class="acciones">
      <button class="btn secundario" id="ct-no">Cancelar</button>
      <button class="btn principal-b" id="ct-si">Agregar</button>
    </div>`;
  ver('#velo');

  const campo = $('#ct-cant');
  // El empaque entra propuesto: es lo que mas se escanea, una caja entera.
  if (empaque){ campo.value = cant(empaque); }
  campo.focus(); campo.select();
  campo.addEventListener('input', e => {
    e.target.value = e.target.value.replace(/[^0-9.]/g, '');
  });
  $('#ct-caja')?.addEventListener('click', () => {
    campo.value = cant(empaque); campo.focus(); campo.select();
  });
  campo.addEventListener('keydown', e => { if (e.key === 'Enter') $('#ct-si').click(); });

  $('#ct-no').onclick = cerrarHoja;
  $('#ct-si').onclick = async () => {
    const err = $('#ct-error');
    const n = Number(campo.value);
    if (!(n >= 0) || campo.value.trim() === ''){
      err.textContent = 'Ponga cuántas unidades hay.';
      err.classList.remove('oculto');
      return;
    }
    const b = $('#ct-si');
    b.disabled = true; b.innerHTML = '<span class="girando"></span>';
    const { data, error } = await sb.rpc('fn_auditar_producto', {
      p_auditoria_id:S.auditoria, p_producto_id:prod.producto_id,
      p_cantidad:n, p_lote_id:lote });
    b.disabled = false; b.textContent = 'Agregar';
    if (error){
      err.textContent = limpiarError(error);
      err.classList.remove('oculto');
      return;
    }
    await recargarAuditoria();
    hojaSumado(data);
  };
}

function hojaSumado(d){
  $('#hoja').innerHTML = `
    <h2>${escapar(d.producto)}</h2>
    <div class="aviso bien">
      ${Number(d.llevaba) > 0
        ? `Llevaba <b>${cant(d.llevaba)}</b> + ${cant(d.agregado)} = <b>${cant(d.total)}</b> ${escapar(d.unidad)}`
        : `<b>${cant(d.total)}</b> ${escapar(d.unidad)} en este lugar`}
    </div>
    <div class="acciones">
      <button class="btn secundario" id="su-no">Listo</button>
      <button class="btn principal-b" id="su-mas">Escanear otro</button>
    </div>`;
  ver('#velo');
  $('#su-no').onclick = cerrarHoja;
  $('#su-mas').onclick = () => { cerrarHoja(); escanearProducto(); };
}

/* Corregir a mano una linea ya escaneada */
function hojaCorregir(l){
  $('#hoja').innerHTML = `
    <h2>${escapar(l.producto)}</h2>
    <p class="sub">Corregir lo contado en este lugar. Esto <b>reemplaza</b>, no suma.</p>
    <div class="campo-g">
      <label for="cr-cant">Cantidad en este lugar</label>
      <div class="cant-g"><input id="cr-cant" inputmode="decimal" value="${cant(l.contado)}"></div>
    </div>
    <div class="llevaba">Se escaneó ${l.escaneos} ${l.escaneos === 1 ? 'vez' : 'veces'}.
      El sistema decía <b>${cant(l.sistema)}</b> aquí.</div>
    <div class="aviso malo oculto" id="cr-error"></div>
    <div class="acciones">
      <button class="btn secundario" id="cr-no">Cancelar</button>
      <button class="btn principal-b" id="cr-si">Guardar</button>
    </div>`;
  ver('#velo');
  const campo = $('#cr-cant');
  campo.focus(); campo.select();
  campo.addEventListener('input', e => {
    e.target.value = e.target.value.replace(/[^0-9.]/g, '');
  });
  $('#cr-no').onclick = cerrarHoja;
  $('#cr-si').onclick = async () => {
    const err = $('#cr-error');
    const n = Number(campo.value);
    if (!(n >= 0) || campo.value.trim() === ''){
      err.textContent = 'Ponga la cantidad.'; err.classList.remove('oculto'); return;
    }
    const b = $('#cr-si');
    b.disabled = true; b.innerHTML = '<span class="girando"></span>';
    const { error } = await sb.rpc('fn_auditar_producto', {
      p_auditoria_id:S.auditoria, p_producto_id:l.producto_id,
      p_cantidad:n, p_lote_id:l.lote_id, p_reemplazar:true });
    b.disabled = false; b.textContent = 'Guardar';
    if (error){ err.textContent = limpiarError(error); err.classList.remove('oculto'); return; }
    cerrarHoja();
    await recargarAuditoria();
  };
}

/* ================= completar ================= */
function hojaCompletar(){
  const faltan = S.lineas.filter(l => !l.escaneado);
  let vaciar = true;

  const pintarOpciones = () => `
    <button class="opcion ${vaciar ? 'activa' : ''}" data-v="1">
      <i></i>
      <span><b>Lo que no escaneé no está aquí</b>
        <small>Las ${faltan.length} ${faltan.length === 1 ? 'línea' : 'líneas'} de abajo
          quedan en cero en este lugar. Esas unidades pasan al piso de ventas,
          donde las encuentra el conteo.</small></span>
    </button>
    <button class="opcion ${vaciar ? '' : 'activa'}" data-v="0">
      <i></i>
      <span><b>Solo actualicé lo que escaneé</b>
        <small>Lo demás se queda como estaba. Úselo si auditó a medias.</small></span>
    </button>`;

  $('#hoja').innerHTML = `
    <h2>Completar la auditoría</h2>
    <p class="sub">${escapar(S.resumen.ubicacion)} · ${S.resumen.escaneados}
      ${S.resumen.escaneados === 1 ? 'producto' : 'productos'},
      ${cant(S.resumen.unidades)} unidades.</p>
    ${faltan.length ? `<div id="cp-ops">${pintarOpciones()}</div>
      <div class="titulin" style="margin-top:14px">Sin escanear</div>
      ${faltan.slice(0, 8).map(l => `<div class="ln pendiente">
        <div class="ln-txt"><b>${escapar(l.producto)}</b>
          <small>${escapar(l.sku)}${l.lote ? ' · lote ' + escapar(l.lote) : ''}</small></div>
        <div class="ln-n"><b>${cant(l.sistema)}</b><small>decía</small></div>
      </div>`).join('')}
      ${faltan.length > 8 ? `<div class="vacio" style="padding:8px">y ${faltan.length - 8} más</div>` : ''}`
     : '<div class="aviso bien">Se escaneó todo lo que el sistema tenía aquí.</div>'}
    <div class="aviso ojo">Esto <b>no cambia el total</b> del negocio: solo dice
      dónde está la mercadería.</div>
    <div class="aviso malo oculto" id="cp-error"></div>
    <div class="acciones">
      <button class="btn secundario" id="cp-no">Cancelar</button>
      <button class="btn principal-b" id="cp-si">Completar</button>
    </div>`;
  ver('#velo');

  $('#cp-ops')?.addEventListener('click', e => {
    const b = e.target.closest('[data-v]'); if (!b) return;
    vaciar = b.dataset.v === '1';
    $('#cp-ops').innerHTML = pintarOpciones();
  });
  $('#cp-no').onclick = cerrarHoja;
  $('#cp-si').onclick = async () => {
    const b = $('#cp-si');
    b.disabled = true; b.innerHTML = '<span class="girando"></span>';
    const { data, error } = await sb.rpc('fn_completar_auditoria', {
      p_auditoria_id:S.auditoria, p_vaciar_no_escaneados:vaciar });
    b.disabled = false; b.textContent = 'Completar';
    if (error){
      $('#cp-error').textContent = limpiarError(error);
      $('#cp-error').classList.remove('oculto');
      return;
    }
    $('#hoja').innerHTML = `
      <h2>${escapar(data.numero)}</h2>
      <p class="sub">${escapar(data.ubicacion)} · ${escapar(data.codigo)}</p>
      <div class="aviso bien">${data.actualizados}
        ${data.actualizados === 1 ? 'producto actualizado' : 'productos actualizados'},
        ${cant(data.unidades)} unidades.${data.vaciados
          ? ` ${data.vaciados} ${data.vaciados === 1 ? 'quedó' : 'quedaron'} en cero aquí.` : ''}</div>
      ${data.recortados ? `<div class="aviso ojo">${data.recortados}
        ${data.recortados === 1 ? 'producto se recortó' : 'productos se recortaron'}:
        se escaneó más de lo que hay en toda la sucursal. Eso no es de este lugar,
        es un faltante en otra parte.</div>` : ''}
      <button class="btn principal-b" style="width:100%" id="cp-ok">Entendido</button>`;
    $('#cp-ok').onclick = () => { cerrarHoja(); cargarLugares(); };
  };
}

function hojaCancelar(){
  $('#hoja').innerHTML = `
    <h2>Cancelar la auditoría</h2>
    <p class="sub">Nada de lo contado se aplica. El inventario se queda como está.</p>
    <div class="campo-g">
      <label for="cn-motivo">¿Por qué se cancela?</label>
      <input class="entrada" id="cn-motivo" placeholder="Me equivoqué de estante…">
    </div>
    <div class="aviso malo oculto" id="cn-error"></div>
    <div class="acciones">
      <button class="btn secundario" id="cn-no">Mejor no</button>
      <button class="btn principal-b" id="cn-si">Cancelar auditoría</button>
    </div>`;
  ver('#velo');
  $('#cn-motivo').focus();
  $('#cn-no').onclick = cerrarHoja;
  $('#cn-si').onclick = async () => {
    const motivo = $('#cn-motivo').value.trim();
    const err = $('#cn-error');
    if (!motivo){
      err.textContent = 'Diga por qué se cancela.'; err.classList.remove('oculto'); return;
    }
    const { error } = await sb.rpc('fn_cancelar_auditoria',
      { p_auditoria_id:S.auditoria, p_motivo:motivo });
    if (error){ err.textContent = limpiarError(error); err.classList.remove('oculto'); return; }
    cerrarHoja();
    cargarLugares();
  };
}

/* ================= pintar ================= */
function pintar(){
  if (S.cargando){
    $('#arriba').innerHTML = '';
    $('#pie').innerHTML = '';
    $('#cuerpo').className = 'cuerpo';
    $('#cuerpo').innerHTML = '<div class="vacio"><span class="girando"></span></div>';
    return;
  }
  if (S.vista === 'etiquetas') return pintarEtiquetas();
  if (S.vista === 'auditando') return pintarAuditando();
  return pintarLugares();
}

function pintarLugares(){
  $('#h-titulo').textContent = 'Auditoría';
  $('#pie').innerHTML = '';
  $('#cuerpo').className = 'cuerpo';

  $('#arriba').innerHTML = S.camara
    ? `<button class="escanear-g" id="btn-qr">
         <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor"
              stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
           <path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2"/>
           <rect x="7" y="7" width="4" height="4"/><rect x="13" y="13" width="4" height="4"/></svg>
         Escanear la ubicación
       </button>` : '';

  const bodegas = S.lugares.filter(u => u.tipo === 'bodega');
  const pisos   = S.lugares.filter(u => u.tipo === 'piso');

  const fila = u => {
    const sem = u.abierta ? '' : (alDia(u.auditada_en) ? 'ok' : (u.auditada_en ? 'viejo' : ''));
    return `<button class="ubi ${u.abierta ? 'abierta' : ''}" data-ubi="${u.ubicacion_id}">
      <span class="ubi-cod">${escapar(u.codigo || '—')}</span>
      <div class="ubi-txt">
        <b>${escapar(u.nombre)}</b>
        <small>${u.abierta
          ? 'Auditoría abierta · ' + escapar(u.abierta.numero)
          : (u.es_predeterminada
             ? 'No se audita: es el resto'
             : `${u.productos} ${u.productos === 1 ? 'producto' : 'productos'} · auditada ${cuando(u.auditada_en)}`)}</small>
      </div>
      <span class="ubi-sem ${sem}"></span>
    </button>`;
  };

  const sinDia = bodegas.filter(u => !alDia(u.auditada_en));

  $('#cuerpo').innerHTML = `
    ${bodegas.length ? (sinDia.length
      ? `<div class="aviso ojo">Para poder contar el piso de ventas, la bodega
           tiene que estar auditada hace menos de 24 horas.
           ${sinDia.length === bodegas.length ? 'Falta auditar toda la bodega.'
             : 'Falta: ' + escapar(sinDia.map(u => u.nombre).join(', ')) + '.'}</div>`
      : '<div class="aviso bien">La bodega está al día. Ya se puede contar el piso de ventas desde Consultar.</div>')
     : ''}

    <div class="titulin">Bodega</div>
    ${bodegas.length ? bodegas.map(fila).join('')
      : `<div class="vacio"><b>No hay ubicaciones de bodega</b>
           <p>Un supervisor puede crearlas en Catálogos y marcarlas como bodega.</p></div>`}

    <div class="titulin" style="margin-top:18px">Piso de ventas</div>
    ${pisos.map(fila).join('')}

    <button class="btn secundario no-imprimir" id="btn-etq"
            style="width:100%;margin-top:16px">Etiquetas QR para pegar</button>`;

  $('#btn-qr')?.addEventListener('click', escanearUbicacion);
  $('#btn-etq').addEventListener('click', () => { S.vista = 'etiquetas'; pintar(); });
  $('#cuerpo').querySelectorAll('[data-ubi]').forEach(b => {
    b.onclick = () => abrirAuditoria(b.dataset.ubi);
  });
}

function pintarAuditando(){
  const r = S.resumen;
  if (!r) return;
  $('#h-titulo').textContent = r.ubicacion;

  const escaneadas = S.lineas.filter(l => l.escaneado);
  const faltan     = S.lineas.filter(l => !l.escaneado);

  $('#arriba').innerHTML = `
    <button class="escanear-g" id="btn-prod">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2"/>
        <path d="M7 12h10"/></svg>
      Escanear producto
    </button>`;

  $('#cuerpo').className = 'cuerpo con-pie';
  $('#cuerpo').innerHTML = `
    <div class="ficha" style="padding:13px 15px">
      <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap">
        <span class="ubi-cod">${escapar(r.codigo || '')}</span>
        <div style="flex:1;min-width:0">
          <b style="font-size:14px">${escapar(r.numero)}</b>
          <small style="display:block;font-size:12px;color:var(--tenue);margin-top:2px">
            ${r.escaneados} ${r.escaneados === 1 ? 'producto' : 'productos'} ·
            ${cant(r.unidades)} unidades${r.sin_escanear
              ? ' · faltan ' + r.sin_escanear + ' por escanear' : ''}</small>
        </div>
      </div>
    </div>

    ${escaneadas.length ? `<div class="titulin">Escaneado</div>
      ${escaneadas.map(l => `<div class="ln" data-corregir="${l.producto_id}"
            data-lote="${l.lote_id || ''}">
        <div class="ln-txt">
          <b>${escapar(l.producto)}</b>
          <small>${escapar(l.sku)}${l.lote ? ' · lote ' + escapar(l.lote) : ''} ·
            ${l.escaneos} ${l.escaneos === 1 ? 'escaneo' : 'escaneos'}</small>
        </div>
        <div class="ln-n"><b>${cant(l.contado)}</b><small>contado</small></div>
      </div>`).join('')}` : ''}

    ${faltan.length ? `<div class="titulin" style="margin-top:16px">Falta escanear</div>
      ${faltan.map(l => `<div class="ln pendiente">
        <div class="ln-txt">
          <b>${escapar(l.producto)}</b>
          <small>${escapar(l.sku)}${l.lote ? ' · lote ' + escapar(l.lote) : ''}</small>
        </div>
        <div class="ln-n"><b>${cant(l.sistema)}</b><small>decía</small></div>
      </div>`).join('')}` : ''}

    ${!S.lineas.length ? `<div class="vacio"><b>Nada todavía</b>
      <p>Escanee el código de barras de cada caja. Si escanea el mismo producto
         dos veces, se suma: no hace falta contar las tres cajas juntas.</p></div>` : ''}`;

  $('#pie').innerHTML = `
    <div class="pie">
      <button class="btn secundario" id="btn-volver">Salir</button>
      ${r.puede_completar
        ? `<button class="btn principal-b" id="btn-completar">Completar</button>`
        : '<button class="btn secundario" id="btn-nada" disabled>La completa un supervisor</button>'}
    </div>`;

  $('#btn-prod').addEventListener('click', escanearProducto);
  $('#btn-volver').addEventListener('click', cargarLugares);
  $('#btn-completar')?.addEventListener('click', hojaCompletar);
  $('#cuerpo').querySelectorAll('[data-corregir]').forEach(d => {
    d.onclick = () => {
      const l = S.lineas.find(x => x.escaneado && x.producto_id === d.dataset.corregir
                 && (x.lote_id || '') === d.dataset.lote);
      if (l) hojaCorregir(l);
    };
  });
}

/* ================= etiquetas ================= */
async function pintarEtiquetas(){
  $('#h-titulo').textContent = 'Etiquetas';
  $('#arriba').innerHTML = '';
  $('#pie').innerHTML = '';
  $('#cuerpo').className = 'cuerpo';
  $('#cuerpo').innerHTML = `
    <div class="aviso ojo no-imprimir">Imprima esta hoja y pegue cada etiqueta en
      su estante. Al escanear el QR, el equipo abre la auditoría de ese lugar.
      Si la cámara falla, el código también se puede digitar.</div>
    <div class="etiquetas">
      ${S.lugares.filter(u => !u.es_predeterminada).map(u => `
        <div class="etq">
          <canvas data-qr="${escapar(u.codigo || '')}"></canvas>
          <b>${escapar(u.codigo || '')}</b>
          <small>${escapar(u.nombre)}</small>
        </div>`).join('')}
    </div>
    <div class="acciones no-imprimir">
      <button class="btn secundario" id="et-volver">Volver</button>
      <button class="btn principal-b" id="et-imp">Imprimir</button>
    </div>`;

  $('#et-volver').addEventListener('click', () => { S.vista = 'lugares'; pintar(); });
  $('#et-imp').addEventListener('click', () => window.print());

  // El dibujo del QR es lo unico que necesita internet. Si no carga, queda el
  // codigo en grande, que se puede digitar.
  try{
    const { default:QR } = await import('https://esm.sh/qrcode@1.5.4');
    for (const c of $('#cuerpo').querySelectorAll('canvas[data-qr]')){
      await QR.toCanvas(c, c.dataset.qr, { width:124, margin:1,
        color:{ dark:'#0F1729', light:'#FFFFFF' } });
    }
  }catch(e){
    for (const c of $('#cuerpo').querySelectorAll('canvas[data-qr]')){
      const d = document.createElement('div');
      d.className = 'sinqr';
      d.textContent = 'Sin internet para dibujar el QR. Digite el código.';
      c.replaceWith(d);
    }
  }
}

/* ================= al aire ================= */
arrancar();

if ('serviceWorker' in navigator)
  navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
