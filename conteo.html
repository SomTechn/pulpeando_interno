<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F1729">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" href="icono-192.png" type="image/png">
<link rel="apple-touch-icon" href="icono-192.png">
<title>Conteo · Pulpeando</title>
<script src="config.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="ui.css">
<style>
.zona{flex:1;display:flex;flex-direction:column;min-height:0;padding:14px 16px 0}

.tarjetas{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;
  margin-bottom:14px;flex:0 0 auto}
.tj{background:var(--panel);border:1px solid var(--linea);border-radius:var(--r-md);
  padding:12px 14px;min-width:0}
.tj small{display:block;font-size:11px;font-weight:800;letter-spacing:.04em;
  text-transform:uppercase;color:#9AA8BC;margin-bottom:4px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tj b{display:block;font-family:var(--num);font-size:20px;font-weight:700;line-height:1.1;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tj.bien b{color:var(--verde-oscuro)}
.tj.malo{background:#FFEDF1;border-color:#F6CBD6}
.tj.malo b{color:var(--rojo)}
.tj.ojo{background:#FFF4E0;border-color:#F0DCB0}
.tj.ojo b{color:#8A5A00}

.barra-busca{display:flex;gap:10px;margin-bottom:10px;flex:0 0 auto}
.filtros{display:flex;gap:7px;margin-bottom:12px;flex:0 0 auto;overflow-x:auto;
  scrollbar-width:none;padding-bottom:2px}
.filtros::-webkit-scrollbar{display:none}
.fl{padding:9px 14px;border-radius:999px;border:1.5px solid var(--linea);background:var(--panel);
  font-size:13px;font-weight:700;color:var(--tenue);white-space:nowrap;flex:0 0 auto}
.fl.activo{border-color:var(--azul);background:var(--azul-suave);color:var(--azul)}

/* El pie queda fijo abajo, asi que la lista deja espacio para que la ultima
   fila no se esconda detras de los botones. */
.lista{flex:1;overflow-y:auto;min-height:0;padding-bottom:16px}
.lista.con-pie{padding-bottom:88px}
.conteo-txt{font-size:12.5px;color:var(--tenue);margin-bottom:10px;flex:0 0 auto}

/* una linea del conteo: el campo de cantidad es lo importante */
.linea{
  display:flex;align-items:center;gap:12px;
  background:var(--panel);border:1px solid var(--linea);border-radius:var(--r-md);
  padding:11px 13px;margin-bottom:8px;
}
.linea.contada{border-color:#BFE3CE;background:#FBFEFC}
.linea.difiere{border-color:#F0DCB0;background:#FFFCF5}
.linea-txt{flex:1;min-width:0}
.linea-txt b{display:block;font-size:14.5px;font-weight:600;line-height:1.3}
/* El subtitulo NO se recorta: ahi va el lote y el vencimiento, que es lo que
   uno mira con el producto en la mano. Que la fila crezca es mejor que cortar
   justo esa parte. */
.linea-txt small{display:block;font-size:12px;color:var(--tenue);margin-top:2px;
  line-height:1.35}
.vence-pronto{color:var(--rojo);font-weight:700}
.cant{width:86px;flex:0 0 auto}
.cant input{width:100%;height:46px;border:1.5px solid var(--linea);border-radius:var(--r-sm);
  padding:0 10px;font-family:var(--num);font-size:17px;font-weight:600;text-align:right;
  outline:none;background:var(--panel)}
.cant input:focus{border-color:var(--azul)}
.cant input.puesta{border-color:var(--verde);background:#F6FDF9}
.dif{width:92px;flex:0 0 auto;text-align:right;font-family:var(--num);font-size:13.5px;
  font-weight:700}
.dif.mas{color:var(--verde-oscuro)}
.dif.menos{color:var(--rojo)}
.dif small{display:block;font-family:var(--ui);font-size:11px;font-weight:600;
  color:var(--tenue)}

.vacio{text-align:center;padding:48px 20px;color:var(--tenue)}
.vacio b{display:block;font-size:16px;color:var(--tinta);margin-bottom:6px}

/* lista de conteos anteriores */
.fila{display:flex;align-items:center;gap:13px;width:100%;text-align:left;
  background:var(--panel);border:1px solid var(--linea);border-radius:var(--r-md);
  padding:13px 15px;margin-bottom:9px}
.fila:hover{border-color:#C9D6E8}
.fila-txt{flex:1;min-width:0}
.fila-txt b{display:block;font-family:var(--num);font-size:14px;font-weight:600}
.fila-txt small{display:block;font-size:12.5px;color:var(--tenue);margin-top:3px}
.fila-fin{text-align:right;flex:0 0 auto;display:flex;flex-direction:column;
  align-items:flex-end;gap:3px}
.sello-c{display:inline-flex;padding:2px 9px;border-radius:999px;font-size:10.5px;
  font-weight:800;text-transform:uppercase;letter-spacing:.03em}
.sello-c.abierto{background:var(--azul-suave);color:var(--azul)}
.sello-c.aplicado{background:#E7F7EE;color:var(--verde-oscuro)}
.sello-c.cancelado{background:var(--fondo);color:var(--tenue)}

.pie-accion{
  flex:0 0 auto;padding:12px 0 calc(14px + env(safe-area-inset-bottom));
  border-top:1px solid var(--linea);background:var(--panel);
  display:flex;gap:10px;position:sticky;bottom:0;
}
.pie-accion .btn{flex:1}

.campo-g{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.campo-g label{font-size:12px;font-weight:700;color:var(--tenue)}
.entrada{height:50px;border:1.5px solid var(--linea);border-radius:var(--r-md);
  padding:0 14px;outline:none;font-size:15px;background:var(--panel);width:100%}
.entrada:focus{border-color:var(--azul)}

@media (max-width:1180px){ .tarjetas{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media (max-width:820px){
  .zona{padding:12px 14px 0}
  .tj b{font-size:17px}
  .dif{width:76px;font-size:12.5px}
  .cant{width:76px}
}
</style>
</head>
<body>

<div class="oscura oculto" id="p-config">
  <div class="tarjeta-oscura">
    <div class="marca"><span>◧</span> Configuración</div>
    <div class="titulo-o">Falta conectar el proyecto</div>
    <p class="sub-o">Ponga la URL y la llave publishable en <b>config.js</b>.</p>
  </div>
</div>

<div class="oscura oculto" id="p-sesion">
  <div class="tarjeta-oscura">
    <div class="marca"><span>◧</span> Conteo</div>
    <div class="titulo-o">Iniciar sesión</div>
    <p class="sub-o">Use el correo con el que su gerente lo dio de alta</p>
    <input class="campo-o" id="s-email" type="email" placeholder="correo@negocio.hn" autocomplete="username">
    <input class="campo-o" id="s-clave" type="password" placeholder="Contraseña" autocomplete="current-password">
    <div class="error-o" id="s-error"></div>
    <button class="btn-o" id="s-entrar">Entrar</button>
  </div>
</div>

<div class="oscura oculto" id="p-bloqueado">
  <div class="tarjeta-oscura">
    <div class="marca"><span>◧</span> Conteo</div>
    <div class="titulo-o" id="bl-titulo">Sin permiso</div>
    <p class="sub-o" id="bl-texto"></p>
    <a class="btn-o" href="index.html" style="display:block;line-height:52px">Ir a la caja</a>
    <button class="btn-o fantasma" id="bl-salir">Cerrar sesión</button>
  </div>
</div>

<div class="armazon oculto" id="app">
  <aside id="menu"></aside>

  <div class="principal">
    <header class="barra">
      <button class="hamburguesa" id="abrir-menu" aria-label="Menú">
        <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <div class="barra-titulo">
        <b id="h-titulo">Conteo de inventario</b>
        <small id="h-sucursal">—</small>
      </div>
      <div class="barra-fin">
        <span class="pill" id="h-usuario">—</span>
      </div>
    </header>

    <div class="zona" id="zona"></div>
  </div>
</div>

<div class="velo oculto" id="velo"><div class="hoja" id="hoja"></div></div>

<script type="module">
const CFG = window.SUPABASE_CONFIG || {};
const SUPABASE_URL = CFG.url || 'PEGUE_AQUI_LA_URL';
const SUPABASE_KEY = CFG.key || 'PEGUE_AQUI_LA_LLAVE';

const $ = s => document.querySelector(s);
const ver = (id, si = true) => $(id).classList.toggle('oculto', !si);

if (SUPABASE_URL.startsWith('PEGUE')){ ver('#p-config'); throw new Error('sin configurar'); }

import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
import { montarMenu, escapar } from './menu.js';
import { escanear, hayCamara } from './escaner.js';

const sb = createClient(SUPABASE_URL, SUPABASE_KEY, {
  auth:{ persistSession:true, autoRefreshToken:true }
});

const S = {
  ctx:null, sucursal:null, moneda:'L', menu:null, nivel:0,
  vista:'lista',            // lista · contando
  conteos:[], conteo:null, resumen:{}, lineas:[],
  busqueda:'', filtro:'todas',
  categorias:[], proveedores:[]
};

const money = n => S.moneda + ' ' + Math.abs(Number(n)||0).toLocaleString('es-HN',
  { minimumFractionDigits:2, maximumFractionDigits:2 });
const num = n => Number(n ?? 0).toLocaleString('es-HN', { maximumFractionDigits:3 });

/* Una diferencia se dice en palabras, no con un signo. "L -35.00" se lee mal
   y peor en voz alta; "Falta L 35.00" se entiende de una. */
const comoDiferencia = n => {
  const v = Number(n) || 0;
  if (v === 0) return { palabra:'Cuadra', monto:'', clase:'bien' };
  return v < 0
    ? { palabra:'Falta', monto:money(v), clase:'malo' }
    : { palabra:'Sobra', monto:money(v), clase:'bien' };
};

function limpiarError(e){
  // Antes se cortaba hasta el primer ":", lo que se comia la mitad de los
  // mensajes propios: "Falta: Bodega de arriba" quedaba en "Bodega de
  // arriba". Ahora solo se quita el prefijo tecnico de Postgres.
  const m = (e?.message || String(e))
    .replace(/^(?:[0-9A-Z]{5}|error|Error|ERROR):\s*/, '');
  if (/JWT|token/i.test(m)) return 'La sesión venció. Vuelva a entrar.';
  if (/Failed to fetch|NetworkError/i.test(m)) return 'Sin conexión con el servidor';
  return m;
}

function aviso(titulo, texto){
  $('#hoja').innerHTML = `<h2>${escapar(titulo)}</h2>
    <p class="sub">${escapar(texto)}</p>
    <button class="btn principal-b" style="width:100%" id="ok">Entendido</button>`;
  ver('#velo');
  $('#ok').onclick = () => ver('#velo', false);
}

/* ================= sesión ================= */
$('#s-entrar').addEventListener('click', async () => {
  const b = $('#s-entrar');
  $('#s-error').textContent = '';
  b.disabled = true; b.innerHTML = '<span class="girando"></span>';
  const { error } = await sb.auth.signInWithPassword({
    email:$('#s-email').value.trim(), password:$('#s-clave').value });
  b.disabled = false; b.textContent = 'Entrar';
  if (error){ $('#s-error').textContent = 'Correo o contraseña incorrectos'; return; }
  arrancar();
});
$('#s-clave').addEventListener('keydown', e => { if (e.key === 'Enter') $('#s-entrar').click(); });
$('#bl-salir').addEventListener('click', async () => { await sb.auth.signOut(); location.reload(); });

/* ================= arranque ================= */
async function arrancar(){
  const { data:{ session } } = await sb.auth.getSession();
  if (!session){ ver('#p-sesion'); return; }
  ver('#p-sesion', false);

  const { data, error } = await sb.rpc('fn_pos_contexto');
  if (error){
    ver('#p-sesion');
    $('#s-error').textContent = 'Su usuario no tiene perfil en ningún negocio';
    await sb.auth.signOut();
    return;
  }
  S.ctx = data;
  S.nivel = data.usuario.nivel;
  S.moneda = data.organizacion.moneda === 'HNL' ? 'L' : data.organizacion.moneda;

  if (S.nivel < 1){
    ver('#p-bloqueado');
    $('#bl-titulo').textContent = 'Esta pantalla no es para su rol';
    $('#bl-texto').textContent = 'El conteo lo hace el personal de la tienda.';
    return;
  }

  S.sucursal = data.sucursales[0]?.id || null;
  $('#h-usuario').textContent = data.usuario.nombre;
  $('#h-sucursal').textContent = data.sucursales[0]?.nombre || '';
  $('#app').classList.remove('oculto');

  S.menu = montarMenu({
    contenedor:'#menu', modulo:'conteo', ctx:S.ctx,
    alSalir: async () => { await sb.auth.signOut(); location.reload(); }
  });
  $('#abrir-menu').addEventListener('click', () => S.menu.alternar());

  await cargarAuxiliares();
  await cargarLista();
}

async function cargarAuxiliares(){
  const [cat, pro] = await Promise.all([
    sb.from('categorias').select('id,nombre').eq('activa', true).order('nombre'),
    sb.from('proveedores').select('id,nombre').order('nombre')
  ]);
  S.categorias = cat.data || [];
  S.proveedores = pro.data || [];
}

/* ================= la lista de conteos ================= */
async function cargarLista(){
  S.vista = 'lista'; S.conteo = null;
  $('#h-titulo').textContent = 'Conteo de inventario';
  $('#zona').innerHTML = '<div class="vacio"><span class="girando"></span></div>';

  const { data, error } = await sb.rpc('fn_conteos', { p_limite:30 });
  if (error){ aviso('No se pudieron leer los conteos', limpiarError(error)); return; }
  S.conteos = data || [];
  pintarLista();
}

function pintarLista(){
  const abierto = S.conteos.find(c => c.estado === 'abierto');
  const puedeAbrir = S.nivel >= 2;

  const filas = S.conteos.length
    ? S.conteos.map(c => {
        const cuando = new Date(c.abierto_en).toLocaleString('es-HN',
          { day:'numeric', month:'short', hour:'numeric', minute:'2-digit' });
        const d = comoDiferencia(c.valor);
        const valor = (c.valor !== null && c.valor !== undefined && c.estado === 'aplicado')
          ? `<small style="font-size:12px;color:${d.clase === 'malo' ? 'var(--rojo)' : 'var(--verde-oscuro)'}">
               ${d.palabra}${d.monto ? ' ' + d.monto : ''}</small>` : '';
        return `
          <button class="fila" data-id="${escapar(c.conteo_id)}">
            <span class="fila-txt">
              <b>${escapar(c.numero)}</b>
              <small>${escapar(cuando)} · ${escapar(c.detalle)}
                · ${c.contadas} de ${c.lineas} contados${
                c.abierto_por ? ' · ' + escapar(c.abierto_por) : ''}</small>
            </span>
            <span class="fila-fin">
              <span class="sello-c ${c.estado}">${c.estado}</span>
              ${valor}
            </span>
          </button>`;
      }).join('')
    : `<div class="vacio"><b>Todavía no ha contado nada</b>
        Un conteo compara lo que hay en el estante con lo que dice el sistema.
        ${puedeAbrir ? 'Empiece por uno.' : 'Pídale a su supervisor que abra uno.'}</div>`;

  $('#zona').innerHTML = `
    ${abierto ? `<div class="aviso ojo" style="margin-bottom:14px">
      Hay un conteo abierto (${escapar(abierto.numero)}), ${abierto.contadas} de
      ${abierto.lineas} productos contados. Ábralo para seguir.</div>` : ''}
    <div class="lista con-pie">${filas}</div>
    ${puedeAbrir && !abierto ? `<div class="pie-accion">
      <button class="btn principal-b" id="btn-nuevo">Empezar un conteo</button>
    </div>` : ''}`;

  $('#zona').querySelectorAll('[data-id]').forEach(x =>
    x.addEventListener('click', () => abrirConteo(x.dataset.id)));
  $('#btn-nuevo')?.addEventListener('click', preguntarAlcance);
}

/* ================= abrir uno nuevo ================= */
function preguntarAlcance(){
  $('#hoja').innerHTML = `
    <h2>Empezar un conteo</h2>
    <p class="sub">Puede contar todo el inventario o solo una parte. Mientras el
      conteo esté abierto se puede seguir vendiendo: lo que se venda después de
      contar un producto no se pierde.</p>
    <div class="campo-g">
      <label for="al-alcance">¿Qué va a contar?</label>
      <select class="entrada" id="al-alcance">
        <option value="general">Todo el inventario</option>
        <option value="categoria">Una categoría</option>
        <option value="proveedor">Lo de un proveedor</option>
      </select>
    </div>
    <div class="campo-g oculto" id="caja-cat">
      <label for="al-cat">Categoría</label>
      <select class="entrada" id="al-cat">
        ${S.categorias.map(c => `<option value="${escapar(c.id)}">${escapar(c.nombre)}</option>`).join('')}
      </select>
    </div>
    <div class="campo-g oculto" id="caja-pro">
      <label for="al-pro">Proveedor</label>
      <select class="entrada" id="al-pro">
        ${S.proveedores.map(p => `<option value="${escapar(p.id)}">${escapar(p.nombre)}</option>`).join('')}
      </select>
    </div>
    <div class="campo-g">
      <label for="al-notas">Nota (opcional)</label>
      <input class="entrada" id="al-notas" placeholder="Conteo del lunes, antes de pedir…">
    </div>
    <div class="aviso malo oculto" id="al-error"></div>
    <div class="acciones">
      <button class="btn secundario" id="al-no">Cancelar</button>
      <button class="btn principal-b" id="al-si">Empezar</button>
    </div>`;
  ver('#velo');

  const refrescar = () => {
    const v = $('#al-alcance').value;
    ver('#caja-cat', v === 'categoria');
    ver('#caja-pro', v === 'proveedor');
  };
  $('#al-alcance').onchange = refrescar;
  refrescar();

  $('#al-no').onclick = () => ver('#velo', false);
  $('#al-si').onclick = async () => {
    const b = $('#al-si'), err = $('#al-error');
    const alcance = $('#al-alcance').value;
    err.classList.add('oculto');

    if (alcance === 'categoria' && !$('#al-cat').value){
      err.textContent = 'Primero cree una categoría en Catálogos.';
      err.classList.remove('oculto'); return;
    }
    if (alcance === 'proveedor' && !$('#al-pro').value){
      err.textContent = 'Primero cree un proveedor en Catálogos.';
      err.classList.remove('oculto'); return;
    }

    b.disabled = true; b.innerHTML = '<span class="girando"></span>';
    const { data, error } = await sb.rpc('fn_abrir_conteo', {
      p_sucursal_id:S.sucursal,
      p_alcance:alcance,
      p_categoria_id:alcance === 'categoria' ? $('#al-cat').value : null,
      p_proveedor_id:alcance === 'proveedor' ? $('#al-pro').value : null,
      p_notas:$('#al-notas').value.trim() || null
    });
    b.disabled = false; b.textContent = 'Empezar';

    if (error){ err.textContent = limpiarError(error); err.classList.remove('oculto'); return; }
    ver('#velo', false);
    await abrirConteo(data.conteo_id);
  };
}

/* ================= contando ================= */
async function abrirConteo(id){
  S.vista = 'contando';
  $('#zona').innerHTML = '<div class="vacio"><span class="girando"></span></div>';

  const [res, lin] = await Promise.all([
    sb.rpc('fn_conteo_resumen', { p_conteo_id:id }),
    sb.rpc('fn_conteo_lineas', { p_conteo_id:id, p_limite:500 })
  ]);
  if (res.error){ aviso('No se pudo abrir el conteo', limpiarError(res.error)); return; }
  S.resumen = res.data || {};
  S.lineas = lin.data || [];
  S.conteo = id;
  S.busqueda = ''; S.filtro = 'todas';
  $('#h-titulo').textContent = 'Conteo ' + (S.resumen.numero || '');
  pintarConteo();
}

async function recargarLineas(){
  const [res, lin] = await Promise.all([
    sb.rpc('fn_conteo_resumen', { p_conteo_id:S.conteo }),
    sb.rpc('fn_conteo_lineas', { p_conteo_id:S.conteo,
      p_buscar:S.busqueda || null,
      p_solo_pendientes:S.filtro === 'pendientes',
      p_solo_diferencias:S.filtro === 'diferencias',
      p_limite:500 })
  ]);
  if (!res.error) S.resumen = res.data || {};
  if (!lin.error) S.lineas = lin.data || [];
  pintarConteo();
}

function pintarConteo(){
  const r = S.resumen;
  const abierto = r.estado === 'abierto';
  const veDif = r.con_diferencia !== null && r.con_diferencia !== undefined;

  const tarjetas = `
    <div class="tj"><small>Contados</small><b>${r.contadas || 0} de ${r.lineas || 0}</b></div>
    <div class="tj ${(r.pendientes || 0) > 0 ? 'ojo' : 'bien'}">
      <small>Faltan por contar</small><b>${r.pendientes || 0}</b></div>
    ${veDif ? (() => {
      const dif = comoDiferencia(r.valor_diferencia);
      return `
      <div class="tj ${(r.con_diferencia || 0) > 0 ? 'ojo' : 'bien'}">
        <small>Con diferencia</small><b>${r.con_diferencia || 0}</b></div>
      <div class="tj ${dif.clase === 'malo' ? 'malo' : 'bien'}">
        <small>${dif.palabra}</small><b>${dif.monto || '—'}</b></div>`;
    })() : ''}`;

  const camara = hayCamara()
    ? `<button class="btn-camara" id="btn-camara" aria-label="Escanear">
         <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor"
              stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
           <path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2M7 12h10"/>
         </svg></button>` : '';

  const lineas = S.lineas.length
    ? S.lineas.map(l => {
        const contada = l.contada !== null && l.contada !== undefined;
        const dif = l.diferencia;
        const hayDif = dif !== null && dif !== undefined && Number(dif) !== 0;
        const vence = l.vence
          ? (() => {
              const dias = Math.round((new Date(l.vence) - new Date()) / 86400000);
              return `<span class="${dias <= 15 ? 'vence-pronto' : ''}">vence ${
                new Date(l.vence).toLocaleDateString('es-HN',
                  { day:'numeric', month:'short' })}</span>`;
            })() : '';
        const sub = [l.lote ? 'lote ' + escapar(l.lote) : '', vence,
                     l.sku ? escapar(l.sku) : '', escapar(l.categoria)]
                    .filter(Boolean).join(' · ');
        const col = hayDif
          ? `<span class="dif ${Number(dif) > 0 ? 'mas' : 'menos'}">
               ${Number(dif) > 0 ? '+' : ''}${num(dif)}
               <small>sistema ${num(l.sistema)}</small></span>`
          : (l.sistema !== null && l.sistema !== undefined && contada
             ? `<span class="dif"><small>cuadra</small></span>` : '<span class="dif"></span>');
        return `
          <div class="linea ${contada ? (hayDif ? 'difiere' : 'contada') : ''}"
               data-linea="${escapar(l.linea_id)}">
            <span class="linea-txt">
              <b>${escapar(l.producto)}</b>
              <small>${sub}</small>
            </span>
            <span class="cant">
              <input inputmode="decimal" placeholder="—"
                     ${abierto ? '' : 'disabled'}
                     value="${contada ? num(l.contada) : ''}"
                     class="${contada ? 'puesta' : ''}"
                     data-prod="${escapar(l.producto_id)}"
                     data-lote="${escapar(l.lote_id || '')}">
            </span>
            ${col}
          </div>`;
      }).join('')
    : `<div class="vacio"><b>${S.busqueda ? 'Nada con ese nombre' : 'Nada que mostrar'}</b>
        ${S.busqueda ? 'Pruebe con otra palabra o con el código.' : 'Cambie el filtro.'}</div>`;

  const pie = abierto
    ? `<div class="pie-accion">
         ${S.nivel >= 2 ? `<button class="btn secundario" id="btn-cancelar"
            style="color:var(--rojo)">Cancelar</button>` : ''}
         ${S.nivel >= 3 ? `<button class="btn principal-b" id="btn-aplicar">
            Aplicar el conteo</button>` : ''}
       </div>`
    : `<div class="pie-accion">
         <button class="btn secundario" id="btn-volver">Volver a la lista</button>
       </div>`;

  const encabezado = !abierto
    ? `<div class="aviso ${r.estado === 'aplicado' ? 'bueno' : 'malo'}" style="margin-bottom:14px">
         ${r.estado === 'aplicado'
           ? `Este conteo ya se aplicó${r.cerrado_por ? ' (' + escapar(r.cerrado_por) + ')' : ''}.
              El inventario quedó como se contó.`
           : `Este conteo se canceló${r.motivo_cancelacion
              ? ': ' + escapar(r.motivo_cancelacion) : ''}. No cambió nada.`}
       </div>`
    : '';

  $('#zona').innerHTML = `
    <div class="tarjetas">${tarjetas}</div>
    ${encabezado}
    <div class="barra-busca">
      <label class="campo">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="buscar" placeholder="Buscar o escanear" autocomplete="off"
               value="${escapar(S.busqueda)}">
      </label>
      ${camara}
    </div>
    <div class="filtros" id="filtros">
      <button class="fl ${S.filtro === 'todas' ? 'activo' : ''}" data-f="todas">Todos</button>
      <button class="fl ${S.filtro === 'pendientes' ? 'activo' : ''}" data-f="pendientes">Falta contar</button>
      ${veDif ? `<button class="fl ${S.filtro === 'diferencias' ? 'activo' : ''}"
         data-f="diferencias">Con diferencia</button>` : ''}
    </div>
    <div class="conteo-txt">${S.lineas.length} ${S.lineas.length === 1 ? 'producto' : 'productos'}</div>
    <div class="lista con-pie" id="lista">${lineas}</div>
    ${pie}`;

  const b = $('#buscar');
  b.addEventListener('input', e => {
    S.busqueda = e.target.value;
    clearTimeout(b._t); b._t = setTimeout(recargarLineas, 320);
  });
  $('#filtros').addEventListener('click', e => {
    const f = e.target.closest('.fl'); if (!f) return;
    S.filtro = f.dataset.f; recargarLineas();
  });
  $('#lista').querySelectorAll('input[data-prod]').forEach(x => {
    x.addEventListener('keydown', ev => { if (ev.key === 'Enter') x.blur(); });
    x.addEventListener('change', () => guardarCantidad(x));
  });
  $('#btn-camara')?.addEventListener('click', escanearCodigo);
  $('#btn-volver')?.addEventListener('click', cargarLista);
  $('#btn-cancelar')?.addEventListener('click', preguntarCancelar);
  $('#btn-aplicar')?.addEventListener('click', preguntarAplicar);
}

/* Se guarda producto por producto, al salir del campo. Contar es una tarea
   larga y de pie: perder media hora porque no se toco "guardar" al final no
   es una opcion. */
async function guardarCantidad(input){
  const txt = input.value.trim();
  if (txt === '') return;
  // El signo menos NO se limpia: si se quitara, escribir -3 grabaria 3 sin
  // que nadie se entere. Se conserva para poder rechazarlo.
  const cant = parseFloat(txt.replace(/[^0-9.-]/g, ''));
  if (isNaN(cant) || cant < 0){
    input.value = '';
    aviso('Cantidad inválida', 'Escriba cuántos hay. No puede ser negativo.');
    return;
  }

  input.disabled = true;
  const { data, error } = await sb.rpc('fn_contar', {
    p_conteo_id:S.conteo,
    p_producto_id:input.dataset.prod,
    p_cantidad:cant,
    p_lote_id:input.dataset.lote || null
  });
  input.disabled = false;

  if (error){
    aviso('No se pudo guardar', limpiarError(error));
    return;
  }
  input.classList.add('puesta');
  await recargarLineas();
}

async function escanearCodigo(){
  const codigo = await escanear();
  if (!codigo) return;
  S.busqueda = codigo;
  await recargarLineas();
  // Si quedo una sola linea, el cursor va directo a su cantidad
  const campos = $('#lista').querySelectorAll('input[data-prod]');
  if (campos.length === 1){ campos[0].focus(); campos[0].select(); }
}

/* ================= cerrar ================= */
function preguntarCancelar(){
  $('#hoja').innerHTML = `
    <h2>Cancelar el conteo</h2>
    <p class="sub">No se cambia nada del inventario. Lo contado queda guardado
      como registro, pero no se aplica.</p>
    <div class="campo-g">
      <label for="cc-motivo">¿Por qué se cancela?</label>
      <input class="entrada" id="cc-motivo" placeholder="Me equivoqué de alcance…">
    </div>
    <div class="aviso malo oculto" id="cc-error"></div>
    <div class="acciones">
      <button class="btn secundario" id="cc-no">Mejor no</button>
      <button class="btn principal-b" id="cc-si" style="background:var(--rojo);
        box-shadow:0 6px 18px -6px rgba(225,29,72,.6)">Cancelar el conteo</button>
    </div>`;
  ver('#velo');
  $('#cc-no').onclick = () => ver('#velo', false);
  $('#cc-si').onclick = async () => {
    const b = $('#cc-si'), err = $('#cc-error');
    const motivo = $('#cc-motivo').value.trim();
    err.classList.add('oculto');
    if (!motivo){
      err.textContent = 'Escriba por qué. Queda apuntado.';
      err.classList.remove('oculto'); return;
    }
    b.disabled = true; b.innerHTML = '<span class="girando"></span>';
    const { error } = await sb.rpc('fn_cancelar_conteo',
      { p_conteo_id:S.conteo, p_motivo:motivo });
    b.disabled = false; b.textContent = 'Cancelar el conteo';
    if (error){ err.textContent = limpiarError(error); err.classList.remove('oculto'); return; }
    ver('#velo', false);
    await cargarLista();
  };
}

function preguntarAplicar(){
  const r = S.resumen;
  const faltan = r.pendientes || 0;
  $('#hoja').innerHTML = `
    <h2>Aplicar el conteo</h2>
    <p class="sub">El inventario se ajusta a lo que usted contó. Cada ajuste
      queda en el kardex con su nombre y la fecha.</p>

    ${faltan > 0 ? `<div class="aviso ojo">Quedan ${faltan} productos sin contar.
      Esos no se tocan: su existencia queda como está.</div>` : ''}

    <div class="cuenta-aplicar" style="background:var(--fondo);border-radius:var(--r-md);
         padding:14px 16px;margin-bottom:14px">
      <div style="display:flex;justify-content:space-between;padding:3px 0;font-size:14px">
        <span>Sobrantes</span><b>${r.sobrantes || 0} productos</b></div>
      <div style="display:flex;justify-content:space-between;padding:3px 0;font-size:14px">
        <span>Faltantes</span><b>${r.faltantes || 0} productos</b></div>
      <div style="display:flex;justify-content:space-between;padding:9px 0 0;margin-top:7px;
           border-top:1px solid var(--linea);font-size:16px;font-weight:700">
        <span>${comoDiferencia(r.valor_diferencia).palabra}</span>
        <b style="color:${comoDiferencia(r.valor_diferencia).clase === 'malo'
             ? 'var(--rojo)' : 'var(--verde-oscuro)'}">
          ${comoDiferencia(r.valor_diferencia).monto || '—'}</b></div>
    </div>

    ${Number(r.valor_diferencia) < 0
      ? `<div class="aviso malo">Le falta mercadería por ${money(r.valor_diferencia)}.
          Antes de aplicar vale la pena revisar las diferencias grandes: a veces es
          un producto mal contado y no una pérdida.</div>` : ''}

    <div class="aviso malo oculto" id="ap-error"></div>
    <div class="acciones">
      <button class="btn secundario" id="ap-no">Todavía no</button>
      <button class="btn principal-b" id="ap-si">Aplicar</button>
    </div>`;
  ver('#velo');
  $('#ap-no').onclick = () => ver('#velo', false);
  $('#ap-si').onclick = async () => {
    const b = $('#ap-si'), err = $('#ap-error');
    err.classList.add('oculto');
    b.disabled = true; b.innerHTML = '<span class="girando"></span>';
    const { data, error } = await sb.rpc('fn_aplicar_conteo', { p_conteo_id:S.conteo });
    b.disabled = false; b.textContent = 'Aplicar';
    if (error){ err.textContent = limpiarError(error); err.classList.remove('oculto'); return; }
    ver('#velo', false);
    await abrirConteo(S.conteo);
    aviso('Conteo aplicado',
      `${data.sobrantes} productos subieron, ${data.faltantes} bajaron y `
      + `${data.sin_cambio} ya estaban bien. `
      + (data.sin_contar > 0 ? `${data.sin_contar} quedaron sin contar y no se tocaron. ` : '')
      + `La diferencia vale ${money(data.valor_diferencia)}.`);
  };
}

$('#velo').addEventListener('click', e => { if (e.target.id === 'velo') ver('#velo', false); });

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
arrancar();
</script>
